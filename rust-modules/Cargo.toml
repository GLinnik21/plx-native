[package]
name = "plxnative-modules"
# THE version, in three places that ci/check-package.py keeps in step: here, pkg/appinfo.json
# (which the ipk derives its filename and control entry from), and the X-Plex-Version this client
# reports to both Plex services via env!("CARGO_PKG_VERSION") in src/plex/identity.rs.
version = "0.4.1"
edition = "2021"
# The crate is a staticlib and is never published to crates.io, so these are not for a registry —
# they are so `cargo metadata` and any SBOM tool agree with the repo's own LICENSE, which is the
# provenance a webosbrew reviewer reads. The manifest asserting nothing while the root said MIT
# was a contradiction with no upside.
license = "MIT"
description = "Application core for PlxNative — an unofficial native Plex client for LG webOS."
repository = "https://github.com/GLinnik21/plx-native"

# Static library linked into the C app (hybrid migration): each ported module
# exposes the same C ABI its src/*.h declares, so the C code calls it unchanged.
[lib]
name = "plxnative_modules"
# `staticlib` is what the Makefile links into the ARM binary. `rlib` is additionally required so
# the host simulator binary below can depend on this same crate as a Rust library — a bin target
# cannot link a staticlib-only crate. It costs the cross build one extra artifact and changes
# nothing about the `.a` the Makefile picks up.
crate-type = ["staticlib", "rlib"]

# The macOS/desktop UI simulator. Not built by `make`, not shipped, and inert unless its feature is
# on — see the `hostsim` feature below and `src/bin/sim.rs`.
[[bin]]
name = "plxnative-sim"
path = "src/bin/sim.rs"
required-features = ["hostsim"]

[features]
# On by default, so every ordinary `make`, every `make test` and every on-device harness run
# behaves exactly as it always has. `make RELEASE=1` passes --no-default-features, which is what
# CI's release job builds with.
default = ["devtools", "devtriggers"]
# Developer-facing chrome that must not reach a public build. Currently: the on-screen
# seven-segment counter. Everything gated here must be DRAW-ONLY or otherwise inert — the device
# is the only test this project has, so a release build must not differ from the tested one in
# any way that could change behaviour, only in what it paints.
devtools = []
# The `/tmp/plxnative-*` trigger surface, the remote FIFO and the live capture listener — see
# src/dev.rs. This one DOES change behaviour, which is exactly why it is a second feature rather
# than more things under `devtools`: that name promises draw-only, and the promise is worth
# keeping. Both are default-on and both are dropped by the same `--no-default-features`, so the
# Makefile and the release workflow needed no change.
#
# Nothing in the dev loop constrains this: `make run`/`run-stream` touch `/tmp` only to clear and
# read back the event log, and `tests/run.py` builds with plain `make` — the harness never builds
# a release binary, so gating the whole surface costs it nothing.
devtriggers = []
# **Lab Diagnostics** — the ring buffer, the Blue-button trigger and the pinned upload that get a
# diagnostic log off a television in LG Cloud Test Lab, where there is no ssh, no console and no
# way to download a file. See `rust-modules/src/lab/` and `docs/lab-diagnostics.md`.
#
# OFF by default, and deliberately NOT in the default set the way `devtools`/`devtriggers` are:
# those are dropped by `RELEASE=1`, i.e. by remembering a flag, and this one must be impossible to
# ship by forgetting one. `make LAB=1 …` turns it on and gives it its own `--target-dir`.
#
# It is additive in the cargo sense — nothing behind it replaces or reshapes any other path. What
# it adds: a bounded in-memory copy of the lines `crate::log` already writes, one key arm, one row
# in two menus, one overlay, and one pinned HTTPS POST. Everything else compiles identically.
lab-diagnostics = []
# The desktop UI simulator. OFF by default, so no ordinary `make`, `make check` or harness run is
# affected in any way; `cargo build --features hostsim` selects it.
#
# It is an ADDITIVE feature in the cargo sense only by convention — it swaps `player::ffi`'s seam
# for `ffi_host.rs` rather than adding to it. That is safe here because this crate is a leaf with
# no dependents, so feature unification can never enable it behind someone's back. Do not give it
# a mutually-exclusive partner feature; the television is the DEFAULT, and the simulator opts in.
#
# What it changes, and nothing else: the media seam (29 symbols that exist only on a television),
# the GL context request (macOS has no GLES2 driver), the window flags, the keyboard event decode
# (LG's SDL fork shifts SDL_KeyboardEvent; stock SDL2 does not), and the wayland/glib calls that
# have no host equivalent. Everything else — all of `ui/`, the whole Plex data layer, the demux
# orchestration — is compiled identically for both.
hostsim = []

# Warnings are ERRORS, for this crate, in every cargo invocation — build, check, test, clippy, the
# ARM cross-build and the simulator alike. The tree reached zero warnings in all four
# configurations on 2026-08-15 (five of them had been standing long enough to read as background
# noise, three being `static_mut_refs` — a FUTURE HARD ERROR — and one a doc that claimed a caller
# that did not exist). A count that only ever goes up is not a signal, so the floor is nailed down
# rather than documented.
#
# **In `[lints]`, deliberately, and not `-D warnings` in RUSTFLAGS.** This table applies to THIS
# crate alone. RUSTFLAGS reaches every dependency and — because `-Z build-std` compiles the
# standard library from source — std itself, so a warning in code we neither own nor can patch
# would break our build, and the usual escape (`--cap-lints`) cannot separate the two. Same
# reasoning as `.cargo/config.toml`'s codegen flags: bind the rule to the thing it is about.
#
# Escape hatch while mid-edit, without touching the file — `--cap-lints` puts a CEILING on every
# lint level, so the deny above comes back out as a warning and you still SEE it:
#     RUSTFLAGS="--cap-lints=warn" cargo check --lib     # host
#     make CAPLINTS=1 …                                  # cross-build, WERROR= for the C half
# Use the make variable rather than exporting RUSTFLAGS at `make` — that variable REPLACES
# `.cargo/config.toml`'s list wholesale, so it would silently drop `target-cpu=cortex-a9` and hand
# you a binary that SIGILLs at boot. (`--config 'lints.rust.warnings="warn"'` does NOT work, though
# it reads as if it should: `--config` overrides `.cargo/config.toml`, and `[lints]` is a MANIFEST
# key. It fails closed — the build still errors — so the trap costs a rebuild, not a bad artifact.)
#
# `make check` is what must be clean before a commit. If a warning is genuinely wrong for a site,
# the fix is a NARROW `#[allow]` carrying the reason — see `gfx.rs`'s `CapChain::out` or the
# `cfg(test)`-only SDL declarations in `app.rs` for the shape.
#
# One warning survives all of this and is not a lint: `unstable feature specified for
# -Ctarget-feature: neon`, which rustc emits on the command line for every ARM build. It cannot be
# denied here and must not be — dropping the flag fails the build outright. Measurement and the
# responsible crate are recorded in `.cargo/config.toml`.
[lints.rust]
warnings = "deny"

[dependencies]
# safe pure-Rust JPEG/PNG decoders — replaces vendored stb_image.h (~8k lines C)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# raw socket/libc FFI for the stream module (correct constants + struct layouts)
libc = "0.2"
# JSON parsing for the pms module (replaces the C's hand-rolled string scrape)
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# derive(Deserialize) for the typed plex API response models (src/plex/models.rs)
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[profile.release]
opt-level = 2
