[package]
name = "plxnative-modules"
# THE version, in three places that ci/check-package.py keeps in step: here, pkg/appinfo.json
# (which the ipk derives its filename and control entry from), and the X-Plex-Version this client
# reports to both Plex services via env!("CARGO_PKG_VERSION") in src/plex/identity.rs.
version = "0.3.0"
edition = "2021"
# The crate is a staticlib and is never published to crates.io, so these are not for a registry —
# they are so `cargo metadata` and any SBOM tool agree with the repo's own LICENSE, which is the
# provenance a webosbrew reviewer reads. The manifest asserting nothing while the root said MIT
# was a contradiction with no upside.
license = "MIT"
description = "Application core for PlxNative — an unofficial native Plex client for LG webOS."
repository = "https://github.com/GLinnik21/plx-native"

# Static library linked into the C app (hybrid migration): each ported module
# exposes the same C ABI its src/*.h declares, so the C code calls it unchanged.
[lib]
name = "plxnative_modules"
crate-type = ["staticlib"]

[features]
# On by default, so every ordinary `make`, every `make test` and every on-device harness run
# behaves exactly as it always has. `make RELEASE=1` passes --no-default-features, which is what
# CI's release job builds with.
default = ["devtools", "devtriggers"]
# Developer-facing chrome that must not reach a public build. Currently: the on-screen
# seven-segment counter. Everything gated here must be DRAW-ONLY or otherwise inert — the device
# is the only test this project has, so a release build must not differ from the tested one in
# any way that could change behaviour, only in what it paints.
devtools = []
# The `/tmp/plxnative-*` trigger surface, the remote FIFO and the live capture listener — see
# src/dev.rs. This one DOES change behaviour, which is exactly why it is a second feature rather
# than more things under `devtools`: that name promises draw-only, and the promise is worth
# keeping. Both are default-on and both are dropped by the same `--no-default-features`, so the
# Makefile and the release workflow needed no change.
#
# Nothing in the dev loop constrains this: `make run`/`run-stream` touch `/tmp` only to clear and
# read back the event log, and `tests/run.py` builds with plain `make` — the harness never builds
# a release binary, so gating the whole surface costs it nothing.
devtriggers = []

[dependencies]
# safe pure-Rust JPEG/PNG decoders — replaces vendored stb_image.h (~8k lines C)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# raw socket/libc FFI for the stream module (correct constants + struct layouts)
libc = "0.2"
# JSON parsing for the pms module (replaces the C's hand-rolled string scrape)
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# derive(Deserialize) for the typed plex API response models (src/plex/models.rs)
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[profile.release]
opt-level = 2
