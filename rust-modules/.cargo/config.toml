# Codegen flags bound to the TARGET, not to one make recipe.
#
# These are the flags that keep the binary from SIGILL-ing on this TV, and they used to exist
# only as a RUSTFLAGS env var inside the Makefile's cargo line. Anything that invoked cargo
# another way — an IDE, rust-analyzer, a hand-typed `cargo build --target …`, a future CI —
# produced an ARMv6/CP15 staticlib and wrote it to the SAME path, where `make` would link it
# without comment (cargo fingerprints RUSTFLAGS, so the bad artifact REPLACES the good one).
#
# **BINDING THE FLAGS HERE FIXES THE FLAGS, NOT THE SHARED PATH, AND THE PATH IS STILL SHARED.**
# `RUST_TDIR` for an ordinary developer build is `target` — cargo's own default — so a hand-typed
# cross build with a DIFFERENT ENVIRONMENT still writes the archive `make` links (when it asks for
# one with `--crate-type staticlib`; a plain `cargo build` writes only an rlib now), and make will
# not re-run cargo if that archive is newer than its prerequisites. Everything the environment decides
# rides on this, and since 2026-09-02 that includes `PLX_RELEASE`, i.e. the version the binary
# REPORTS:
#
#     cd rust-modules && PLX_RELEASE=1 cargo +stable rustc --release --lib \
#         --crate-type staticlib --target armv7-…-gnueabi
#     make deploy        # links that archive: a dev-featured binary claiming the released version
#
# Nothing detects it in the ordinary loop — `ci/check-package.py` would, but only at package time.
# The rule is the same one this file has always implied: **run the cross build through `make`**, or
# give a hand-run one its own `--target-dir`. The features axis has behaved this way since the
# per-configuration target dirs were added and is not new; the version is simply one more thing the
# environment now decides.
#
#   the TARGET            armv7-unknown-linux-gnueabi (prebuilt ARMv7 std). The old ARMv6
#                          arm-unknown-linux-gnueabi std emits the legacy CP15 barrier
#                          (mcr p15,...,c7,c10,5), UNDEFINED on the A53 → SIGILL, which is why
#                          std used to be rebuilt with `-Z build-std` on nightly. With this target
#                          the STABLE toolchain pinned in rust-toolchain.toml builds the app.
#   target-cpu=cortex-a9   ARMv7-A codegen for our own crates (`dmb`, VFPv3).
#   target-feature=-soft-float  the armv7 target defaults to +soft-float (no VFP at all); this
#                          gives our crates VFP back under the same soft calling convention.
#   target-feature=-neon   NEON is unnecessary (VFP stays on) and dodges crates whose NEON
#                          path needs unstable intrinsics.
#   force-frame-pointers   the out-of-process ARM crash walker follows the APCS r11 chain; this
#                          turns a faulting PC into the Rust call stack that led to it.
#
# On STABLE rustc, both target-feature flags above print a warning on every ARM compile:
#
#     warning: unstable feature specified for `-Ctarget-feature`: `neon`
#     warning: unstable feature specified for `-Ctarget-feature`: `soft-float`
#       = note: this feature is not stably supported; its behavior can change in the future
#
# Neither can be cleared, and they mean different things:
#
# * `-soft-float` is the one to WATCH. The warning says what it means: rustc may stop honouring the
#   flag in a later release. Nothing fails when it does: the staticlib still builds and the TV still
#   runs it, but every float operation in our crates becomes a call to `__aeabi_fmul` and friends
#   (the UI's per-frame math is float). `ci/check-vfp.py` therefore compiles a tiny float function
#   for this target with the Makefile's exact flags and FAILS the build (`make check`, and CI's
#   host-lint job) unless the assembly has VFP arithmetic and no `__aeabi_f*` call, and
#   `ci/check-elf.sh` repeats the count on the linked binary (~3057 `vmul.f32` against 2
#   `bl __aeabi_fmul`, both from core's float parsing: std is prebuilt, its float code stays
#   soft). Do not "fix" the warning by dropping the flag: the gate would go red, correctly.
#
# * `-neon` is the one this tree cannot do without, as measured on NIGHTLY on 2026-08-15 (not
#   re-measured on stable): dropping the flag FAILS TO BUILD, 65 x `error[E0658]: use of unstable
#   library feature stdarch_arm_neon_intrinsics`, all from **simd-adler32 0.3.9** (a transitive
#   dep, via png -> flate2, i.e. the icon/artwork decode path), whose ARM NEON arm is gated on
#   intrinsics that are still unstable. A stable toolchain makes that unstable-intrinsics gate
#   stricter, not looser, so the flag stays. It clears by itself if simd-adler32 stabilises its NEON
#   path, or if the icon decode stack drops it. `target-cpu=cortex-a9` is a different matter
#   entirely: that one is SIGILL-critical, and is not what either warning is about.
#
# CAUTION: the RUSTFLAGS *environment variable* replaces this list wholesale rather than
# appending to it — and the Makefile now ALWAYS sets it, because --remap-path-prefix needs
# $CARGO_HOME/$RUSTUP_HOME interpolated and a cargo config cannot expand an env var. So this
# list is the fallback for cargo invoked another way, and the Makefile repeats it verbatim.
# Do not add a partial RUSTFLAGS anywhere, and keep the two lists in step.
#
# Consequence worth knowing: a `make` build and a hand-typed `cargo build --target …` now
# fingerprint differently, so they rebuild over each other if pointed at the same --target-dir.
# The Makefile's own dirs (target/, target-release/) are unaffected.
[target.armv7-unknown-linux-gnueabi]
rustflags = ["-C", "target-cpu=cortex-a9", "-C", "target-feature=-neon,-soft-float", "-C", "force-frame-pointers=yes"]

# No `[unstable] build-std`: the target's prebuilt std is ARMv7 (dmb, not the CP15 barrier), so the
# ARM build runs on the STABLE toolchain pinned in rust-toolchain.toml (which lists the armv7 target,
# i.e. `rustup target add armv7-unknown-linux-gnueabi`), with no nightly and no rust-src.
