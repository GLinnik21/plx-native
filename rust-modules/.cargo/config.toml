# Codegen flags bound to the TARGET, not to one make recipe.
#
# These are the flags that keep the binary from SIGILL-ing on this TV, and they used to exist
# only as a RUSTFLAGS env var inside the Makefile's cargo line. Anything that invoked cargo
# another way — an IDE, rust-analyzer, a hand-typed `cargo build --target …`, a future CI —
# produced an ARMv6/CP15 staticlib and wrote it to the SAME path, where `make` would link it
# without comment (cargo fingerprints RUSTFLAGS, so the bad artifact REPLACES the good one).
#
# **BINDING THE FLAGS HERE FIXES THE FLAGS, NOT THE SHARED PATH, AND THE PATH IS STILL SHARED.**
# `RUST_TDIR` for an ordinary developer build is `target` — cargo's own default — so a hand-typed
# cross build with a DIFFERENT ENVIRONMENT still writes the archive `make` links, and make will not
# re-run cargo if that archive is newer than its prerequisites. Everything the environment decides
# rides on this, and since 2026-09-02 that includes `PLX_RELEASE`, i.e. the version the binary
# REPORTS:
#
#     cd rust-modules && PLX_RELEASE=1 cargo +nightly build --release --target arm-…-gnueabi
#     make deploy        # links that archive: a dev-featured binary claiming the released version
#
# Nothing detects it in the ordinary loop — `ci/check-package.py` would, but only at package time.
# The rule is the same one this file has always implied: **run the cross build through `make`**, or
# give a hand-run one its own `--target-dir`. The features axis has behaved this way since the
# per-configuration target dirs were added and is not new; the version is simply one more thing the
# environment now decides.
#
#   target-cpu=cortex-a9   the default arm-*-gnueabi (ARMv6) codegen emits the legacy CP15
#                          barrier (mcr p15,...,c7,c10,5), UNDEFINED on the A53 → SIGILL.
#                          cortex-a9 (ARMv7-A) emits the dedicated `dmb`.
#   target-feature=-neon   NEON is unnecessary (VFP stays on) and dodges crates whose NEON
#                          path needs unstable intrinsics.
#   force-frame-pointers   the out-of-process ARM crash walker follows the APCS r11 chain; this
#                          turns a faulting PC into the Rust call stack that led to it.
#
# On that second flag rustc emits `unstable feature specified for -Ctarget-feature: neon` on every
# ARM build, and it is the ONE warning this tree cannot clear — measured 2026-08-15, so do not
# re-test it. Dropping the flag does not merely warn differently, it FAILS TO BUILD: 65 ×
# `error[E0658]: use of unstable library feature stdarch_arm_neon_intrinsics`, all from
# **simd-adler32 0.3.9** (a transitive dep, via png → flate2, i.e. the icon/artwork decode path),
# whose ARM NEON arm is gated on intrinsics that are still unstable. So the choice is this warning
# or no binary. It clears by itself if simd-adler32 stabilises its NEON path, or if the icon decode
# stack drops it; nothing in this repo can fix it. `target-cpu=cortex-a9` is a different matter
# entirely — that one is SIGILL-critical, and is not what the warning is about.
#
# CAUTION: the RUSTFLAGS *environment variable* replaces this list wholesale rather than
# appending to it — and the Makefile now ALWAYS sets it, because --remap-path-prefix needs
# $CARGO_HOME/$RUSTUP_HOME interpolated and a cargo config cannot expand an env var. So this
# list is the fallback for cargo invoked another way, and the Makefile repeats it verbatim.
# Do not add a partial RUSTFLAGS anywhere, and keep the two lists in step.
#
# Consequence worth knowing: a `make` build and a hand-typed `cargo build --target …` now
# fingerprint differently, so they rebuild over each other if pointed at the same --target-dir.
# The Makefile's own dirs (target/, target-release/) are unaffected.
[target.arm-unknown-linux-gnueabi]
rustflags = ["-C", "target-cpu=cortex-a9", "-C", "target-feature=-neon", "-C", "force-frame-pointers=yes"]

# std itself must be rebuilt with the flags above — the precompiled std ships the CP15
# barriers. Needs the nightly toolchain + the rust-src component.
[unstable]
build-std = ["std", "panic_unwind"]
