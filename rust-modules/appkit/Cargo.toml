[package]
name = "plx_appkit"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PlxNative appkit layer: application widgets shared by several screens (the player HUD, the track menus, the info panel, the Sources row model), composed from the ui library over application types."
repository = "https://github.com/GLinnik21/plx-native"
publish = false
build = "build.rs"

[lib]
name = "plx_appkit"
# An rlib the application crate links, never an archive of its own: the one staticlib is the
# application crate's (ci/test_no_host_staticlib.py holds that line for this crate too). It links
# nothing on the television; its build script exists for the host test binary (see build.rs).
crate-type = ["rlib"]

# ci/module_graph.py reads this crate as part of the same module tree as the application, and
# `src/lib.rs` is what was `appkit/mod.rs`: the root of module `appkit`, not of the application. The
# mount is that module's name, so `plx_appkit::player_hud::slot_for` and the `crate::player_hud`
# written in this crate both resolve to `appkit::player_hud`, the member `[appkit]` of
# ci/module-layers.ini lists.
[package.metadata.plx]
mount = "appkit"

[features]
default = []
# Forwarded from the application crate, which is the only one that sets it. Nothing in this crate
# has a `cfg` on it; it is declared so that `cargo test -p plx_appkit` (which dev-depends on this
# crate with it) builds the layers below with the dev trigger surface, as the Makefile's suite does.
devtriggers = ["plx_base/devtriggers", "plx_machine/devtriggers", "plx_platform/devtriggers", "plx_gfx/devtriggers", "plx_ui/devtriggers", "plx_plex/devtriggers", "plx_telemetry/devtriggers", "plx_data/devtriggers", "plx_media/devtriggers"]
# The `cfg(test)` seams other crates' tests use (`player_hud::SkipIntervalGuard`, the `overscan_rects`
# audits, the row/page read-backs of the menus, ...). Enabled from the dependents' `[dev-dependencies]`;
# never in a shipped build. It enables the lower layers' own `test-support` because the seams call
# into them.
test-support = ["plx_base/test-support", "plx_machine/test-support", "plx_platform/test-support", "plx_gfx/test-support", "plx_ui/test-support", "plx_plex/test-support", "plx_telemetry/test-support", "plx_data/test-support", "plx_media/test-support"]

[dependencies]
plx_base = { path = "../base" }
plx_machine = { path = "../machine" }
plx_platform = { path = "../platform" }
plx_gfx = { path = "../gfx" }
plx_ui = { path = "../ui" }
plx_plex = { path = "../plex" }
plx_telemetry = { path = "../telemetry" }
plx_data = { path = "../data" }
plx_media = { path = "../media" }

[dev-dependencies]
# THE rule of the layer crates: dev-depend on ITSELF with `devtriggers`, so `cargo test -p plx_appkit`
# alone builds the crate and every layer below it as the Makefile's suite does.
plx_appkit = { path = ".", features = ["devtriggers"] }
plx_base = { path = "../base", features = ["test-support"] }
plx_machine = { path = "../machine", features = ["test-support"] }
plx_platform = { path = "../platform", features = ["test-support"] }
plx_gfx = { path = "../gfx", features = ["test-support"] }
plx_ui = { path = "../ui", features = ["test-support"] }
plx_plex = { path = "../plex", features = ["test-support"] }
plx_telemetry = { path = "../telemetry", features = ["test-support"] }
plx_data = { path = "../data", features = ["test-support"] }
plx_media = { path = "../media", features = ["test-support"] }

[lints]
workspace = true
