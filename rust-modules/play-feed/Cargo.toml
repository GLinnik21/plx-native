[package]
name = "plx_play_feed"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Pure buffer-feed native Load declarations and payload construction."
repository = "https://github.com/GLinnik21/plx-native"
publish = false

[package.metadata.plx]
mount = "play_feed"

[lib]
name = "plx_play_feed"
crate-type = ["rlib"]

[features]
hostsim = []
test-support = ["plx_media_codecs/test-support"]
devtriggers = ["plx_media_codecs/devtriggers"]

[dependencies]
plx_playback_contract = { path = "../playback-contract" }
plx_media_codecs = { path = "../media-codecs" }
plx_net = { path = "../net" }
libc = "0.2"
plx_base = { path = "../base" }
plx_platform = { path = "../platform" }

[lints]
workspace = true
