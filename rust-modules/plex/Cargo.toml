[package]
name = "plx_plex"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PlxNative plex layer: the typed Plex API (PMS and plex.tv), the session store and the one request door."
repository = "https://github.com/GLinnik21/plx-native"
publish = false

[lib]
name = "plx_plex"
# An rlib the application crate links, never an archive of its own: the one staticlib is the
# application crate's (ci/test_no_host_staticlib.py holds that line for this crate too). It owns no
# build script and links nothing; the version it reports to Plex is handed in by the application
# (`plex::identity::set_version`), because a `cargo:rustc-env` reaches one crate only.
crate-type = ["rlib"]

[features]
default = []
# Forwarded from the application crate, which is the only one that sets them. Each is named here
# only because some code in this crate has a `cfg` on it (the dev-trigger origin override in
# `plex::origin`, the simulator's session paths in `plex::session`).
devtriggers = ["plx_base/devtriggers", "plx_machine/devtriggers", "plx_net/devtriggers", "plx_platform/devtriggers"]
hostsim = ["plx_base/hostsim", "plx_machine/hostsim", "plx_platform/hostsim"]
# The `cfg(test)` seams other crates' tests use (`plex::session::TempSession` and its
# `*_for_test` hooks, `plex::grant`'s reset and evidence seams, `plex::serverinfo::store_for_test`)
# plus the test-mode arms `cfg(test)` alone cannot give a dependent. Enabled from the dependents'
# `[dev-dependencies]`; never in a shipped build.
test-support = ["plx_base/test-support", "plx_machine/test-support", "plx_platform/test-support", "plx_net/test-support"]

[dependencies]
plx_base = { path = "../base" }
plx_machine = { path = "../machine" }
plx_platform = { path = "../platform" }
plx_net = { path = "../net" }
libc = "0.2"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }

[dev-dependencies]
plx_base = { path = "../base", features = ["test-support"] }
plx_machine = { path = "../machine", features = ["test-support"] }
plx_platform = { path = "../platform", features = ["test-support"] }
plx_net = { path = "../net", features = ["test-support"] }

[lints]
workspace = true
