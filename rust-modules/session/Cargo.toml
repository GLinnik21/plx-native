[package]
name = "plx_session"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PlxNative session layer: plex.tv sign-in, server discovery, who's-watching and the install of the chosen profile."
repository = "https://github.com/GLinnik21/plx-native"
publish = false

[lib]
name = "plx_session"
# An rlib the application crate links, never an archive of its own: the one staticlib is the
# application crate's (ci/test_no_host_staticlib.py holds that line for this crate too). It owns no
# build script and links nothing, and reads no `PLX_*` build variable: the version it reports to
# plex.tv is `plx_plex::plex::identity`'s, handed in by the application at startup.
crate-type = ["rlib"]

[features]
default = []
# Forwarded from the application crate, which is the only one that sets them. `devtriggers` is not
# only plumbing here: `auth_registry_tests` selects its shipping-policy cases with
# `cfg(not(feature = "devtriggers"))`, and the sign-in trouble and read-out triggers read their
# trigger files through `plx_base::devtrig`, which is compile-time `None` without it. A missing
# forward would run the shipping-policy cases in a build that has the dev surface.
devtriggers = ["plx_base/devtriggers", "plx_machine/devtriggers", "plx_net/devtriggers", "plx_platform/devtriggers", "plx_plex/devtriggers", "plx_telemetry/devtriggers"]
hostsim = ["plx_base/hostsim", "plx_machine/hostsim", "plx_platform/hostsim", "plx_plex/hostsim", "plx_telemetry/hostsim"]
# The `cfg(test)` seams other crates' tests use (`auth::test_support`, `auth::SessionIdentity::of`,
# `auth::synthetic_incident`, `auth::settled_probe_for_test`, `auth::owner::scenarios`) plus the
# test-mode arms `cfg(test)` alone cannot give a dependent (the default `ProfileWorkIo::admit`, the
# silenced `signinfail` trigger). Enabled from the dependents' `[dev-dependencies]`; never in a
# shipped build.
test-support = ["plx_base/test-support", "plx_machine/test-support", "plx_platform/test-support", "plx_net/test-support", "plx_plex/test-support", "plx_telemetry/test-support"]

[dependencies]
plx_base = { path = "../base" }
plx_machine = { path = "../machine" }
plx_platform = { path = "../platform" }
plx_net = { path = "../net" }
plx_plex = { path = "../plex" }
plx_telemetry = { path = "../telemetry" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }

[dev-dependencies]
libc = "0.2"
plx_base = { path = "../base", features = ["test-support"] }
plx_machine = { path = "../machine", features = ["test-support"] }
plx_platform = { path = "../platform", features = ["test-support"] }
plx_net = { path = "../net", features = ["test-support"] }
plx_plex = { path = "../plex", features = ["test-support"] }
plx_telemetry = { path = "../telemetry", features = ["test-support"] }

[lints]
workspace = true
