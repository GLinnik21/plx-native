[package]
name = "plx_base"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PlxNative base layer: the event log, file locations, spawn discipline, dlopen seam and frame instruments every other layer builds on."
repository = "https://github.com/GLinnik21/plx-native"
publish = false

[lib]
name = "plx_base"
# An rlib the application crate links, never an archive of its own: the one staticlib is the
# application crate's (ci/test_no_host_staticlib.py holds that line for this crate too).
crate-type = ["rlib"]

[features]
default = []
# Forwarded from the application crate, which is the only one that sets them. Each is named here
# only because some code in this crate has a `cfg` on it.
devtriggers = []
threadcheck = []
lab-diagnostics = []
hostsim = []
# The `cfg(test)` fixtures other crates' tests use, plus the test-mode behaviour (disarmed
# watchdog, no SDL link, the per-process state root) that `cfg(test)` alone cannot give a
# dependent. Enabled from the application crate's `[dev-dependencies]`; never in a shipped build.
test-support = []

[dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.14.10"

[lints]
workspace = true
