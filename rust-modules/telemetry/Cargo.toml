[package]
name = "plx_telemetry"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PlxNative telemetry layer: consent, the opt-in crash and usage channels, and the typed usage-event schema they carry."
repository = "https://github.com/GLinnik21/plx-native"
publish = false

[lib]
name = "plx_telemetry"
# An rlib the application crate links, never an archive of its own: the one staticlib is the
# application crate's (ci/test_no_host_staticlib.py holds that line for this crate too). It owns no
# build script and links nothing -- the Sentry Native symbols its `telemetry::native::sdk` module
# declares are resolved by the final link (the Makefile's), and the two `#[no_mangle]` entry points
# `src/main.c` calls ride the application's staticlib like `plx_base`'s `plx_runtime_path`. The
# release it reports is handed in by the application (`telemetry::set_release`), because a
# `cargo:rustc-env` reaches one crate only; the credentials are `option_env!` reads of the build
# environment, which cargo hands to every crate it compiles.
crate-type = ["rlib"]

[features]
default = []
# Forwarded from the application crate, which is the only one that sets them. `devtriggers` is not
# only plumbing here: `telemetry::sender` refuses at COMPILE time a build that holds the production
# credentials and still has the dev-trigger surface (`HAS_PROD && cfg!(feature = "devtriggers")`),
# so a missing forward would silently turn that guard off.
devtriggers = ["plx_base/devtriggers", "plx_net/devtriggers", "plx_platform/devtriggers", "plx_plex/devtriggers"]
hostsim = ["plx_base/hostsim", "plx_platform/hostsim", "plx_plex/hostsim"]
# The `cfg(test)` seams other crates' tests use (`telemetry::redirect_for_test`, `spool::set_test_path`,
# `persistence::last_call_thread`, `diag::test_events`, the schema tables, ...) plus the test-mode
# arms `cfg(test)` alone cannot give a dependent (the consent file's redirected path, the in-process
# storage helper, the one-off transport stub). Enabled from the dependents' `[dev-dependencies]`;
# never in a shipped build.
test-support = ["plx_base/test-support", "plx_platform/test-support", "plx_net/test-support", "plx_plex/test-support"]

[dependencies]
plx_base = { path = "../base" }
plx_platform = { path = "../platform" }
plx_net = { path = "../net" }
plx_plex = { path = "../plex" }
libc = "0.2"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }

[dev-dependencies]
plx_base = { path = "../base", features = ["test-support"] }
plx_platform = { path = "../platform", features = ["test-support"] }
plx_net = { path = "../net", features = ["test-support"] }
plx_plex = { path = "../plex", features = ["test-support"] }

[lints]
workspace = true
