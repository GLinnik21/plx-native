[package]
name = "plxnative-storage"
# Not the app's version and not bumped with it: `ci/bump-version.py` and `ci/check-package.py` read
# the ROOT package's literal `version`, and nothing in this binary reports a version.
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PlxNative private storage helper: the LS2 service that holds the client's secrets and state."
repository = "https://github.com/GLinnik21/plx-native"
publish = false

# The helper is its OWN package, and does not depend on `plxnative-modules`, on purpose. As a
# `[[bin]]` of the app package it made cargo build the whole application library first (a package's
# bins depend on its lib), for a binary that uses none of it: two extra host library builds in
# `make check` and a third, ARM one, in the `pkg/plxnative-storage` rule. The sources it shares with
# the platform layer crate (`platform/src/storage_service/*.rs`, `platform/src/storage/state.rs`) are
# compiled into each crate by `#[path]`; the install-identity generator is shared through
# `build_support/`.
# `ci/test_storage_package_isolated.py` holds that line.
[[bin]]
name = "plxnative-storage"
path = "src/main.rs"

# The SAME feature sets the app package declares for these three crates, so the dependency graph
# the shipped helper is compiled with is unchanged by the move.
[dependencies]
libc = "0.2"
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

[build-dependencies]
serde_json = "1"

[lints]
workspace = true
