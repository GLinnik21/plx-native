[package]
name = "plx_shell_sdl"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PlxNative stock-SDL shell: SDL bring-up, the window and GL context, the swap, the event drain, the key, pointer, wheel and text layouts of both SDLs (LG's fork on the television, stock SDL2 under hostsim), and synthetic-event injection."
repository = "https://github.com/GLinnik21/plx-native"
publish = false
build = "build.rs"

[package.metadata.plx]
mount = "shell_sdl"

[lib]
name = "plx_shell_sdl"
# An rlib the application crate links, never an archive of its own: the one staticlib is the
# application crate's (ci/test_no_host_staticlib.py holds that line for this crate too).
crate-type = ["rlib"]

[features]
default = []
# Forwarded from the application crate, which is the only one that sets it. It selects the
# stock-SDL2 event layouts and the desktop window arithmetic that a simulator runs (the
# television's SDL fork lays its keyboard, text and wheel events out differently), plus the GL
# context request. Both arms of every layout stay compiled either way (`cfg!`).
hostsim = ["plx_base/hostsim"]
# Stubs for the four text-input calls that a host test binary must not reach (no window, no
# panel) and the SDL event-queue guard the application's loop tests drive. Enabled from the
# dependents' `[dev-dependencies]`; never in a shipped build.
test-support = ["plx_base/test-support"]

[dependencies]
plx_base = { path = "../base" }

[dev-dependencies]
plx_base = { path = "../base", features = ["test-support"] }

[lints]
workspace = true
