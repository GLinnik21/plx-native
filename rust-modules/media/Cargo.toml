[package]
name = "plx_media"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Shared playback orchestration, Plex route selection, captions and backend coordination."
repository = "https://github.com/GLinnik21/plx-native"
publish = false

[lib]
name = "plx_media"
# An rlib the application crate links, never an archive of its own: the one staticlib is the
# application crate's (ci/test_no_host_staticlib.py holds that line for this crate too). It owns no
# build script and links nothing -- the FFmpeg, libass and libcurl symbols are `dynlib!` tables
# (dlopen at run time), the platform webOS port's Starfish/ACB externs are resolved by the final link (the
# Makefile's), and the two `#[no_mangle]` callbacks the C seams call (`src/starfish.c` calls
# `plx_play_feed::sf_event::sf_on_event`; `src/video_plane.c` calls the platform port's `acb_on_event`,
# `plx_platform::webos::video_sink`) ride the application's staticlib like `plx_telemetry`'s entry
# points. It reads no `PLX_*` build variable.
crate-type = ["rlib"]

[features]
# This crate names no playback backend: `plx_play_feed` is a DEV-dependency, so the media tests drive
# the real Feed (`player/test_physical.rs`) and nothing else links it. The `plx_play_feed/...` entries
# below name that dev-dependency: they take effect only when this crate's own tests are built (a
# dependency's dev-dependencies are never active), and keep the Feed's tests on the feature set the
# tests run with. The application composes the Feed itself (its own `play-feed` feature).
# Forwarded from the application crate, which is the only one that sets them. `devtriggers` is
# behaviour here, not plumbing: the quality-override, track-name, playurl and forced-route triggers
# read their files through `plx_base::devtrig`, which is compile-time `None` without it, and
# 130-odd `cfg`s select the dev surface.
devtriggers = ["plx_play_feed/devtriggers", "plx_media_codecs/devtriggers", "plx_base/devtriggers", "plx_machine/devtriggers", "plx_net/devtriggers", "plx_platform/devtriggers", "plx_plex/devtriggers", "plx_telemetry/devtriggers", "plx_data/devtriggers"]
# `plx_play_feed::ffi_host` (the simulator's `VideoSink`, which lives in `plx_play_feed`) replaces the
# platform webOS port's native sink (Starfish/ACB) under the media tests' Feed; a simulator build names
# the application's `play-feed` too (ci/test_sim_backend.py). The simulator's decoded picture (its
# frame sink, the one thing that draws) is the application's.
hostsim = ["plx_play_feed/hostsim", "plx_base/hostsim", "plx_machine/hostsim", "plx_platform/hostsim", "plx_plex/hostsim", "plx_telemetry/hostsim", "plx_data/hostsim"]
# Two `cfg_attr(not(feature = "lab-diagnostics"), allow(dead_code))` in `player`; the Cloud Lab bridge
# that reads those items is the application crate's.
lab-diagnostics = []
# The `cfg(test)` seams other crates' tests use (`player::preview::reset_for_test`,
# `player::restore_state_for_test`, `player::swap_state_for_test`, ...) plus the test-mode arms
# `cfg(test)` alone cannot give a dependent (the stand-in sink, the stepped feed clock, the asset
# directory, the settled route start). Enabled from the dependents' `[dev-dependencies]`; never in a
# shipped build.
test-support = ["plx_media_codecs/test-support", "plx_base/test-support", "plx_machine/test-support", "plx_platform/test-support", "plx_net/test-support", "plx_plex/test-support", "plx_telemetry/test-support", "plx_data/test-support"]

[dependencies]
plx_playback_contract = { path = "../playback-contract" }
plx_media_codecs = { path = "../media-codecs" }
plx_base = { path = "../base" }
plx_machine = { path = "../machine" }
plx_platform = { path = "../platform" }
plx_net = { path = "../net" }
plx_plex = { path = "../plex" }
plx_telemetry = { path = "../telemetry" }
plx_data = { path = "../data" }
libc = "0.2"
# Legacy-encoding text subtitles (GBK, Big5, Shift_JIS, EUC-KR, windows-125x): `player::sub_charset`. Pure Rust, no FFI.
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"] }
# Guesses the encoding of a legacy (non-UTF-8) subtitle track from its bytes, hinted by its language. Pure Rust, on encoding_rs.
chardetng = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }


[dev-dependencies]
# Packet-framing fixtures construct and inspect the original RPU.
dolby_vision = { version = "3.4", default-features = false }
plx_play_feed = { path = "../play-feed", features = ["test-support"] }
plx_media_codecs = { path = "../media-codecs", features = ["test-support"] }
plx_playback_contract = { path = "../playback-contract", features = ["test-support"] }
# THE rule of the layer crates: dev-depend on ITSELF with `devtriggers`, so `cargo test -p plx_media`
# alone builds the crate and every layer below it as the Makefile's suite does.
plx_media = { path = ".", default-features = false, features = ["devtriggers"] }
plx_base = { path = "../base", features = ["test-support"] }
plx_machine = { path = "../machine", features = ["test-support"] }
plx_platform = { path = "../platform", features = ["test-support"] }
plx_net = { path = "../net", features = ["test-support"] }
plx_plex = { path = "../plex", features = ["test-support"] }
plx_telemetry = { path = "../telemetry", features = ["test-support"] }
plx_data = { path = "../data", features = ["test-support"] }

[lints]
workspace = true
