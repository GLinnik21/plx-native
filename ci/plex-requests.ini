# The request registry of the plex layer: one section per request site, read by
# `ci/check-plex-requests.py`. A site is a call to an HTTP door of rust-modules/plex/src/plex/ from a
# non-test function, keyed by its file and enclosing function: `[file::function]`. docs/pms-api.md's
# "Paging, observed" section is the server's side of every paging claim here.
#
#   class     single    one object, not a list (a record, a status, a write's answer)
#             paged     asks for a window: the function names paged_path or PageReq, or a function
#                       named in `via` builds the window for it
#             bounded   a list the server bounds by an explicit parameter; `parameter` names it
#             whole     a list read in one response on purpose
#   reason    one line: why this class, and `later: step N` where the plan pages it in step N
#   evidence `path:line` in the repo, or `docs/pms-api.md: <a line of its paging section>`
#   parameter the query parameter that bounds a bounded site (bounded only)
#   via       same-file functions that build the window for a paged site (paged only). Each must
#             reach paged_path or PageReq, and must call this site's function or be called by it.
#
# A new request site fails the gate until a section names it; a section for a site that no longer
# exists fails the gate as stale. The classes describe what the code does TODAY: a list that the plan
# pages later is `whole` or `bounded` here, with `later: step N` in its reason.

