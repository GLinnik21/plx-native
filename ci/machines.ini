# The state machines whose shape ci/check-machine-shape.py guards: one section per machine, keyed
# `[file::Struct]`, file relative to rust-modules/. The gate fails on any `pub`, `pub(crate)` or
# `pub(super)` field of the listed struct (a machine's state is private and its one writer is `step`,
# so a caller cannot poke it: a new way in is a new event) and REPORTS, never fails on, how many of
# its fields are `bool` and how many are `Option<..>`: a flag ratchet to read, not a limit.
#
#   event   the machine's event type (what `step` takes)
#   effect  the machine's effect type (what `step` pushes for the driver to execute)
#   step    prose for a reader: how `step` is exposed, which module drives it, who owns the machine
#
# The gate prints event/effect; these and the prose step are not source-validated.
# Existing sections retain privacy-only checks until their owners explicitly bind a strict contract:
#   writer_policy = strict
#   state_field = state
#   transition = step
#   constructor = new
# Use one named field without the Rust r# prefix; transition is an inherent &mut self method,
# constructor is a distinct inherent method without a self receiver or a direct associated
# `const NAME: Self = Self { ... };`. No inline INI comments. All four keys are mandatory
# together. The field, transition, and constructor must exist.
# The registered file and its production-reachable child/include files are checked. Outside the
# transition, writes, state destructuring/construction, and method calls on a state projection are
# rejected. Even in the transition, field borrows (including shared references, which may expose
# interior mutability) are rejected because the lexical gate cannot prove they do not escape.
# Constructors initialize
# with a struct literal; they may not mutate an existing state. Direct reads remain legal, but
# forwarding or binding a state projection is rejected because it could copy a mutable alias.
# Mutable whole-machine parameters and escaping `self` are rejected, including in transition,
# because a callee could replace state without spelling the field.
# Raw identifiers normalize to their identifier. cfg(test)-only items are excluded.
#
# This is a conservative token gate, not Rust name/type/borrow/macro expansion analysis. Same-named
# unrelated fields in the module can be rejected; do not use macro-generated state accesses or
# unchecked aliasing to bypass it. Review remains necessary, including paths not reachable from the
# registered module. Strict bindings are not claims that existing machines have already migrated.
#
# A separate module section opts that source module into the compiler's enum-only wildcard lint:
#   [module path/to/module.rs]
#   wildcard_enum_match_arm = deny
# That exact source must carry #![deny(clippy::wildcard_enum_match_arm)] (or forbid). CI rejects
# local suppression. The compiler/Clippy, not this token gate, classifies the matched type; numeric
# and intentionally open protocol matches are not banned by a textual underscore search.
# state_reads = immutable optionally proves the owned state payload recursively before admitting
# shared views and inherent &self readers. Unknown payloads, callbacks, raw pointers, interior
# mutability, unsafe accessor impls, consuming/mutable getters and macro aliases fail closed.
# Production child modules remain checked; distinct state fields are resolved by actual receiver type.
# Contracts are enabled per migrated machine and module.
[media/src/player/lifecycle.rs::ForegroundLifecycle]
event  = ForegroundEvent
effect = ForegroundEffect
step   = inherent; driver media/src/player/foreground.rs; owner media/src/player/machine.rs::Player.lifecycle
writer_policy = strict
state_field = state
transition = transition
constructor = IDLE

[module media/src/player/lifecycle.rs]
wildcard_enum_match_arm = deny

[media/src/player/recovery.rs::OpenRecovery]
event  = RecoveryEvent
effect = RecoveryEffect
step   = inherent; driver media/src/player/pump.rs (and media/src/player/engine.rs, which raises LoadStarted for every Engine start); owner media/src/route/decision.rs::PlaybackSession.recovery

[play-uri/src/uriprobe.rs::UriProbe]
event  = UriEvent
effect = UriEffect
step   = inherent; driver play-uri/src/uriprobe_drive.rs, opened by the application's src/dev/uriprobe.rs behind media's UriProbeSession port; route adapter media/src/player/uriprobe_drive.rs; owner media/src/player/adapter.rs::PlayerAdapter.uri

[play-uri/src/picture_gate.rs::PictureGate]
event  = Event
effect = Fx
step   = inherent; driver play-uri/src/backend.rs (`UriBackend::picture_step`, fed the service's playing and clock and the plane owner's `Shown`); owner play-uri/src/backend.rs::UriBackend.picture
writer_policy = strict
state_field = stage
transition = step
constructor = new

[module play-uri/src/picture_gate.rs]
wildcard_enum_match_arm = deny

[data/src/hudpacks.rs::HudStore]
event  = HudEvent
effect = HudEffect
step   = inherent; driver src/app/adapters/huds.rs (the runners that execute its ScanDir/ReadFile/WriteFile/Delete on the storage worker and answer Validate with appkit::hud_format); owner the Bridge (`Bridge::huds`)

[playback-contract/src/state.rs::BackendState]
event  = Event
effect = Fx
step   = inherent; driver media/src/player/backend.rs::BackendRunner; concrete resource ownership stays in the injected driver

[media/src/player/attempt_metrics.rs::AttemptMetrics]
event  = Event
effect = Fx
step   = inherent; local measurement model, not yet wired to product reporting; the caller supplies canonical request/attempt identities and monotonic ticks

[media/src/player/readout.rs::PlayerReadout]
event  = ReadoutEvent
effect = none (L3b adds a feed command)
step   = inherent (`PlayerReadout::step`); owner media/src/route/decision.rs::PlaybackSession.readout, written only through `PlaybackSession::step_readout`; not yet fed by the pump (L3a-2 steps 3 and 4)
writer_policy = strict
state_field = state
transition = step
constructor = IDLE

[module media/src/player/readout.rs]
wildcard_enum_match_arm = deny

[data/src/hudpacks/catalog.rs::Catalog]
event  = Event
effect = CatalogEffect
step   = inherent; nested in HudStore; driver src/app/adapters/huds.rs (bounded cache IO and conditional no-redirect GET); owner HudStore.catalog

[session/src/auth/owner.rs::SessionMachine]
event = SessionEvent
effect = SessionFx
step = trait Machine; owner SessionMachine; the app executes addressed SessionFx jobs
writer_policy = strict
state_field = state
transition = transition
constructor = from_init
state_reads = immutable

[module session/src/auth/owner.rs]
wildcard_enum_match_arm = deny
