# Registered literal Event/Effects reducers. Every owned field is private and guarded by default.
# transition is always the private inherent transition(&mut self, Event, &mut Vec<Effect>)
# (borrowed events and concrete Vec aliases are supported); effect = none is a pure-view reducer.
# All arguments are bound exactly once: no extra context/model/state/callback parameters.
# aux_facts names a closed source-validated semantic slot, not an arbitrary Rust type allowlist.
# Current slots: URI now_ms:u64, Session tick_ms:u32, backend optional nine-boolean capabilities.
# event/effect bind to actual Rust enum declarations and the canonical signature, not prose.
# state_field selects a variant view only. It NEVER limits write coverage: counters, pending
# work, outboxes, caches and nested owners are equally guarded. No writer/helper exemptions.
# A distinct constructor accepts fresh data only and initializes all fields in a fresh literal.
# All later physical field writes occur inside transition, never mutSelf helpers or closures.
# Public wrappers may dispatch events; inert shared decision helpers may only read.
# state_reads = immutable requests closed structural generic proof, never broad Copy trust.
# Unknown calls/macros, callbacks, raw pointers, unsafe and live aliases fail closed.
# Each source also registers an enum policy and unconditionally denies the Clippy lint.
# Production children/static includes are traversed. Conditional paths, opaque includes and
# missing/generated modules fail closed. Numeric and open-wire wildcards remain legal.
# This bounded token proof does not replace Rust type checking or semantic behavior review.
[media/src/player/lifecycle.rs::ForegroundLifecycle]
event  = ForegroundEvent
effect = ForegroundEffect
step   = inherent; driver media/src/player/foreground.rs; owner media/src/player/machine.rs::Player.lifecycle
writer_policy = strict
state_field = state
transition = transition
constructor = IDLE

[module media/src/player/lifecycle.rs]
wildcard_enum_match_arm = deny

