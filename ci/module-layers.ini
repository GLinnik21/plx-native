# The TARGET dependency graph of rust-modules/src: one section per future crate ("layer"), read by
# `ci/check-module-layers.py`. docs/module-layers.md is the design record — why each layer exists,
# what each migration step moves, and how to place a new module.
#
#   members  module paths, `::`-separated as Rust writes them. A top-level module, or a submodule
#            that will leave its parent for a different crate (`ui::machine`, `diag::zlib`).
#            `crate` is lib.rs's own items. A module belongs to the layer of its LONGEST listed
#            prefix, so every module of the crate must have one — a new top-level module fails the
#            gate until it is placed here.
#   uses     the layers this one may NAME (`crate::x::…`, `use crate::x`, `super::…` that climbs
#            into x, a `#[macro_export]` macro defined in x) — the crate's future [dependencies].
#            Not transitive, exactly like Cargo: list every layer the code names. The graph of
#            `uses` must be acyclic; diamonds are fine.
#
# A reference that names a layer not in `uses` is a violation, unless ci/allow/layers.txt lists it
# (one entry per file and named member, tagged with the plan step that removes it). Moving a
# module to another layer, or adding a `uses` edge, is a design change: make it here, in the same
# diff as the code that needs it, and say why in docs/module-layers.md. A design change that
# re-layers modules, or declares a port (below), that other code already names records those
# references as a new step's entries in that same diff, as step L15 did. Otherwise the list only
# shrinks. The one exception is renaming or splitting a listed file, which moves its entries to the
# new path.

[base]
# EXTRACTED: this layer is the workspace crate `plx_base` (rust-modules/base/), the first split of
# docs/module-layers.md. ci/module_graph.py reads it as part of the same module tree (a path
# `plx_base::eventlog::log` names module `eventlog`), so the members below are still the module
# paths of the whole app and this section still says that nothing in them may name another layer.
# Leaf utilities: the event log, the process-wide spawn/blocking discipline, file locations, the
# dlopen seam, the frame instruments, the shelf-tile trait the data layer implements and `ui`
# draws through (neither may name the other), the hold-band cut (`hold`: the rows a paged store
# keeps, which the store and `ui::cards::HoldBand` both apply), the details-line parts
# (`detail_parts`: the set a profile keeps and the caption policy words), and the test-only lock/net
# helpers every layer's tests use (`testheap`: the C heap's live bytes, for the tests that count copies).
uses =
members =
    eventlog paths process clock step task cbuf sha256 sha1 b64 spki dynlib checkpoint storage_worker fontcov surface tile hold detail_parts window
    diag::zlib diag::spans diag::heartbeat
    devtrig
    testlock testnet testscratch testrace testheap

[machine]
# EXTRACTED: this layer is the workspace crate `plx_machine` (rust-modules/machine/), the second
# split of docs/module-layers.md. Its modules were `ui::machine` ... `ui::motion`; they are now
# top-level modules of that crate, which ci/module_graph.py reads as part of the same module tree
# (a path `plx_machine::present::Present` names module `present`).
# The deterministic state-machine runtime the stores, auth and screens are written against:
# machines and effects, the present gate, the idle/frame wake, the landing schedule, motion.
# It lived under ui/ and is not UI.
uses = base
members = machine present landgate landing job motion idle_regression_tests present_contract_tests

[os]
# EXTRACTED: this layer is the workspace crate `plx_os` (rust-modules/os/), the third
# split of docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree (a
# path `plx_os::storage::open` names module `storage`). The webOS-only modules (`webos`, the LS2 client and
# the video sink, and `keymanager`, the Luna key store) moved out with W7b to [platform webos] below.
# What this television keeps: the storage helper client, the codec table, the artwork cache, the localization
# catalog, and the Cloud Lab session file (`labcfg`: `lab.json` plus the trigger-key / menu-row answers `ui/`
# and `screens/` ask of it). `tv` holds the interfaces the webOS port fills at boot (step L15): device
# identity, the native-video verdict, the key store, home, toast, the window and the video sink trait.
uses = base machine
members = storage devcaps imgcache i18n labcfg tv playback_trace

[gfx]
# EXTRACTED: this layer is the workspace crate `plx_gfx` (rust-modules/gfx/), the fourth split of
# docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree (a path
# `plx_gfx::text::elide` names module `text`). `overdraw` was `ui::overdraw`.
# GL, EGL, text rasterization, images, vector icons and the GPU instruments. The crate names
# nothing of `os` today, so it does not depend on `plx_os`; the ceiling stays.
uses = base machine os
members = gfx egl text rtl img svg gpu_timer hwcnt overdraw dump

[shell_sdl]
# EXTRACTED: this layer is the workspace crate `plx_shell_sdl` (rust-modules/shell-sdl/); ci/module_graph.py
# reads it as part of the same module tree through the manifest's `mount = "shell_sdl"` (a path
# `plx_shell_sdl::event::decode` names module `shell_sdl::event`), like `plx_play_uri`.
# The stock-SDL shell the application opens its window through: SDL's init, the window and its GL context,
# the swap, the event queue, the key, pointer, wheel and text layouts of both SDLs, and the synthetic
# events pushed back onto the queue. It names no `ui`, no application type and none of [platform webos]; the
# application drives it through its own `Shell` and `Surface` (`app::platform`), and the television's LG half
# (the SysWMinfo handshake, the Wayland surface, the boot hooks around `SDL_Init`) is `system`, in [platform webos]. The crate
# names nothing of `machine` or `os` today, so it depends on `plx_base` only; the ceiling stays (the same
# ruling `[gfx]` records for `os`).
uses = base machine os
members = shell_sdl

[net]
# EXTRACTED: this layer is the workspace crate `plx_net` (rust-modules/net/), the fifth split of
# docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree (a path
# `plx_net::net::keypin::is_latched` names module `net`). The crate depends on `plx_base` only;
# `os` stays in `uses` because the layer may name it, not because anything does today.
# The transports: libcurl HTTPS (`net` for control calls, `range_io` for interruptible media byte ranges)
# and the plaintext socket stream. And `ws`: the RFC 6455 codec and the WebSocket transport that runs it
# over `net::connect_only`, libcurl's CONNECT_ONLY socket.
uses = base os
members = net stream range_io ws

[plex]
# EXTRACTED: this layer is the workspace crate `plx_plex` (rust-modules/plex/), the seventh split of
# docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree (a path
# `plx_plex::plex::session::load` names module `plex::session`, `plx_plex::http` names `http`).
# The typed Plex API (PMS + plex.tv), the session store, and the one request door.
uses = base machine os net
members = plex http

[telemetry]
# EXTRACTED: this layer is the workspace crate `plx_telemetry` (rust-modules/telemetry/), the eighth
# split of docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree (a path
# `plx_telemetry::telemetry::consent::current` names module `telemetry::consent`,
# `plx_telemetry::diag::schema` names `diag::schema`). `diag::{heartbeat, spans, zlib}` are not here:
# they are `plx_base::diag::*`, a different module of the same name.
# Consent, the opt-in crash/usage channels, and the typed usage-event schema they carry.
uses = base machine os net plex
members = telemetry diag

[ui]
# EXTRACTED: this layer is the workspace crate `plx_ui` (rust-modules/ui/), the sixth split of
# docs/module-layers.md. Its `lib.rs` is what was `ui/mod.rs`, so the crate is ONE module of the
# application's tree, not its root: its manifest says `[package.metadata.plx] mount = "ui"`, and
# ci/module_graph.py reads `plx_ui::theme::X` and the `crate::theme` written inside the crate as
# module `ui::theme`. That is why the member below is still `ui`.
# The UI LIBRARY (ui/src/CLAUDE.md's layer rule): widgets, containers, the frame — no application type.
uses = base machine os gfx
members = ui

[data]
# EXTRACTED: this layer is the workspace crate `plx_data` (rust-modules/data/), the ninth split of
# docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree (a path
# `plx_data::stores::hubs::HubsStore` names module `stores::hubs`, `plx_data::pms::seed_for_test`
# names `pms`). The members below are still the top-level modules of that crate, and the manifest
# depends on `plx_base`, `plx_machine`, `plx_os`, `plx_plex` and `plx_telemetry` (`net` is a
# dev-dependency only: one fixture test calls it).
# The content stores and their data modules.
uses = base machine os net plex telemetry playback_contract
members = instruments stores browse metadata person collection search sortfacts subsearch viewstate viewledger pms watchlist catalog hudpacks watchlist_guid_tests
    captured_store_fixture
# Value-only cfg(test) harness, like watchlist_guid_tests; no production dependency edge.

[session]
# plex.tv sign-in, discovery, who's-watching and install.
# EXTRACTED: this layer is the workspace crate `plx_session` (rust-modules/session/), the tenth split
# of docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree (a path
# `plx_session::auth::owner::SessionMachine` names module `auth::owner`). The crate keeps `auth` as
# its one top-level module, so every `crate::auth::` inside it stayed valid.
uses = base machine os net plex telemetry
members = auth

# Playback interfaces and optional independent implementations. Each mounted crate owns a
# distinct namespace; drivers cannot name shared route/Plex orchestration or one another.
[playback_contract]
uses = base
members = playback_contract

[media_codecs]
uses = base playback_contract
members = media_codecs

[play_uri]
uses = base os playback_contract
members = play_uri

[owp]
uses =
members = owp

[play_feed]
uses = base os net playback_contract media_codecs
members = play_feed

[media]
# EXTRACTED: this layer is the workspace crate `plx_media` (rust-modules/media/), the eleventh split
# of docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree (a path
# `plx_media::player::preview::reset_for_test` names module `player::preview`). The six
# modules that were the last import cycle (`abr curlio ff hls player route`) were all in this crate; the
# demuxer, `aq` and `hls` have since moved to `play_feed`, and this crate is neutral orchestration over the
# backend seam: transport for media, adaptive bitrate, the engine, route selection.
uses = base machine os gfx net plex telemetry data playback_contract play_feed media_codecs
members = ff abr adaptive curlio player route speed_audio subtitle_job http_test_support

[appkit]
# EXTRACTED: this layer is the workspace crate `plx_appkit` (rust-modules/appkit/), the twelfth split
# of docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree through the
# manifest's `mount = "appkit"` (a path `plx_appkit::player_hud::slot_for` names module
# `appkit::player_hud`), like `plx_ui`.
# Application widgets shared by several screens: compositions of ui components over application types.
# The sibling rule keeps shared widgets out of screens/.
uses = base machine os gfx net plex telemetry ui data session media
members = appkit

[screens]
# EXTRACTED: this layer is the workspace crate `plx_screens` (rust-modules/screens/), the thirteenth
# and last split of docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree
# through the manifest's `mount = "screens"` (a path `plx_screens::home::HomeScreen` names module
# `screens::home`), like `plx_ui` and `plx_appkit`.
# The application's screens (screens/CLAUDE.md): never a sibling screen, never the app.
# Its tests (the player pins) drive the Feed's transport flags: a dev-dependency edge, no production name.
uses = base machine os gfx net plex telemetry ui data session media appkit play_feed
members = screens

[app]
# The loop, its adapters and every dev/diagnostic surface; lib.rs's own items are the facade. `host` is the
# one doorway a platform crate names (re-exports of the construction interface, and `run`).
uses = base machine os gfx net plex telemetry ui data session media appkit screens shell_sdl playback_contract play_uri play_feed media_codecs
members =
    crate app dev lab capture remote focusprobe hud_cli hud_tools shot coldstart textinput release_line
    host

[platform webos]
# A PLATFORM CRATE, not a layer of the application: `plx_platform_webos` (rust-modules/platform-webos/),
# W7b of docs/platform-ports.md. It is ABOVE `app`: it depends on `plxnative-modules` and names its `host`
# module (the application's one published face, which hands the platform the types it builds and the ready
# media values), so it may name every layer and the application, and nothing names it. That is the one
# difference from the fence this section was before the move, which listed the modules that existed only
# because the target is webOS and had no `uses`. It is the one crate the ARM staticlib is built from.
# Its one member is the crate's mount (`[package.metadata.plx] mount = "platform_webos"`), so every module of
# the crate, `webos`, `keymanager`, `system` and `port`, is a module of it. The section is still a port, so
# the gate fails a reference from outside to the member by name, and `ci/check-module-layers.py` fails a
# platform that names another (no `uses` can spell a platform) and a package `plx_platform_<name>` that is
# not this section's member or has no mount.
# The native port does not carry the simulator's stand-ins: `play-feed/src/ffi_host.rs` is the
# simulator's own `VideoSink` (it lives with the Feed backend, in `[play_feed]`), outside this fence.
uses = base machine os gfx net plex telemetry ui data session media appkit screens shell_sdl playback_contract play_uri play_feed media_codecs app
members = platform_webos

[platform desktop]
# A PLATFORM CRATE like [platform webos]: `plx_platform_desktop` (rust-modules/platform-desktop/), the
# simulator's and the macOS app's own platform, mounted as `platform_desktop`, with the `plxnative-sim`
# binary. Its tables and its entry (`run`) are written for a host, from the shared `NONE` groups of `os`'s
# `tv` wherever a host has nothing to say, so nothing outside it needs to name it, and it names no other
# platform: no `uses` can spell one.
uses = base machine os gfx net plex telemetry ui data session media appkit screens shell_sdl playback_contract play_uri play_feed media_codecs app
members = platform_desktop
