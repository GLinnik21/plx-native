# The TARGET dependency graph of rust-modules/src: one section per future crate ("layer"), read by
# `ci/check-module-layers.py`. docs/module-layers.md is the design record — why each layer exists,
# what each migration step moves, and how to place a new module.
#
#   members  module paths, `::`-separated as Rust writes them. A top-level module, or a submodule
#            that will leave its parent for a different crate (`ui::machine`, `diag::zlib`).
#            `crate` is lib.rs's own items. A module belongs to the layer of its LONGEST listed
#            prefix, so every module of the crate must have one — a new top-level module fails the
#            gate until it is placed here.
#   uses     the layers this one may NAME (`crate::x::…`, `use crate::x`, `super::…` that climbs
#            into x, a `#[macro_export]` macro defined in x) — the crate's future [dependencies].
#            Not transitive, exactly like Cargo: list every layer the code names. The graph of
#            `uses` must be acyclic; diamonds are fine.
#
# A reference that names a layer not in `uses` is a violation, unless ci/allow/layers.txt lists it
# (one entry per file and named member, tagged with the plan step that removes it). Moving a
# module to another layer, or adding a `uses` edge, is a design change: make it here, in the same
# diff as the code that needs it, and say why in docs/module-layers.md. A design change that
# re-layers modules, or declares a port (below), that other code already names records those
# references as a new step's entries in that same diff, as step L15 did. Otherwise the list only
# shrinks. The one exception is renaming or splitting a listed file, which moves its entries to the
# new path.

[base]
# EXTRACTED: this layer is the workspace crate `plx_base` (rust-modules/base/), the first split of
# docs/module-layers.md. ci/module_graph.py reads it as part of the same module tree (a path
# `plx_base::eventlog::log` names module `eventlog`), so the members below are still the module
# paths of the whole app and this section still says that nothing in them may name another layer.
# Leaf utilities: the event log, the process-wide spawn/blocking discipline, file locations, the
# dlopen seam, the frame instruments, the shelf-tile trait the data layer implements and `ui`
# draws through (neither may name the other), and the test-only lock/net helpers every layer's
# tests use.
uses =
members =
    eventlog paths task cbuf sha256 b64 spki dynlib checkpoint storage_worker fontcov surface tile
    diag::zlib diag::spans diag::heartbeat
    devtrig
    testlock testnet

[machine]
# EXTRACTED: this layer is the workspace crate `plx_machine` (rust-modules/machine/), the second
# split of docs/module-layers.md. Its modules were `ui::machine` ... `ui::motion`; they are now
# top-level modules of that crate, which ci/module_graph.py reads as part of the same module tree
# (a path `plx_machine::idle::note` names module `idle`).
# The deterministic state-machine runtime the stores, auth and screens are written against:
# machines and effects, the present gate, the idle/frame wake, the landing schedule, motion.
# It lived under ui/ and is not UI.
uses = base
members = machine present idle landgate landing motion

[platform]
# EXTRACTED: this layer is the workspace crate `plx_platform` (rust-modules/platform/), the third
# split of docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree (a
# path `plx_platform::storage::open` names module `storage`). `webos` and `keymanager` are also in
# [port webos] below, and the port fence still reads references to them by that name.
# What this television is and keeps: webOS identity, the storage helper client, the key stores,
# the codec table, the artwork cache, the localization catalog, and the Cloud Lab session file
# (`labcfg`: `lab.json` plus the trigger-key / menu-row answers `ui/` and `screens/` ask of it).
# `webos` and `keymanager` are also in [port webos]. `tv` holds the interfaces the webOS port fills
# at boot (step L15): device identity, the sandbox verdict, the key store, home, toast, the window
# and the video sink trait.
uses = base machine
members = webos storage keymanager devcaps imgcache i18n labcfg tv

[gfx]
# EXTRACTED: this layer is the workspace crate `plx_gfx` (rust-modules/gfx/), the fourth split of
# docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree (a path
# `plx_gfx::text::elide` names module `text`). `overdraw` was `ui::overdraw`.
# GL, EGL, text rasterization, images, vector icons and the GPU instruments. The crate names
# nothing of `platform` today, so it does not depend on `plx_platform`; the ceiling stays.
uses = base machine platform
members = gfx egl text img svg gpu_timer hwcnt overdraw

[net]
# EXTRACTED: this layer is the workspace crate `plx_net` (rust-modules/net/), the fifth split of
# docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree (a path
# `plx_net::net::keypin::is_latched` names module `net`). The crate depends on `plx_base` only;
# `platform` stays in `uses` because the layer may name it, not because anything does today.
# The two transports: libcurl HTTPS and the plaintext socket stream.
uses = base platform
members = net stream

[plex]
# EXTRACTED: this layer is the workspace crate `plx_plex` (rust-modules/plex/), the seventh split of
# docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree (a path
# `plx_plex::plex::session::load` names module `plex::session`, `plx_plex::http` names `http`).
# The typed Plex API (PMS + plex.tv), the session store, and the one request door.
uses = base machine platform net
members = plex http

[telemetry]
# EXTRACTED: this layer is the workspace crate `plx_telemetry` (rust-modules/telemetry/), the eighth
# split of docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree (a path
# `plx_telemetry::telemetry::consent::current` names module `telemetry::consent`,
# `plx_telemetry::diag::schema` names `diag::schema`). `diag::{heartbeat, spans, zlib}` are not here:
# they are `plx_base::diag::*`, a different module of the same name.
# Consent, the opt-in crash/usage channels, and the typed usage-event schema they carry.
uses = base machine platform net plex
members = telemetry diag

[ui]
# EXTRACTED: this layer is the workspace crate `plx_ui` (rust-modules/ui/), the sixth split of
# docs/module-layers.md. Its `lib.rs` is what was `ui/mod.rs`, so the crate is ONE module of the
# application's tree, not its root: its manifest says `[package.metadata.plx] mount = "ui"`, and
# ci/module_graph.py reads `plx_ui::theme::X` and the `crate::theme` written inside the crate as
# module `ui::theme`. That is why the member below is still `ui`.
# The UI LIBRARY (ui/src/CLAUDE.md's layer rule): widgets, containers, the frame — no application type.
uses = base machine platform gfx
members = ui

[data]
# EXTRACTED: this layer is the workspace crate `plx_data` (rust-modules/data/), the ninth split of
# docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree (a path
# `plx_data::stores::hubs::HubsStore` names module `stores::hubs`, `plx_data::pms::seed_for_test`
# names `pms`). The members below are still the top-level modules of that crate, and the manifest
# depends on `plx_base`, `plx_machine`, `plx_platform`, `plx_plex` and `plx_telemetry` (`net` is a
# dev-dependency only: one fixture test calls it).
# The content stores and their data modules.
uses = base machine platform net plex telemetry
members = stores browse metadata person collection search viewstate pms

[session]
# plex.tv sign-in, discovery, who's-watching and install.
# EXTRACTED: this layer is the workspace crate `plx_session` (rust-modules/session/), the tenth split
# of docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree (a path
# `plx_session::auth::owner::SessionMachine` names module `auth::owner`). The crate keeps `auth` as
# its one top-level module, so every `crate::auth::` inside it stayed valid.
uses = base machine platform net plex telemetry
members = auth

[media]
# EXTRACTED: this layer is the workspace crate `plx_media` (rust-modules/media/), the eleventh split
# of docs/module-layers.md; ci/module_graph.py reads it as part of the same module tree (a path
# `plx_media::player::preview::reset_for_test` names module `player::preview`). `player::ffi` is
# also in [port webos] below, and the port fence still reads references to it by that name. The six
# modules that were the last import cycle (`abr curlio ff hls player route`) are all in this crate.
# Demux, transport for media, adaptive bitrate, the engine, route selection.
uses = base machine platform gfx net plex telemetry data
members = ff aq abr hls curlio player route

[appkit]
# Application widgets shared by several screens: compositions of ui components over application types.
# The sibling rule keeps shared widgets out of screens/.
uses = base machine platform gfx net plex telemetry ui data session media
members = appkit

[screens]
# The application's screens (screens/CLAUDE.md): never a sibling screen, never the app.
uses = base machine platform gfx net plex telemetry ui data session media appkit
members = screens

[app]
# The loop, its adapters and every dev/diagnostic surface; lib.rs's own items are the facade.
uses = base machine platform gfx net plex telemetry ui data session media appkit screens
members =
    crate app dev lab capture remote focusprobe shot coldstart textinput system release_line port

[port webos]
# Not a layer: the modules that exist only because the target is webOS. Identity, capability and
# repair (`webos`), the LS2 key stores (`keymanager`), the SDL/Wayland window glue (`system`), the
# Starfish/ACB playback seam (`player::ffi`, which implements `tv::sink::VideoSink`) and `port`,
# which holds `plex_run` and the table the port installs at boot. They stay in their layers above
# for the crate split, and nothing outside the port may name them.
# `player::ffi` no longer carries the simulator's stand-ins: `player/ffi_host.rs` is the
# simulator's own `VideoSink`, outside this fence. Everything else reaches the television through
# the interfaces in [platform]'s `tv` that the port fills at boot (docs/module-layers.md, step
# L15). Nothing outside names the port, so it can become its own crate on top, and another TV OS
# another port beside it.
members = webos keymanager system player::ffi port
