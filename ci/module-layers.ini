# The TARGET dependency graph of rust-modules/src: one section per future crate ("layer"), read by
# `ci/check-module-layers.py`. docs/module-layers.md is the design record — why each layer exists,
# what each migration step moves, and how to place a new module.
#
#   members  module paths, `::`-separated as Rust writes them. A top-level module, or a submodule
#            that will leave its parent for a different crate (`ui::machine`, `diag::zlib`).
#            `crate` is lib.rs's own items. A module belongs to the layer of its LONGEST listed
#            prefix, so every module of the crate must have one — a new top-level module fails the
#            gate until it is placed here.
#   uses     the layers this one may NAME (`crate::x::…`, `use crate::x`, `super::…` that climbs
#            into x, a `#[macro_export]` macro defined in x) — the crate's future [dependencies].
#            Not transitive, exactly like Cargo: list every layer the code names. The graph of
#            `uses` must be acyclic; diamonds are fine.
#
# A reference that names a layer not in `uses` is a violation. The ones that existed when this
# file was written are ci/allow/layers.txt, one entry per (file, named member); that list only
# shrinks, except that renaming or splitting a listed file moves its entries to the new path. Moving a module to another layer, or adding a `uses` edge, is a design change: make it
# here, in the same diff as the code that needs it, and say why in docs/module-layers.md.

[base]
# Leaf utilities: the event log, the process-wide spawn/blocking discipline, file locations, the
# dlopen seam, the frame instruments, the shelf-tile trait the data layer implements and `ui`
# draws through (neither may name the other), and the test-only lock/net helpers every layer's
# tests use.
uses =
members =
    eventlog paths task cbuf sha256 b64 spki dynlib checkpoint storage_worker fontcov surface tile
    diag::zlib diag::spans diag::heartbeat
    devtrig
    testlock testnet

[machine]
# The deterministic state-machine runtime the stores, auth and screens are written against:
# machines and effects, the present gate, the idle/frame wake, the landing schedule, motion.
# It lives under ui/ today and is not UI.
uses = base
members = ui::machine ui::present ui::idle ui::landgate ui::landing ui::motion

[platform]
# What this television is and keeps: webOS identity, the storage helper client, the key stores,
# the codec table, the artwork cache, the localization catalog, and the Cloud Lab session file
# (`labcfg`: `lab.json` plus the trigger-key / menu-row answers `ui/` and `screens/` ask of it).
uses = base machine
members = webos storage keymanager devcaps imgcache i18n labcfg

[gfx]
# GL, EGL, text rasterization, images, vector icons and the GPU instruments.
uses = base machine platform
members = gfx egl text img svg gpu_timer hwcnt ui::overdraw

[net]
# The two transports: libcurl HTTPS and the plaintext socket stream.
uses = base platform
members = net stream

[plex]
# The typed Plex API (PMS + plex.tv), the session store, and the one request door.
uses = base machine platform net
members = plex http

[telemetry]
# Consent, the opt-in crash/usage channels, and the typed usage-event schema they carry.
uses = base machine platform net plex
members = telemetry diag

[ui]
# The UI LIBRARY (ui/CLAUDE.md's layer rule): widgets, containers, the frame — no application type.
uses = base machine platform gfx
members = ui

[data]
# The content stores and their data modules.
uses = base machine platform net plex telemetry
members = stores browse metadata person collection search viewstate pms

[session]
# plex.tv sign-in, discovery, who's-watching and install.
uses = base machine platform net plex telemetry
members = auth

[media]
# Demux, transport for media, adaptive bitrate, the engine, route selection.
uses = base machine platform gfx net plex telemetry data
members = ff aq abr hls curlio player route

[screens]
# The application's screens (screens/CLAUDE.md): never a sibling screen, never the app.
uses = base machine platform gfx net plex telemetry ui data session media
members = screens

[app]
# The loop, its adapters and every dev/diagnostic surface; lib.rs's own items are the facade.
uses = base machine platform gfx net plex telemetry ui data session media screens
members =
    crate app dev lab capture remote focusprobe shot coldstart textinput system release_line
