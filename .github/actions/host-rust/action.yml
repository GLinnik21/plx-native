name: Provision the host Rust toolchain
description: >
  The nightly toolchain and the cargo cache every Rust job of ci.yml's host checks shares, plus
  (only when asked) the desktop SDL/GL libraries a host test binary LINKS against. Three jobs used
  to be one, and each of them needs these same steps; the copies are this one file so they cannot
  drift apart.

# The job names ONE toolchain in its own `env:` (RUST_NIGHTLY): `cargo +<name>` against a
# toolchain the job never installed fails with a rustup error that reads nothing like "these two
# lines disagree", so the install here and the `cargo +$RUST_NIGHTLY` in the job read the same
# variable. A composite action sees the calling job's `env:`.

inputs:
  sdl:
    description: >
      "true" to apt-install libsdl2-dev, libsdl2-ttf-dev and libgl1-mesa-dev. Only a job that
      LINKS a test binary needs them: build.rs links SDL2/SDL2_ttf/GL for every host test binary
      (the default `cargo test --lib` as well as the `hostsim` one), whereas clippy and
      `cargo check` never link, and the apt step has taken 132-1174 s on a noisy runner
      (the .deb download is the variance; the cache step below keeps it off the network).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore the apt packages the SDL/GL install downloads
      # Measured over the host-unit jobs of CI runs 36894250926..36901262288: `apt-get update` is a
      # steady ~1 s and the toolchain + rust-cache steps a steady ~15 s, while `apt-get install`
      # spent 3 s - 10 min 17 s FETCHING the same 26.3 MB (95 .deb files) from
      # azure.archive.ubuntu.com (9 MB/s at best, 42 kB/s at worst). The download is the whole
      # variance, so it is the one thing kept off the network: the .debs ride the actions cache,
      # keyed on the OS, the architecture and this file (which names the packages). The key does
      # NOT name the runner image: `env.ImageVersion` is not visible to a composite action's
      # expressions (it keyed as empty), and it is not needed for correctness, because apt
      # re-validates the cached .debs against its package lists and re-downloads any that no
      # longer match. A changed action file starts cold, and only the first run per key saves.
      if: inputs.sdl == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/apt-debs
        key: apt-debs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/host-rust/action.yml') }}

    - name: Install the desktop SDL/GL libraries the unit suites LINK against
      if: inputs.sdl == 'true'
      shell: bash
      run: |
        pkgs=(libsdl2-dev libsdl2-ttf-dev libgl1-mesa-dev)
        opts=(-y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30)
        debs="$HOME/apt-debs"
        archives=/var/cache/apt/archives
        mkdir -p "$debs"
        sudo find "$debs" -maxdepth 1 -name '*.deb' -exec cp -n -t "$archives" {} +

        # Fetch first, install second. The fetch is the only network-bound phase, so it is the
        # only one a timeout may interrupt: apt resumes a partial .deb, a retry opens a fresh
        # connection (a throttled one is what made a run take 10 minutes), and nothing is ever
        # killed halfway through dpkg. The runner image already carries package lists, so try
        # WITHOUT `apt-get update` first (a cache hit is then entirely local) and refresh the
        # lists only when that fails, e.g. a mirror that has dropped the version the old lists name.
        fetch() { sudo apt-get install --download-only "${opts[@]}" "${pkgs[@]}"; }
        if ! timeout 120 sudo apt-get install --download-only "${opts[@]}" "${pkgs[@]}"; then
          echo "::warning::apt fetch without a list refresh failed or stalled; refreshing and retrying"
          sudo apt-get update
          timeout 120 sudo apt-get install --download-only "${opts[@]}" "${pkgs[@]}" \
            || timeout 120 sudo apt-get install --download-only "${opts[@]}" "${pkgs[@]}" \
            || fetch  # last resort, no timeout: a slow mirror then costs time, never a red run
        fi

        sudo apt-get install "${opts[@]}" "${pkgs[@]}"
        # Hand the downloaded .debs to the cache step's post-job save (a no-op on an exact hit).
        find "$archives" -maxdepth 1 -name '*.deb' -exec cp -n -t "$debs" {} +

    - name: Install nightly Rust
      # Both components are load-bearing for ci.yml's jobs as a set and neither is in rustup's
      # `minimal` profile:
      #   clippy   -> `make lint`, the shadowed-branch gate
      #   rust-src -> `-Z build-std`, which the ARM build cannot work without
      # They are installed in every Rust job, as the single job always did, so a host job's
      # toolchain is byte-for-byte the one `make check` ran against.
      shell: bash
      run: |
        rustup toolchain install "$RUST_NIGHTLY" --profile minimal \
          --component clippy --component rust-src
        rustup run "$RUST_NIGHTLY" rustc --version

    - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # The cache key already carries the calling job's id, so the three Rust jobs each keep their
      # own `target/` instead of racing to save one.
      with:
        workspaces: rust-modules
