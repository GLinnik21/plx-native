name: Cache the pinned downloads
description: >
  Restore and save vendor/downloads, the one directory ci/deps.py fetches every pinned archive
  into (FFmpeg, Sentry Native, the libass stack, nanosvg, the webosbrew toolbox), keyed on the
  manifest. A hit means an upstream outage (savannah.gnu.org has been unreachable for hours) cannot
  break the build: ci/deps.py re-verifies each cached file against its sha256 and downloads only
  what is missing or wrong.

# The key is the manifest's own hash and nothing else, so a change to a build script never re-saves
# the archives. No restore-keys: a prefix match could only hand back an older set of the same files,
# which ci/deps.py would verify and replace one by one anyway, but a miss is simpler to reason about.
#
# Call it after actions/checkout; the manifest has to be on disk to be hashed.

runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: vendor/downloads
        key: deps-downloads-${{ hashFiles('ci/dependencies.json') }}
