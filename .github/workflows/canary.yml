name: Public storage canary

# Separate from release.yml by design: this publishes a test-only debug-id prerelease and never
# changes releases/latest, the stable package manifest, or webosbrew.
on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Canary label: X.Y.Z-rc.N (for example 0.6.6-rc.1)'
        required: true
        type: string
      dry_run:
        # Proves this pipeline end to end — including the shared build-package.yml — without
        # touching the public release list: when true, `publish` (the only job with `contents:
        # write` and the only one that talks to the GitHub Releases API) is skipped entirely, so a
        # branch can exercise the build + gates through a normal workflow_dispatch run with nothing
        # observable outside the run itself.
        description: 'Build and gate everything but skip publish (prove the pipeline with nothing published)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-storage-canary-${{ inputs.label }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate canary label
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.label.outputs.label }}
      tag: ${{ steps.label.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: label
        env:
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          if ! [[ "$LABEL" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([1-9][0-9]*)$ ]]; then
            echo "::error::label '$LABEL' must be X.Y.Z-rc.N, with N >= 1."
            exit 1
          fi
          base="${BASH_REMATCH[1]}"
          app_version=$(python3 -c "import json; print(json.load(open('pkg/appinfo.json'))['version'])")
          [ "$base" = "$app_version" ] || {
            echo "::error::label base $base does not match pkg/appinfo.json version $app_version."
            exit 1
          }
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "tag=canary/v$LABEL" >> "$GITHUB_OUTPUT"

  host-checks:
    name: host + shipping feature checks
    runs-on: ubuntu-latest
    needs: validate
    env:
      RUST_NIGHTLY: nightly-2026-07-02
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libgl1-mesa-dev
      - name: Install nightly Rust
        run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component clippy --component rust-src
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: rust-modules
      - name: Host checks
        run: make check
      - name: Type-check shipping feature set
        run: CARGO_INCREMENTAL=0 cargo "+$RUST_NIGHTLY" check --manifest-path rust-modules/Cargo.toml --lib --no-default-features

  build:
    name: ARM package + compatibility gates
    needs: [validate, host-checks]
    # The ARM build+verify pipeline itself lives in build-package.yml — shared with release.yml so
    # the two stop being hand-kept copies of one job. The ARM build's toolchain now comes from
    # build-package.yml's own `vars.RUST_NIGHTLY || 'nightly-2026-07-02'`, not from anything set
    # here. `host-checks` above still pins its own `RUST_NIGHTLY: nightly-2026-07-02` via job env
    # for the host-side checks, which this job does not touch — the two pins must move together.
    uses: ./.github/workflows/build-package.yml
    with:
      ref: ${{ github.sha }}
      flavor: debug
      telemetry: development
      artifact: public-storage-canary
      caches: true
      fwcompat: true
      # false is NOT because canary is exempt from LGPL's source obligation — any caller that
      # publishes the package redistributes FFmpeg and owes the corresponding source, so
      # build-package.yml's default is true (fail-closed) for exactly that reason. This is a
      # known gap: the public canary prerelease ships with no FFmpeg source attached today, to
      # close when the nightly caller replaces it.
      source-asset: false
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  publish:
    name: publish public prerelease
    runs-on: ubuntu-latest
    needs: [validate, build]
    # `dry_run` proves the build + gates on a branch without publishing anything: this is the only
    # job with `contents: write`, and the only one that reaches the GitHub Releases API.
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Refuse to overwrite an immutable canary
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || { echo "::error::$TAG already exists; choose a new rc label."; exit 1; }
          ! gh release view "$TAG" >/dev/null 2>&1 || { echo "::error::release $TAG already exists; choose a new rc label."; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-storage-canary
          path: raw
      - name: Stage public canary asset
        # build-package.yml uploads the raw package tree (pkg/*), same as release.yml's own
        # artifact, so this job renames the one file the public actually downloads: the debug-flavour
        # .ipk, under the canary's own label rather than its flavoured package id.
        env:
          LABEL: ${{ needs.validate.outputs.label }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp raw/com.beb.plxnative.debug_*_arm.ipk "dist/plxnative-debug-v${LABEL}.ipk"
          sha256sum "dist/plxnative-debug-v${LABEL}.ipk" > dist/canary.sha256
      - name: Verify and publish test-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          LABEL: ${{ needs.validate.outputs.label }}
        run: |
          set -euo pipefail
          sha256sum -c dist/canary.sha256
          gh release create "$TAG" "dist/plxnative-debug-v${LABEL}.ipk" \
            --target "$GITHUB_SHA" \
            --title "Public storage canary v${LABEL}" \
            --prerelease \
            --latest=false \
            --notes 'Test-only storage canary. It installs beside the stable PlxNative app; do not treat it as a stable release.'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .prerelease)" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .target_commitish)" = "$GITHUB_SHA"
          test "$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[0].uploader.login')" = 'github-actions[bot]'
          mkdir -p verify
          gh release download "$TAG" --pattern "plxnative-debug-v${LABEL}.ipk" --dir verify
          test "$(sha256sum "verify/plxnative-debug-v${LABEL}.ipk" | cut -d' ' -f1)" = "$(cut -d' ' -f1 dist/canary.sha256)"
