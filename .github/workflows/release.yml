name: Release

# Publishes the .ipk and the webosbrew manifest.json to a GitHub Release, so that
# `releases/latest/download/com.beb.plxnative.manifest.json` is a stable URL the Homebrew Channel
# package YAML can point at forever. The package YAML is submitted ONCE; every later version flows
# through this workflow with no further PR to webosbrew/apps-repo.
#
# TWO TRAPS ENCODED BELOW, both of which fail silently rather than loudly:
#  1. gen-manifest writes a BARE FILENAME into ipkUrl, resolved relative to the manifest URL. The
#     .ipk and the manifest must therefore be assets of the SAME release.
#  2. A draft or prerelease is excluded from `releases/latest`, so publishing one leaves users
#     resolving the PREVIOUS release's manifest — an update that silently never arrives.
#     Hence: no draft, no prerelease.
#
# Separate from ci.yml because this is the only workflow that needs `contents: write`. Merging them
# would put a write token on every pull-request run.

# HOW TO CUT A RELEASE: Actions -> Release -> Run workflow, pick a bump level, done. The `prepare`
# job below writes the version, commits, tags and pushes; everything after it is the build that was
# already here. Nothing is edited or tagged by hand, which removes the two ways this used to go
# wrong — a tag that did not exist yet, and four version files drifting apart.
#
# NO DOUBLE BUILD: the tag `prepare` pushes uses GITHUB_TOKEN, and GitHub deliberately does not
# start a workflow run from a GITHUB_TOKEN push. So the `push: tags` trigger below stays for a
# hand-pushed tag without re-firing on our own.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (ignored if "version" is set)'
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Explicit X.Y.Z instead of a bump level'
        required: false
      rebuild_tag:
        description: 'Re-publish an EXISTING tag (skips the version bump entirely)'
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: bump + tag
    runs-on: ubuntu-latest
    # Skipped for a tag push (the tag already exists) and for an explicit rebuild.
    if: github.event_name == 'workflow_dispatch' && !inputs.rebuild_tag
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # a shallow clone cannot push
          fetch-depth: 0
      - name: Bump the version and tag it
        id: bump
        run: |
          set -euo pipefail
          spec='${{ inputs.version || inputs.bump }}'
          python3 ci/bump-version.py "$spec"
          new=$(python3 ci/bump-version.py --current)
          tag="v$new"

          # THE question that decides whether this version may ship, asked where the answer lives.
          # An explicit `version:` equal to what appinfo.json already says is legitimate — it is
          # exactly the first release, "ship what is already written" — so the script no longer
          # refuses it. What must never repeat is a TAG.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. To re-publish it use the rebuild_tag input; to ship something new pick a bump level."
            exit 1
          fi

          # Prove the four files agree BEFORE committing — this is the assertion that makes the
          # whole scheme safe, and it is cheaper to fail here than after a tag exists.
          python3 ci/check-package.py

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pkg/appinfo.json ipkroot/ctl/control rust-modules/Cargo.toml rust-modules/Cargo.lock
          # No commit when the version did not move (the first release, or a re-run after one
          # failed downstream): the tag then simply points at main as it stands.
          if git diff --cached --quiet; then
            echo "version already $new — tagging main as it stands"
          else
            git commit -m "release: $new"
          fi
          git tag -a "$tag" -m "$new"
          git push origin main "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "released **$tag**" >> "$GITHUB_STEP_SUMMARY"

  guard:
    name: tag / version agreement
    runs-on: ubuntu-latest
    needs: prepare
    # `prepare` is skipped on a tag push and on a rebuild, and a skipped dependency skips its
    # dependents — so accept any non-failed outcome and take the ref from whichever path ran.
    if: always() && needs.prepare.result != 'failure' && needs.prepare.result != 'cancelled'
    outputs:
      # THE resolved tag for the whole run. Every later job reads this rather than repeating the
      # fallback chain, because `needs` exposes only DIRECT dependencies and none of them can see
      # `prepare`. Three ways in: a fresh bump, an explicit rebuild, or a hand-pushed tag.
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: ref
        run: |
          tag='${{ needs.prepare.outputs.tag || inputs.rebuild_tag || github.ref_name }}'
          [ -n "$tag" ] || { echo "::error::no tag resolved"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}
      - name: The tag must match pkg/appinfo.json
        # appinfo.json is the single source of the version (the Makefile derives IPK_VERSION from
        # it). A tag that disagrees would publish an .ipk whose filename, control file and manifest
        # all say something else — and webosbrew's registry reads the version out of the archive.
        run: |
          set -euo pipefail
          tag='${{ steps.ref.outputs.tag }}'
          want="${tag#v}"
          have=$(python3 -c "import json;print(json.load(open('pkg/appinfo.json'))['version'])")
          [ "$want" = "$have" ] || {
            echo "::error::tag $tag implies version $want but pkg/appinfo.json says $have"; exit 1; }
          echo "version $have" >> "$GITHUB_STEP_SUMMARY"
      - name: Packaging assertions
        run: python3 ci/check-package.py

  legal-gate:
    name: redistributable assets
    runs-on: ubuntu-latest
    needs: [guard]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.tag }}
      - name: LICENSE and third-party notices must exist
        # docs/distribution.md blockers #1 and #2. A release is the moment these stop being
        # to-do items and start being legal exposure: LGPL 2.1 §6 requires the notice and the
        # licence text to travel WITH the binary, and webosbrew `pool: main` requires open source.
        run: |
          set -euo pipefail
          missing=()
          [ -f LICENSE ] || missing+=("LICENSE")
          [ -f THIRD-PARTY-NOTICES.md ] || missing+=("THIRD-PARTY-NOTICES.md")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::cannot publish without: ${missing[*]} (see docs/distribution.md §5)"
            exit 1
          fi
      - name: Shipped fonts must be redistributable
        # Was the single hard licensing blocker; cleared 2026-08-01 when Inter (OFL 1.1) replaced
        # Monotype Arial, and `ci/check-package.py` now gates the family on every run rather than
        # treating it as an XFAIL. This step stays because the failure mode it guards is a RELAPSE:
        # the files are named appfont*.ttf, so nothing about a stale local copy being committed back
        # would look wrong in a diff. This job is what puts them in front of the public.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct, sys
          from pathlib import Path
          def family(p):
              b = p.read_bytes(); (n,) = struct.unpack(">H", b[4:6])
              for i in range(n):
                  o = 12 + 16*i
                  if b[o:o+4] == b"name":
                      t, = struct.unpack(">I", b[o+8:o+12])
                      c, s = struct.unpack(">HH", b[t+2:t+6])
                      for r in range(c):
                          ro = t + 6 + 12*r
                          pid,_,_,nid,ln,no = struct.unpack(">HHHHHH", b[ro:ro+12])
                          if nid == 1:
                              raw = b[t+s+no:t+s+no+ln]
                              return raw.decode("latin-1" if pid == 1 else "utf-16-be", "replace")
              return "?"
          bad = [str(p) for p in Path("pkg").glob("appfont*.ttf") if family(p) == "Arial"]
          if bad:
              print("::error::refusing to publish Monotype Arial: " + ", ".join(bad))
              print("See docs/distribution.md §5.3 — swap to Arimo (metric-compatible) or Inter.")
              sys.exit(1)
          PY

  build:
    name: build + verify
    runs-on: ubuntu-24.04-arm
    needs: [legal-gate, guard]
    outputs:
      ipk: ${{ steps.name.outputs.ipk }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.tag }}

      - name: Install pinned nightly Rust
        # Pinned by DATE for releases. `-Z build-std` recompiles std from source and is the most
        # drift-sensitive thing this build does; a release should be reproducible from its tag,
        # which an unpinned `nightly` cannot be. Bump deliberately, alongside a device test run.
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rust-src
          rustup run "$RUST_NIGHTLY" rustc --version
        env:
          RUST_NIGHTLY: ${{ vars.RUST_NIGHTLY || 'nightly' }}

      - id: ndk
        uses: ./.github/actions/webos-ndk

      - name: Build + package
        # No src/config.local.h exists in a clean checkout, so src/app.h's __has_include falls back
        # to the YOUR_PMS_HOST placeholder. That is what makes the CI-built binary the leak-free
        # one by construction rather than by discipline — check-elf.sh asserts it below.
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}
          RUST_NIGHTLY: ${{ vars.RUST_NIGHTLY || 'nightly' }}
          # Drops the `devtools` cargo feature — no on-screen counter in a public build.
          RELEASE: "1"
        run: |
          make -j"$(nproc)"
          make ipk
          # Prove the flag actually took, rather than trusting that it did: the Makefile records
          # the configuration it built, and a stale/ignored RELEASE= is exactly the silent failure
          # the parse-time stamp exists to prevent.
          grep -q -- '--no-default-features' pkg/.build-config \
            || { echo "::error::RELEASE=1 did not take — pkg/.build-config says [$(cat pkg/.build-config)]"; exit 1; }

      - name: ELF + packaging assertions
        run: |
          ./ci/check-elf.sh
          python3 ci/check-package.py
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}

      - name: webosbrew tooling
        run: |
          set -euo pipefail
          TAG=v20260731-e1bb0c0
          for p in fw-symbols ipk-verify gen-manifest; do
            curl -fsSLO "https://github.com/webosbrew/dev-toolbox-cli/releases/download/${TAG}/webosbrew-toolbox-${p}_0.4.0-1_arm64.deb"
          done
          sudo apt-get install -y ./webosbrew-toolbox-*.deb

      - name: Compatibility check (gating)
        run: |
          webosbrew-ipk-verify --details --format markdown \
            --fw-releases '>=4.0' pkg/*.ipk | tee -a "$GITHUB_STEP_SUMMARY"

      - id: name
        run: echo "ipk=$(ls pkg/*.ipk)" >> "$GITHUB_OUTPUT"

      - name: Generate the Homebrew Channel manifest
        # -r false: the app needs no root. Device-proven — it runs jailed as uid 6910 under LG's
        # stock jail_native_devmode profile. See docs/distribution.md §3.5.
        run: |
          # icon160.png, NOT largeIcon.png: 130x130 is LG's launcher size, while the channel
          # listing wants 160 (and 320 for the detail icon) — `tools/mkicons.py` cuts all four from
          # one master for exactly this reason. The URL must return 200 or webosbrew's own
          # `repogen.lintpkg` rejects the submission, which means the REPO MUST BE PUBLIC and the
          # icon must be committed on the default branch before the first release.
          webosbrew-gen-manifest \
            -p "${{ steps.name.outputs.ipk }}" \
            -i "https://raw.githubusercontent.com/${{ github.repository }}/main/pkg/icon160.png" \
            -l "https://github.com/${{ github.repository }}" \
            -r false \
            -o pkg/com.beb.plxnative.manifest.json
          cat pkg/com.beb.plxnative.manifest.json

      - name: The manifest hash must match the artifact
        # The sha256 is enforced ON THE DEVICE at install time and by nothing in CI, so a mismatch
        # here is invisible until it breaks every user's install. Assert it while we still can.
        run: |
          set -euo pipefail
          want=$(python3 -c "import json;print(json.load(open('pkg/com.beb.plxnative.manifest.json'))['ipkHash']['sha256'])")
          have=$(sha256sum "${{ steps.name.outputs.ipk }}" | cut -d' ' -f1)
          [ "$want" = "$have" ] || { echo "::error::manifest sha256 $want != artifact $have"; exit 1; }
          echo "ipk sha256 $have" >> "$GITHUB_STEP_SUMMARY"

      - name: LGPL corresponding source for the bundled FFmpeg
        # NOT optional and not paperwork. The package ships four FFmpeg shared libraries, so
        # LGPL-2.1's source obligation is OURS rather than the television's, and
        # THIRD-PARTY-NOTICES.md §1.1 states in writing that the exact tarball and the complete
        # configure invocation accompany every release. A release without these contradicts the
        # notice that ships inside it.
        #
        # The tarball is the pristine upstream one build-ffmpeg.sh already downloaded and verified
        # against a pinned sha256 — no patches are applied, so this IS the corresponding source.
        run: |
          set -euo pipefail
          tarball=$(ls vendor/ffmpeg-build/ffmpeg-*.tar.xz)
          cp "$tarball" pkg/
          cp ci/build-ffmpeg.sh pkg/
          echo "LGPL source: $(basename "$tarball") + build-ffmpeg.sh" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            pkg/*.ipk
            pkg/*.manifest.json
            pkg/ipk.sha256
            pkg/ffmpeg-*.tar.xz
            pkg/build-ffmpeg.sh

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: [build, guard]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          # NEITHER of these may become true: both exclude the release from `releases/latest`,
          # which is the URL the webosbrew package YAML resolves the manifest through.
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.ipk
            dist/*.manifest.json
            dist/ipk.sha256
            dist/ffmpeg-*.tar.xz
            dist/build-ffmpeg.sh
      - name: Propagation note
        run: |
          {
            echo "### Published"
            echo "webosbrew's registry has no webhook — it rebuilds on a \`cron: 41 */3 * * *\`"
            echo "schedule and re-fetches every manifest, so expect **~1.5-3 h** before the"
            echo "Homebrew Channel offers this update, plus a ~10 min CDN TTL."
            echo ""
            echo "The Channel compares versions by plain **string equality**, not semver — any"
            echo "change to the version string reads as an update."
          } >> "$GITHUB_STEP_SUMMARY"
