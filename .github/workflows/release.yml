name: Release

# Publishes the .ipk and the webosbrew manifest.json to a GitHub Release, so that
# `releases/latest/download/com.beb.plxnative.manifest.json` is a stable URL the Homebrew Channel
# package YAML can point at forever. The package YAML is submitted ONCE; every later version flows
# through this workflow with no further PR to webosbrew/apps-repo.
#
# TWO TRAPS ENCODED BELOW, both of which fail silently rather than loudly:
#  1. gen-manifest writes a BARE FILENAME into ipkUrl, resolved relative to the manifest URL. The
#     .ipk and the manifest must therefore be assets of the SAME release.
#  2. A draft or prerelease is excluded from `releases/latest`, so publishing one leaves users
#     resolving the PREVIOUS release's manifest — an update that silently never arrives.
#     Hence: no draft, no prerelease.
#
# Separate from ci.yml because this is the only workflow that needs `contents: write`. Merging them
# would put a write token on every pull-request run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: tag / version agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: The tag must match pkg/appinfo.json
        # appinfo.json is the single source of the version (the Makefile derives IPK_VERSION from
        # it). A tag that disagrees would publish an .ipk whose filename, control file and manifest
        # all say something else — and webosbrew's registry reads the version out of the archive.
        run: |
          set -euo pipefail
          tag='${{ inputs.tag || github.ref_name }}'
          want="${tag#v}"
          have=$(python3 -c "import json;print(json.load(open('pkg/appinfo.json'))['version'])")
          [ "$want" = "$have" ] || {
            echo "::error::tag $tag implies version $want but pkg/appinfo.json says $have"; exit 1; }
          echo "version $have" >> "$GITHUB_STEP_SUMMARY"
      - name: Packaging assertions
        run: python3 ci/check-package.py

  legal-gate:
    name: redistributable assets
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: LICENSE and third-party notices must exist
        # docs/distribution.md blockers #1 and #2. A release is the moment these stop being
        # to-do items and start being legal exposure: LGPL 2.1 §6 requires the notice and the
        # licence text to travel WITH the binary, and webosbrew `pool: main` requires open source.
        run: |
          set -euo pipefail
          missing=()
          [ -f LICENSE ] || missing+=("LICENSE")
          [ -f THIRD-PARTY-NOTICES.md ] || missing+=("THIRD-PARTY-NOTICES.md")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::cannot publish without: ${missing[*]} (see docs/distribution.md §5)"
            exit 1
          fi
      - name: Shipped fonts must be redistributable
        # The single hard licensing blocker: pkg/appfont*.ttf are Monotype Arial today.
        # check-package.py treats that as an XFAIL so CI can land before the swap; here it is
        # a hard stop, because this job is what puts the fonts in front of the public.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct, sys
          from pathlib import Path
          def family(p):
              b = p.read_bytes(); (n,) = struct.unpack(">H", b[4:6])
              for i in range(n):
                  o = 12 + 16*i
                  if b[o:o+4] == b"name":
                      t, = struct.unpack(">I", b[o+8:o+12])
                      c, s = struct.unpack(">HH", b[t+2:t+6])
                      for r in range(c):
                          ro = t + 6 + 12*r
                          pid,_,_,nid,ln,no = struct.unpack(">HHHHHH", b[ro:ro+12])
                          if nid == 1:
                              raw = b[t+s+no:t+s+no+ln]
                              return raw.decode("latin-1" if pid == 1 else "utf-16-be", "replace")
              return "?"
          bad = [str(p) for p in Path("pkg").glob("appfont*.ttf") if family(p) == "Arial"]
          if bad:
              print("::error::refusing to publish Monotype Arial: " + ", ".join(bad))
              print("See docs/distribution.md §5.3 — swap to Arimo (metric-compatible) or Inter.")
              sys.exit(1)
          PY

  build:
    name: build + verify
    runs-on: ubuntu-24.04-arm
    needs: legal-gate
    outputs:
      ipk: ${{ steps.name.outputs.ipk }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pinned nightly Rust
        # Pinned by DATE for releases. `-Z build-std` recompiles std from source and is the most
        # drift-sensitive thing this build does; a release should be reproducible from its tag,
        # which an unpinned `nightly` cannot be. Bump deliberately, alongside a device test run.
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rust-src
          rustup run "$RUST_NIGHTLY" rustc --version
        env:
          RUST_NIGHTLY: ${{ vars.RUST_NIGHTLY || 'nightly' }}

      - id: ndk
        uses: ./.github/actions/webos-ndk

      - name: Build + package
        # No src/config.local.h exists in a clean checkout, so src/app.h's __has_include falls back
        # to the YOUR_PMS_HOST placeholder. That is what makes the CI-built binary the leak-free
        # one by construction rather than by discipline — check-elf.sh asserts it below.
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}
          RUST_NIGHTLY: ${{ vars.RUST_NIGHTLY || 'nightly' }}
          # Drops the `devtools` cargo feature — no on-screen counter in a public build.
          RELEASE: "1"
        run: |
          make -j"$(nproc)"
          make ipk
          # Prove the flag actually took, rather than trusting that it did: the Makefile records
          # the configuration it built, and a stale/ignored RELEASE= is exactly the silent failure
          # the parse-time stamp exists to prevent.
          grep -q -- '--no-default-features' pkg/.build-config \
            || { echo "::error::RELEASE=1 did not take — pkg/.build-config says [$(cat pkg/.build-config)]"; exit 1; }

      - name: ELF + packaging assertions
        run: |
          ./ci/check-elf.sh
          python3 ci/check-package.py
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}

      - name: webosbrew tooling
        run: |
          set -euo pipefail
          TAG=v20260731-e1bb0c0
          for p in fw-symbols ipk-verify gen-manifest; do
            curl -fsSLO "https://github.com/webosbrew/dev-toolbox-cli/releases/download/${TAG}/webosbrew-toolbox-${p}_0.4.0-1_arm64.deb"
          done
          sudo apt-get install -y ./webosbrew-toolbox-*.deb

      - name: Compatibility check (gating)
        run: |
          webosbrew-ipk-verify --details --format markdown \
            --fw-releases '>=4.0, <5.0' pkg/*.ipk | tee -a "$GITHUB_STEP_SUMMARY"

      - id: name
        run: echo "ipk=$(ls pkg/*.ipk)" >> "$GITHUB_OUTPUT"

      - name: Generate the Homebrew Channel manifest
        # -r false: the app needs no root. Device-proven — it runs jailed as uid 6910 under LG's
        # stock jail_native_devmode profile. See docs/distribution.md §3.5.
        run: |
          webosbrew-gen-manifest \
            -p "${{ steps.name.outputs.ipk }}" \
            -i "https://raw.githubusercontent.com/${{ github.repository }}/main/pkg/largeIcon.png" \
            -l "https://github.com/${{ github.repository }}" \
            -r false \
            -o pkg/com.beb.plxnative.manifest.json
          cat pkg/com.beb.plxnative.manifest.json

      - name: The manifest hash must match the artifact
        # The sha256 is enforced ON THE DEVICE at install time and by nothing in CI, so a mismatch
        # here is invisible until it breaks every user's install. Assert it while we still can.
        run: |
          set -euo pipefail
          want=$(python3 -c "import json;print(json.load(open('pkg/com.beb.plxnative.manifest.json'))['ipkHash']['sha256'])")
          have=$(sha256sum "${{ steps.name.outputs.ipk }}" | cut -d' ' -f1)
          [ "$want" = "$have" ] || { echo "::error::manifest sha256 $want != artifact $have"; exit 1; }
          echo "ipk sha256 $have" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            pkg/*.ipk
            pkg/*.manifest.json
            pkg/ipk.sha256

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # NEITHER of these may become true: both exclude the release from `releases/latest`,
          # which is the URL the webosbrew package YAML resolves the manifest through.
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.ipk
            dist/*.manifest.json
            dist/ipk.sha256
      - name: Propagation note
        run: |
          {
            echo "### Published"
            echo "webosbrew's registry has no webhook — it rebuilds on a \`cron: 41 */3 * * *\`"
            echo "schedule and re-fetches every manifest, so expect **~1.5-3 h** before the"
            echo "Homebrew Channel offers this update, plus a ~10 min CDN TTL."
            echo ""
            echo "The Channel compares versions by plain **string equality**, not semver — any"
            echo "change to the version string reads as an update."
          } >> "$GITHUB_STEP_SUMMARY"
