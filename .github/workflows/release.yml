name: Release

# Publishes the .ipk and the webosbrew manifest.json to a GitHub Release, so that
# `releases/latest/download/com.beb.plxnative.manifest.json` is a stable URL the Homebrew Channel
# package YAML can point at forever. The package YAML is submitted ONCE; every later version flows
# through this workflow with no further PR to webosbrew/apps-repo.
#
# TWO TRAPS THIS WORKFLOW GUARDS AGAINST, both of which fail silently rather than loudly:
#  1. gen-manifest writes a BARE FILENAME into ipkUrl, resolved relative to the manifest URL. That
#     step now lives in build-package.yml's "Generate the Homebrew Channel manifest" step (run from
#     the `build` job below, which calls it) — but the constraint is still this workflow's to keep:
#     the .ipk and the manifest must be assets of the SAME release, which is why `publish` uploads
#     them together from one artifact.
#  2. A draft or prerelease is excluded from `releases/latest`, so publishing one leaves users
#     resolving the PREVIOUS release's manifest — an update that silently never arrives.
#     Hence: no draft, no prerelease (enforced below, in `publish`).
#
# Separate from ci.yml because this is the only workflow that needs `contents: write`. Merging them
# would put a write token on every pull-request run.

# HOW TO CUT A RELEASE: Actions -> Release -> Run workflow, pick a bump level, done. The `prepare`
# job below writes the version, commits, tags and pushes; everything after it is the build that was
# already here. Nothing is edited or tagged by hand, which removes the two ways this used to go
# wrong — a tag that did not exist yet, and four version files drifting apart.
#
# NO DOUBLE BUILD: the tag `prepare` pushes uses GITHUB_TOKEN, and GitHub deliberately does not
# start a workflow run from a GITHUB_TOKEN push. So the `push: tags` trigger below stays for a
# hand-pushed tag without re-firing on our own.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        # MINOR is the default because development here is trunk-based: features land on main, so
        # what is cut from main is a minor (or a major, when that is the deliberate call). A patch
        # belongs to an existing minor's own line. The default used to be `patch`, which quietly
        # disagreed with that — and with `rust-modules/build.rs`, which names the next MINOR as the
        # version a working tree is heading for. A dropdown default is the version most releases
        # get, so it should be the one the policy names.
        description: 'Version bump (ignored if "version" is set) — trunk cuts minors'
        type: choice
        options: [minor, major, patch]
        default: minor
      version:
        description: 'Explicit X.Y.Z instead of a bump level'
        required: false
      rebuild_tag:
        description: 'Re-publish an EXISTING tag (skips the version bump entirely)'
        required: false
      line:
        # Empty means main (the trunk cut this workflow has always done). A value must name an
        # EXISTING maintenance branch of the shape `release/vX.Y` — validated below, in the same
        # place the other dispatch inputs are checked — and `prepare` checks that branch out,
        # bumps and tags IT instead of main, so a patch selected here does the thing its name
        # promises rather than publishing trunk under a maintenance-sounding number.
        description: 'Maintenance line to cut from, e.g. release/v0.6 (empty = main)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: bump + tag
    runs-on: ubuntu-latest
    # Skipped for a tag push (the tag already exists) and for an explicit rebuild.
    if: github.event_name == 'workflow_dispatch' && !inputs.rebuild_tag
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      # THE ref this run bumped, tagged and pushed to — main, or a maintenance line named by
      # `inputs.line`. Later jobs (the final audit-push in `publish`) read this rather than
      # re-deriving it, so every job that needs "where did this release live" asks the one place
      # that actually knew at push time.
      line: ${{ steps.bump.outputs.line }}
    steps:
      - name: Validate dispatch inputs
        env:
          LINE: ${{ inputs.line }}
        run: |
          set -euo pipefail
          line="$LINE"
          if [ -n "$line" ] && ! [[ "$line" =~ ^release/v[0-9]+\.[0-9]+$ ]]; then
            echo "::error::line '$line' is not a maintenance branch — expected release/vX.Y (e.g. release/v0.6) or empty for main."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.line || 'main' }}
          # a shallow clone cannot push
          fetch-depth: 0
      - name: Bump the version and tag it
        id: bump
        env:
          LINE: ${{ inputs.line || 'main' }}
        run: |
          set -euo pipefail
          line="$LINE"
          spec='${{ inputs.version || inputs.bump }}'
          python3 ci/bump-version.py "$spec"
          new=$(python3 ci/bump-version.py --current)
          tag="v$new"

          # A RELEASE CUT FROM TRUNK ENDS IN `.0`; a release cut from a MAINTENANCE LINE
          # (`release/vX.Y`, via the `line` dispatch input) is a PATCH of that same X.Y and
          # nothing else — the checkout above already followed `inputs.line`, so `new` was
          # computed against whichever branch's own appinfo.json this run checked out, and the
          # push below writes that same ref. Graded on the RESULTING VERSION rather than on the
          # `bump` input, because the input is not the only route: an explicit `version: 0.5.1`
          # reaches exactly the same code. One rule covers both, and it is the rule the policy
          # actually states.
          #
          # `rust-modules/build.rs` derives the reported developer version from the same policy —
          # trunk names the next MINOR (`0.5.0` published -> `0.6.0-dev`); a checkout carrying a
          # tracked `RELEASE_LINE` marker names the next PATCH instead — so letting a maintenance
          # line's version disagree with its own branch here would also make that working tree's
          # self-report wrong.
          if [ "$line" = main ]; then
            case "$new" in
              *.0) ;;
              *)
                echo "::error::refusing to cut $new from main — trunk releases end in .0."
                echo "::error::development here is trunk-based: main cuts minor and major releases."
                echo "::error::a patch belongs to an existing minor's own line — pass the 'line'"
                echo "::error::dispatch input (e.g. release/v0.6) to cut one from its own branch."
                exit 1
                ;;
            esac
          else
            # `line` is release/vX.Y (validated above). The resulting version must be that same
            # X.Y, with a patch component of at least 1 — a maintenance line publishing `.0` would
            # collide with the trunk release that already owns that number.
            branch_xy="${line#release/v}"
            case "$new" in
              "$branch_xy".[1-9]|"$branch_xy".[1-9][0-9]*) ;;
              *)
                echo "::error::refusing to cut $new from $line — a maintenance line publishes"
                echo "::error::X.Y.N with N>=1 and major.minor matching its own branch ($branch_xy)."
                exit 1
                ;;
            esac
          fi

          # THE question that decides whether this version may ship, asked where the answer lives.
          # An explicit `version:` equal to what appinfo.json already says is legitimate — it is
          # exactly the first release, "ship what is already written" — so the script no longer
          # refuses it. What must never repeat is a TAG.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. To re-publish it use the rebuild_tag input; to ship something new pick a bump level."
            exit 1
          fi

          # Prove the four files agree BEFORE committing — this is the assertion that makes the
          # whole scheme safe, and it is cheaper to fail here than after a tag exists.
          python3 ci/check-package.py

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pkg/appinfo.json ipkroot/ctl/control rust-modules/Cargo.toml rust-modules/Cargo.lock
          # No commit when the version did not move (the first release, or a re-run after one
          # failed downstream): the tag then simply points at the line as it stands.
          if git diff --cached --quiet; then
            echo "version already $new — tagging $line as it stands"
          else
            git commit -m "release: $new"
          fi
          git tag -a "$tag" -m "$new"
          git push origin "$line" "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "line=$line" >> "$GITHUB_OUTPUT"
          echo "released **$tag** from \`$line\`" >> "$GITHUB_STEP_SUMMARY"

  guard:
    name: tag / version agreement
    runs-on: ubuntu-latest
    needs: prepare
    # `prepare` is skipped on a tag push and on a rebuild, and a skipped dependency skips its
    # dependents — so accept any non-failed outcome and take the ref from whichever path ran.
    if: always() && needs.prepare.result != 'failure' && needs.prepare.result != 'cancelled'
    outputs:
      # THE resolved tag for the whole run. Every later job reads this rather than repeating the
      # fallback chain, because `needs` exposes only DIRECT dependencies and none of them can see
      # `prepare`. Three ways in: a fresh bump, an explicit rebuild, or a hand-pushed tag.
      tag: ${{ steps.ref.outputs.tag }}
      # THE resolved line (main, or release/vX.Y) this release was cut from — for the same three
      # ways in. `prepare` already knew it (it followed `inputs.line`) and published it; for the
      # other two shapes (a hand-pushed tag, or `rebuild_tag`) there is no dispatch input to read,
      # so it is DERIVED from the version itself: `.0` only ever comes from main, anything else
      # names the maintenance line that version's major.minor belongs to.
      line: ${{ steps.ref.outputs.line }}
    steps:
      - name: Resolve the tag
        id: ref
        run: |
          set -euo pipefail
          tag='${{ needs.prepare.outputs.tag || inputs.rebuild_tag || github.ref_name }}'
          [ -n "$tag" ] || { echo "::error::no tag resolved"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          line='${{ needs.prepare.outputs.line }}'
          if [ -z "$line" ]; then
            version="${tag#v}"
            case "$version" in
              *.0) line=main ;;
              *)
                major="${version%%.*}"
                rest="${version#*.}"
                minor="${rest%%.*}"
                line="release/v$major.$minor"
                ;;
            esac
          fi
          echo "line=$line" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.ref.outputs.tag }}
      - name: The tag must match pkg/appinfo.json
        # appinfo.json is the single source of the version (the Makefile derives IPK_VERSION from
        # it). A tag that disagrees would publish an .ipk whose filename, control file and manifest
        # all say something else — and webosbrew's registry reads the version out of the archive.
        run: |
          set -euo pipefail
          tag='${{ steps.ref.outputs.tag }}'
          want="${tag#v}"
          have=$(python3 -c "import json;print(json.load(open('pkg/appinfo.json'))['version'])")
          [ "$want" = "$have" ] || {
            echo "::error::tag $tag implies version $want but pkg/appinfo.json says $have"; exit 1; }
          echo "version $have" >> "$GITHUB_STEP_SUMMARY"
      - name: Packaging assertions
        run: python3 ci/check-package.py

  legal-gate:
    name: redistributable assets
    runs-on: ubuntu-latest
    needs: [guard]
    # `guard` runs under `always()` because `prepare` is skipped on a tag push — and GitHub
    # propagates that skip DOWN the graph, so a job with no `if:` inherits the default `success()`
    # and skips too, even though `guard` itself succeeded. That is how a `git push --tags` came to
    # run only "tag / version agreement" and silently publish nothing: v0.2.1 got a tag with no
    # release, was then published by hand, and skipped every gate below as a result.
    #
    # Keying on the RESULT rather than relying on the default restores what this workflow's own
    # comments say it supports: a fresh bump, an explicit rebuild, or a hand-pushed tag.
    if: always() && needs.guard.result == 'success'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.guard.outputs.tag }}
      - name: LICENSE and third-party notices must exist
        # docs/distribution.md blockers #1 and #2. A release is the moment these stop being
        # to-do items and start being legal exposure: LGPL 2.1 §6 requires the notice and the
        # licence text to travel WITH the binary, and webosbrew `pool: main` requires open source.
        run: |
          set -euo pipefail
          missing=()
          [ -f LICENSE ] || missing+=("LICENSE")
          [ -f THIRD-PARTY-NOTICES.md ] || missing+=("THIRD-PARTY-NOTICES.md")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::cannot publish without: ${missing[*]} (see docs/distribution.md §5)"
            exit 1
          fi
      - name: Shipped fonts must be redistributable
        # Was the single hard licensing blocker; cleared 2026-08-01 when Inter (OFL 1.1) replaced
        # Monotype Arial, and `ci/check-package.py` now gates the family on every run rather than
        # treating it as an XFAIL. This step stays because the failure mode it guards is a RELAPSE:
        # the files are named appfont*.ttf, so nothing about a stale local copy being committed back
        # would look wrong in a diff. This job is what puts them in front of the public.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct, sys
          from pathlib import Path
          def family(p):
              b = p.read_bytes(); (n,) = struct.unpack(">H", b[4:6])
              for i in range(n):
                  o = 12 + 16*i
                  if b[o:o+4] == b"name":
                      t, = struct.unpack(">I", b[o+8:o+12])
                      c, s = struct.unpack(">HH", b[t+2:t+6])
                      for r in range(c):
                          ro = t + 6 + 12*r
                          pid,_,_,nid,ln,no = struct.unpack(">HHHHHH", b[ro:ro+12])
                          if nid == 1:
                              raw = b[t+s+no:t+s+no+ln]
                              return raw.decode("latin-1" if pid == 1 else "utf-16-be", "replace")
              return "?"
          bad = [str(p) for p in Path("pkg").glob("appfont*.ttf") if family(p) == "Arial"]
          if bad:
              print("::error::refusing to publish Monotype Arial: " + ", ".join(bad))
              print("See docs/distribution.md §5.3 — swap to Arimo (metric-compatible) or Inter.")
              sys.exit(1)
          PY

  build:
    name: build + verify
    needs: [legal-gate, guard]
    # See legal-gate: explicit, or the tag-push path skips this silently.
    if: always() && needs.guard.result == 'success' && needs['legal-gate'].result == 'success'
    # The ARM build+verify pipeline itself lives in build-package.yml — shared with nightly.yml so
    # the two stop being hand-kept copies of one job. This job only carries the release-specific
    # decisions: which ref, which flavour, which telemetry pair, which optional steps.
    uses: ./.github/workflows/build-package.yml
    with:
      ref: ${{ needs.guard.outputs.tag }}
      # WHICH INSTALL. `FLAVOR ?= debug` in the Makefile — deliberately, so a developer's
      # muscle-memory `make deploy` cannot overwrite the app users watch with — and CI is the one
      # place that default is wrong. Without this the release job packages `com.beb.plxnative.debug`,
      # `webosbrew-gen-manifest` writes that id INTO the manifest the Homebrew Channel resolves, and
      # the sha256 cross-check still passes because it compares the wrong artifact against its own
      # manifest. It would finally die four jobs later on a missing `dist/ipk.sha256` (a flavoured
      # package deliberately does not write that released asset name) — a loud failure naming a
      # checksum rather than a flavour.
      flavor: stable
      # The PRODUCTION telemetry endpoints, compiled in from `vars` rather than `secrets`
      # DELIBERATELY — see build-package.yml's own comment on the point. Only SENTRY_AUTH_TOKEN,
      # passed as a secret below, can read or delete the project.
      telemetry: production
      artifact: release-assets
      homebrew-manifest: true
      source-asset: true
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  publish:
    name: publish release
    runs-on: ubuntu-latest
    # `legal-gate` is listed purely so its verdict can be READ into the release audit's gate table
    # — `needs` exposes only DIRECT dependencies, and `build` already refuses to run without it.
    needs: [build, guard, legal-gate]
    # See legal-gate: explicit, or the tag-push path skips this silently.
    if: always() && needs.guard.result == 'success' && needs.build.result == 'success' 
    permissions:
      contents: write
    steps:
      # Checkout BEFORE download-artifact, not after: `actions/checkout` cleans the workspace by
      # default and would delete `dist/`. This job had no checkout at all until now, which made its
      # last step — `ci/verify-published.sh` — a file that does not exist; it has never run, because
      # v0.2.1 was hand-published and nothing has been published through this job since.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.guard.outputs.tag }}
          # A shallow clone cannot push, and this job now pushes: the completed release audit goes
          # to whichever line this release was cut from (main, or a release/vX.Y maintenance
          # branch) in its last step. Same reason `prepare` fetches everything.
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      # The BODY is the committed note, not GitHub's auto-generated PR list. `check-package.py`
      # already refuses to build without `docs/release-notes/vX.Y.Z.md`, and its comment has said
      # "CI publishes the release body from this file" since it was written — this is the step that
      # makes that true. Until now the prose was pasted onto an already-published release by hand,
      # which meant `releases/latest` briefly carried a one-line body and a `rebuild_tag:` re-publish
      # silently dropped the note entirely.
      #
      # ONE value in it cannot exist in the committed file — the artifact's sha256 — so the note
      # carries a sentinel and it is filled HERE, from the artifact itself. That is the point: a
      # hash nobody types cannot be the wrong hash, which is the class of defect the release-note
      # standard exists to end. Everything else in the body is the reviewed text, byte for byte.
      #
      # The other four sentinels (`__COMMIT__`, `__RUN_URL__`, `__IPK_SIZE__`, `__INSTALLED_SIZE__`)
      # are still substituted for a note that uses them, so every published note stays reproducible
      # from its committed file. New notes should not need them: provenance and sizes are the
      # release AUDIT's job now, generated from the artifact rather than pasted through a sentinel.
      - name: Render the release body from the committed note
        id: render
        run: |
          set -euo pipefail
          tag='${{ needs.guard.outputs.tag }}'
          note="docs/release-notes/$tag.md"
          [ -f "$note" ] || { echo "::error::$note is missing — the release would publish with no notes"; exit 1; }
          ipk=$(ls dist/*.ipk)
          sha=$(sha256sum "$ipk" | cut -d' ' -f1)
          commit=$(git rev-parse HEAD)
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # The two SIZES are sentinels for the same reason the hash is: they are measurable by the
          # reader, they move with every build (the bundled FFmpeg's size depends on the build), and
          # the standard's §1.9 defect was exactly a size somebody typed. Read from the manifest,
          # which is the artifact the note tells the reader they came from.
          size=$(python3 -c "import json;print(json.load(open('dist/com.beb.plxnative.manifest.json'))['ipkSize'])")
          inst=$(python3 -c "import json;print(json.load(open('dist/com.beb.plxnative.manifest.json'))['installedSize'])")
          # ONE sentinel is mandatory: the artifact's sha256, which is the only tamper check a
          # user of an unsigned binary has. A note that lost it would publish a body with no hash
          # at all, and `verify-published.sh` would only catch that once the release was public.
          # The other four are substituted when a note uses them and are not required — since
          # 2026-08-29 the sizes, the commit and the run URL live in the release AUDIT, which is
          # generated from the artifact rather than written with sentinels.
          grep -q __IPK_SHA256__ "$note" \
            || { echo "::error::$note does not carry the __IPK_SHA256__ sentinel"; exit 1; }
          sed -e "s|__IPK_SHA256__|$sha|g" -e "s|__COMMIT__|$commit|g" -e "s|__RUN_URL__|$run|g" \
              -e "s|__IPK_SIZE__|$size|g" -e "s|__INSTALLED_SIZE__|$inst|g" \
              "$note" > dist/body-full.md
          # GitHub already renders a release's own `name` as its own big header next to the tag —
          # see the release page itself, not this file. The note's `# vX.Y.Z — <theme>` line is
          # therefore the RELEASE'S NAME, not also the body's first line: publishing it as both
          # put "v0.6.0" on the page twice, once as GitHub's own title and once as the body's H1
          # repeating it. The H1 stays in the committed note (docs/release-notes/*.md keeps reading
          # naturally as a standalone file, and this is where a human writing the next one edits
          # it) and is extracted here, not duplicated into what gets posted as the body.
          title_line="$(head -1 dist/body-full.md)"
          # Anchored to THIS tag specifically, not just "starts with a #": a note copied from the
          # template or from the previous release with its version line left unedited would
          # otherwise publish under a stale display name — cosmetic before this change (one wrong
          # string buried in the body), now the release's own canonical title.
          echo "$title_line" | grep -qE "^# ${tag} — .+" \
            || { echo "::error::$note's first line ('$title_line') must read exactly '# $tag — <theme>' — it becomes the release title"; exit 1; }
          title="$(echo "$title_line" | sed -e 's/^# *//')"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          tail -n +2 dist/body-full.md | sed '/./,$!d' > dist/body.md
          echo "title: $title" >> "$GITHUB_STEP_SUMMARY"
          echo "body: $(wc -l < dist/body.md) lines, sha $sha" >> "$GITHUB_STEP_SUMMARY"
      # THE AUDIT'S EVIDENCE HALF, derived from the artifact that is about to be published.
      #
      # `docs/release-audits/vX.Y.Z.md` is committed with its AUTHORED half — device-test evidence,
      # third-party reports, what this release deliberately did not do — which no command can
      # produce. Everything measurable is read out of the .ipk here: hashes and their agreement,
      # the ar layout, the payload inventory with per-file hashes, DT_NEEDED, the dev-trigger
      # witnesses, FFmpeg's recorded configure invocation, the build-machine-path scan.
      #
      # It runs BEFORE the release is created, and a failure here stops the publish: an audit that
      # cannot be produced from the artifact means something about the artifact is not what the
      # release is about to claim.
      - name: Generate the release audit from the built artifact
        run: |
          set -euo pipefail
          tag='${{ needs.guard.outputs.tag }}'
          # Job-level verdicts first, then the in-build gate rows the build job appended as each
          # gate passed. `bash -e` means a failed gate never reached its own row.
          {
            echo "| gate | verdict |"
            echo "|---|---|"
            echo "| \`tag / version agreement\` | ${{ needs.guard.result }} |"
            echo "| \`redistributable assets\` (LICENSE, notices, font family) | ${{ needs['legal-gate'].result }} |"
            echo "| \`build + verify\` | ${{ needs.build.result }} |"
            cat dist/gates.md 2>/dev/null || true
          } > dist/all-gates.md
          python3 ci/gen-release-audit.py \
            --tag "$tag" --dist dist \
            --commit "$(git rev-parse HEAD)" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --uploader 'github-actions[bot]' \
            --build-config "$(cat dist/build-config.txt 2>/dev/null || echo unknown)" \
            --gates dist/all-gates.md \
            --fwcompat dist/ipk-verify.md \
            --out dist/audit-generated.md
          echo "audit evidence: $(wc -l < dist/audit-generated.md) lines" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release
        id: publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          # The note's own `# vX.Y.Z — theme` line, not the bare tag — GitHub already shows this
          # as the release's own header, so leaving `name` unset (which defaults it to the tag)
          # made the body's H1 repeat it right underneath. Extracted in the render step above.
          name: ${{ steps.render.outputs.title }}
          # the committed note (its H1 stripped — see the render step), with GitHub's
          # compare-link tail appended after it
          body_path: dist/body.md
          append_body: true
          # NEITHER of these may become true: both exclude the release from `releases/latest`,
          # which is the URL the webosbrew package YAML resolves the manifest through.
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.ipk
            dist/*.manifest.json
            dist/ipk.sha256
            dist/ffmpeg-*.tar.xz
            dist/build-ffmpeg.sh
            dist/plxnative-source-*.tar.gz*
            dist/source-rebuild.json
      # Re-derive every published claim FROM the published artifacts. Everything assertable
      # before publishing is in ci/check-package.py; this is the half that needs a live release —
      # the hash agreeing in four places, `shasum -c` working where a user actually stands, the
      # uploader being CI rather than a person, and no payload file carrying a build machine's
      # directory layout. All four of v0.2.1's defects are in scope here; two of them are only
      # visible once the assets exist.
      - name: Verify what the public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # Captured as well as printed: this verdict is the audit's last section, and it is the
          # one thing in the file that needs a LIVE release to establish. The colour codes go —
          # they are for a terminal, not for a markdown code block.
          ci/verify-published.sh "${{ needs.guard.outputs.tag || github.ref_name }}" 2>&1 \
            | tee /tmp/published.txt
          sed -i 's/\x1b\[[0-9;]*m//g' /tmp/published.txt

      # The completed audit goes to the LINE the release was cut from — main for an ordinary
      # trunk release, or the same `release/vX.Y` branch `prepare` bumped and tagged for a
      # maintenance-line patch (`needs.guard.outputs.line`, threaded through from `prepare` when
      # it ran, or derived from the version for the tag-push/rebuild_tag shapes where there was no
      # dispatch input to read) — never always `main`, since the audit describes an artifact that
      # did not exist when the tag was written, and the last section describes a release that did
      # not exist ten seconds ago. `[skip ci]` because this is a documentation commit and ci.yml
      # runs a full cross-build on every push.
      - name: Commit the completed audit to its line
        if: always() && steps.publish.conclusion == 'success'
        run: |
          set -euo pipefail
          tag='${{ needs.guard.outputs.tag }}'
          line='${{ needs.guard.outputs.line }}'
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin "$line"
          git checkout -B "$line" "origin/$line"
          if [ ! -f "docs/release-audits/$tag.md" ]; then
            echo "::notice::no docs/release-audits/$tag.md on $line — pre-standard release, nothing to complete"
            exit 0
          fi
          python3 ci/gen-release-audit.py \
            --tag "$tag" --dist dist \
            --commit "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --uploader 'github-actions[bot]' \
            --build-config "$(cat dist/build-config.txt 2>/dev/null || echo unknown)" \
            --gates dist/all-gates.md \
            --fwcompat dist/ipk-verify.md \
            --published /tmp/published.txt \
            --write
          python3 ci/check-package.py --lint-audit "docs/release-audits/$tag.md"
          git add "docs/release-audits/$tag.md"
          if git diff --cached --quiet; then
            echo "audit already complete and unchanged"
          else
            git commit -m "release: audit for $tag [skip ci]"
            git push origin "$line"
          fi

      - name: Propagation note
        run: |
          {
            echo "### Published"
            echo "webosbrew's registry has no webhook — it rebuilds on a \`cron: 41 */3 * * *\`"
            echo "schedule and re-fetches every manifest, so expect **~1.5-3 h** before the"
            echo "Homebrew Channel offers this update, plus a ~10 min CDN TTL."
            echo ""
            echo "The Channel compares versions by plain **string equality**, not semver — any"
            echo "change to the version string reads as an update."
          } >> "$GITHUB_STEP_SUMMARY"
