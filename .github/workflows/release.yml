name: Release

# Publishes the .ipk and the webosbrew manifest.json to a GitHub Release, so that
# `releases/latest/download/com.beb.plxnative.manifest.json` is a stable URL the Homebrew Channel
# package YAML can point at forever. The package YAML is submitted ONCE; every later version flows
# through this workflow with no further PR to webosbrew/apps-repo.
#
# TWO TRAPS ENCODED BELOW, both of which fail silently rather than loudly:
#  1. gen-manifest writes a BARE FILENAME into ipkUrl, resolved relative to the manifest URL. The
#     .ipk and the manifest must therefore be assets of the SAME release.
#  2. A draft or prerelease is excluded from `releases/latest`, so publishing one leaves users
#     resolving the PREVIOUS release's manifest — an update that silently never arrives.
#     Hence: no draft, no prerelease.
#
# Separate from ci.yml because this is the only workflow that needs `contents: write`. Merging them
# would put a write token on every pull-request run.

# HOW TO CUT A RELEASE: Actions -> Release -> Run workflow, pick a bump level, done. The `prepare`
# job below writes the version, commits, tags and pushes; everything after it is the build that was
# already here. Nothing is edited or tagged by hand, which removes the two ways this used to go
# wrong — a tag that did not exist yet, and four version files drifting apart.
#
# NO DOUBLE BUILD: the tag `prepare` pushes uses GITHUB_TOKEN, and GitHub deliberately does not
# start a workflow run from a GITHUB_TOKEN push. So the `push: tags` trigger below stays for a
# hand-pushed tag without re-firing on our own.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        # MINOR is the default because development here is trunk-based: features land on main, so
        # what is cut from main is a minor (or a major, when that is the deliberate call). A patch
        # belongs to an existing minor's own line. The default used to be `patch`, which quietly
        # disagreed with that — and with `rust-modules/build.rs`, which names the next MINOR as the
        # version a working tree is heading for. A dropdown default is the version most releases
        # get, so it should be the one the policy names.
        description: 'Version bump (ignored if "version" is set) — trunk cuts minors'
        type: choice
        options: [minor, major, patch]
        default: minor
      version:
        description: 'Explicit X.Y.Z instead of a bump level'
        required: false
      rebuild_tag:
        description: 'Re-publish an EXISTING tag (skips the version bump entirely)'
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: bump + tag
    runs-on: ubuntu-latest
    # Skipped for a tag push (the tag already exists) and for an explicit rebuild.
    if: github.event_name == 'workflow_dispatch' && !inputs.rebuild_tag
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          # a shallow clone cannot push
          fetch-depth: 0
      - name: Bump the version and tag it
        id: bump
        run: |
          set -euo pipefail
          spec='${{ inputs.version || inputs.bump }}'
          python3 ci/bump-version.py "$spec"
          new=$(python3 ci/bump-version.py --current)
          tag="v$new"

          # A RELEASE CUT FROM TRUNK ENDS IN `.0`, and this job only ever cuts from trunk — the
          # checkout above is pinned to `ref: main` and the push below writes `main`. Development
          # here is trunk-based: main cuts minors and majors, and a PATCH belongs to an existing
          # minor's own maintenance line, which this workflow has no way to check out, bump, tag or
          # push. So a patch selected here does not do the thing its name promises; it publishes
          # trunk under a number that says "a fix on top of what you already have".
          #
          # Graded on the RESULTING VERSION rather than on the `bump` input, because the input is
          # not the only route: an explicit `version: 0.5.1` reaches exactly the same code. One
          # rule covers both, and it is the rule the policy actually states.
          #
          # `rust-modules/build.rs` derives the reported developer version from the same policy
          # (`0.5.0` published -> `0.6.0-dev`), so letting a patch through here would also make
          # every working tree's self-report wrong until the next minor.
          case "$new" in
            *.0) ;;
            *)
              echo "::error::refusing to cut $new from main — trunk releases end in .0."
              echo "::error::development here is trunk-based: main cuts minor and major releases."
              echo "::error::a patch belongs to an existing minor's own line, and this workflow"
              echo "::error::only ever checks out, tags and pushes main. Cutting one needs"
              echo "::error::maintenance-line support added here first."
              exit 1
              ;;
          esac

          # THE question that decides whether this version may ship, asked where the answer lives.
          # An explicit `version:` equal to what appinfo.json already says is legitimate — it is
          # exactly the first release, "ship what is already written" — so the script no longer
          # refuses it. What must never repeat is a TAG.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. To re-publish it use the rebuild_tag input; to ship something new pick a bump level."
            exit 1
          fi

          # Prove the four files agree BEFORE committing — this is the assertion that makes the
          # whole scheme safe, and it is cheaper to fail here than after a tag exists.
          python3 ci/check-package.py

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pkg/appinfo.json ipkroot/ctl/control rust-modules/Cargo.toml rust-modules/Cargo.lock
          # No commit when the version did not move (the first release, or a re-run after one
          # failed downstream): the tag then simply points at main as it stands.
          if git diff --cached --quiet; then
            echo "version already $new — tagging main as it stands"
          else
            git commit -m "release: $new"
          fi
          git tag -a "$tag" -m "$new"
          git push origin main "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "released **$tag**" >> "$GITHUB_STEP_SUMMARY"

  guard:
    name: tag / version agreement
    runs-on: ubuntu-latest
    needs: prepare
    # `prepare` is skipped on a tag push and on a rebuild, and a skipped dependency skips its
    # dependents — so accept any non-failed outcome and take the ref from whichever path ran.
    if: always() && needs.prepare.result != 'failure' && needs.prepare.result != 'cancelled'
    outputs:
      # THE resolved tag for the whole run. Every later job reads this rather than repeating the
      # fallback chain, because `needs` exposes only DIRECT dependencies and none of them can see
      # `prepare`. Three ways in: a fresh bump, an explicit rebuild, or a hand-pushed tag.
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: ref
        run: |
          tag='${{ needs.prepare.outputs.tag || inputs.rebuild_tag || github.ref_name }}'
          [ -n "$tag" ] || { echo "::error::no tag resolved"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.ref.outputs.tag }}
      - name: The tag must match pkg/appinfo.json
        # appinfo.json is the single source of the version (the Makefile derives IPK_VERSION from
        # it). A tag that disagrees would publish an .ipk whose filename, control file and manifest
        # all say something else — and webosbrew's registry reads the version out of the archive.
        run: |
          set -euo pipefail
          tag='${{ steps.ref.outputs.tag }}'
          want="${tag#v}"
          have=$(python3 -c "import json;print(json.load(open('pkg/appinfo.json'))['version'])")
          [ "$want" = "$have" ] || {
            echo "::error::tag $tag implies version $want but pkg/appinfo.json says $have"; exit 1; }
          echo "version $have" >> "$GITHUB_STEP_SUMMARY"
      - name: Packaging assertions
        run: python3 ci/check-package.py

  legal-gate:
    name: redistributable assets
    runs-on: ubuntu-latest
    needs: [guard]
    # `guard` runs under `always()` because `prepare` is skipped on a tag push — and GitHub
    # propagates that skip DOWN the graph, so a job with no `if:` inherits the default `success()`
    # and skips too, even though `guard` itself succeeded. That is how a `git push --tags` came to
    # run only "tag / version agreement" and silently publish nothing: v0.2.1 got a tag with no
    # release, was then published by hand, and skipped every gate below as a result.
    #
    # Keying on the RESULT rather than relying on the default restores what this workflow's own
    # comments say it supports: a fresh bump, an explicit rebuild, or a hand-pushed tag.
    if: always() && needs.guard.result == 'success'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.guard.outputs.tag }}
      - name: LICENSE and third-party notices must exist
        # docs/distribution.md blockers #1 and #2. A release is the moment these stop being
        # to-do items and start being legal exposure: LGPL 2.1 §6 requires the notice and the
        # licence text to travel WITH the binary, and webosbrew `pool: main` requires open source.
        run: |
          set -euo pipefail
          missing=()
          [ -f LICENSE ] || missing+=("LICENSE")
          [ -f THIRD-PARTY-NOTICES.md ] || missing+=("THIRD-PARTY-NOTICES.md")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::cannot publish without: ${missing[*]} (see docs/distribution.md §5)"
            exit 1
          fi
      - name: Shipped fonts must be redistributable
        # Was the single hard licensing blocker; cleared 2026-08-01 when Inter (OFL 1.1) replaced
        # Monotype Arial, and `ci/check-package.py` now gates the family on every run rather than
        # treating it as an XFAIL. This step stays because the failure mode it guards is a RELAPSE:
        # the files are named appfont*.ttf, so nothing about a stale local copy being committed back
        # would look wrong in a diff. This job is what puts them in front of the public.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct, sys
          from pathlib import Path
          def family(p):
              b = p.read_bytes(); (n,) = struct.unpack(">H", b[4:6])
              for i in range(n):
                  o = 12 + 16*i
                  if b[o:o+4] == b"name":
                      t, = struct.unpack(">I", b[o+8:o+12])
                      c, s = struct.unpack(">HH", b[t+2:t+6])
                      for r in range(c):
                          ro = t + 6 + 12*r
                          pid,_,_,nid,ln,no = struct.unpack(">HHHHHH", b[ro:ro+12])
                          if nid == 1:
                              raw = b[t+s+no:t+s+no+ln]
                              return raw.decode("latin-1" if pid == 1 else "utf-16-be", "replace")
              return "?"
          bad = [str(p) for p in Path("pkg").glob("appfont*.ttf") if family(p) == "Arial"]
          if bad:
              print("::error::refusing to publish Monotype Arial: " + ", ".join(bad))
              print("See docs/distribution.md §5.3 — swap to Arimo (metric-compatible) or Inter.")
              sys.exit(1)
          PY

  build:
    name: build + verify
    runs-on: ubuntu-24.04-arm
    needs: [legal-gate, guard]
    # See legal-gate: explicit, or the tag-push path skips this silently.
    if: always() && needs.guard.result == 'success' && needs['legal-gate'].result == 'success'
    outputs:
      ipk: ${{ steps.name.outputs.ipk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.guard.outputs.tag }}

      - name: Install pinned nightly Rust
        # Pinned by DATE for releases. `-Z build-std` recompiles std from source and is the most
        # drift-sensitive thing this build does; a release should be reproducible from its tag,
        # which an unpinned `nightly` cannot be. Bump deliberately, alongside a device test run.
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rust-src
          rustup run "$RUST_NIGHTLY" rustc --version
        env:
          RUST_NIGHTLY: ${{ vars.RUST_NIGHTLY || 'nightly-2026-07-02' }}

      - id: ndk
        uses: ./.github/actions/webos-ndk

      - name: Build + package
        # No src/config.local.h exists in a clean checkout, so src/app.h's __has_include falls back
        # to the YOUR_PMS_HOST placeholder. That is what makes the CI-built binary the leak-free
        # one by construction rather than by discipline — check-elf.sh asserts it below.
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}
          RUST_NIGHTLY: ${{ vars.RUST_NIGHTLY || 'nightly-2026-07-02' }}
          # Drops the `devtools` cargo feature — no on-screen counter in a public build.
          RELEASE: "1"
          # WHICH INSTALL. `FLAVOR ?= debug` in the Makefile — deliberately, so a developer's
          # muscle-memory `make deploy` cannot overwrite the app users watch with — and CI is the
          # one place that default is wrong. Without this the release job packages
          # `com.beb.plxnative.debug`, `webosbrew-gen-manifest` writes that id INTO the manifest the
          # Homebrew Channel resolves, and the sha256 cross-check below still passes because it
          # compares the wrong artifact against its own manifest. It would finally die four jobs
          # later on a missing `dist/ipk.sha256` (a flavoured package deliberately does not write
          # that released asset name) — a loud failure naming a checksum rather than a flavour.
          FLAVOR: stable
          # DWARF, so the release can be symbolicated later. It must be set on EVERY invocation in
          # this step and it must be the SAME invocation that cuts the .ipk: a debuginfo build and a
          # plain one produce DIFFERENT BUILD IDs from identical sources (measured — see the
          # Makefile's RUST_CFG comment), and the build id is the only thing that matches a
          # separated .debug back to the binary a stranger's television crashed in. Two steps would
          # hand us a .debug matching nothing that ever shipped.
          SYMBOLS: "1"
          # The PRODUCTION telemetry endpoints, and `vars` rather than `secrets` DELIBERATELY.
          # They are write-only client identifiers: they permit sending TO a project and grant no
          # read of anything in it, and `strings` finds both in every shipped binary, so treating
          # them as secret is theatre. It would also be actively harmful here — GitHub masks a
          # secret's value everywhere it appears in a log, and `ci/gen-release-audit.py` reads the
          # endpoints back OUT of the packaged binary and prints them, which is the row that lets a
          # stranger confirm where their television reports to. Masked, that row reads `***`.
          # Only SENTRY_AUTH_TOKEN, in the upload step below, is a real secret: it can read and
          # delete the project.
          #
          # These live ONLY here. A developer's machine gets the `_DEV` pair instead
          # (`make telemetry-local`), and `telemetry::sender::ENVIRONMENT` is derived from WHICH
          # pair a build was handed — so this block is also the whole reason a shipped binary
          # reports as `production`, and the reason a locally built one cannot.
          PLX_SENTRY_DSN: ${{ vars.PLX_SENTRY_DSN }}
          PLX_POSTHOG_KEY: ${{ vars.PLX_POSTHOG_KEY }}
          # Declared EMPTY rather than merely absent. The step below refuses a release that carries
          # development credentials, and an assertion on a variable this file never names reads as
          # dead code to the next person editing it — which is how a guard gets deleted. It also
          # makes the check hold if a `set -u` is ever added to that script.
          PLX_SENTRY_DSN_DEV: ""
          PLX_POSTHOG_KEY_DEV: ""
        run: |
          make -j"$(nproc)"
          make ipk symbols
          # Prove the flags actually took, rather than trusting that they did: the Makefile records
          # the configuration it built, and a stale/ignored RELEASE= is exactly the silent failure
          # the parse-time stamp exists to prevent.
          grep -q -- '--no-default-features' pkg/.build-config \
            || { echo "::error::RELEASE=1 did not take — pkg/.build-config says [$(cat pkg/.build-config)]"; exit 1; }
          # Same argument for SYMBOLS, and it needs its own check because the failure is silent in
          # the other direction: `make symbols` REFUSES without the flag, but a stamp that lost it
          # between the two invocations would relink and hand the upload a .debug for a binary
          # nobody shipped.
          grep -q '+symbols' pkg/.build-config \
            || { echo "::error::SYMBOLS=1 did not take — pkg/.build-config says [$(cat pkg/.build-config)]"; exit 1; }
          test -s pkg/plxnative.debug \
            || { echo "::error::pkg/plxnative.debug is missing or empty"; exit 1; }
          # The build id is what pairs the two. Assert it here rather than trusting the upload:
          # `sentry-cli` will happily accept a .debug whose id matches nothing that shipped.
          idof() { readelf -n "$1" | awk '/Build ID/{print $3}'; }
          [ "$(idof pkg/plxnative)" = "$(idof pkg/plxnative.debug)" ] \
            || { echo "::error::build id mismatch between the shipped binary and its .debug"; exit 1; }
          echo "build-id $(idof pkg/plxnative)"
          # **The telemetry configuration FAILS CLOSED here, and only here.** For a local build,
          # "no endpoint -> telemetry compiled out" is the right default and the safe one. For an
          # OFFICIAL RELEASE it is a configuration failure: a binary that silently cannot report is
          # indistinguishable from a healthy one until months later, when the crash that should
          # have arrived never did. This step used to warn and continue.
          [ -n "$PLX_SENTRY_DSN" ] \
            || { echo "::error::PLX_SENTRY_DSN is unset — refusing to ship a release that cannot report a crash. Set it as a repository VARIABLE (not a secret)."; exit 1; }
          [ -n "$PLX_POSTHOG_KEY" ] \
            || { echo "::error::PLX_POSTHOG_KEY is unset — refusing to ship a release that cannot report usage. Set it as a repository VARIABLE (not a secret)."; exit 1; }
          # The DEVELOPMENT pair must be ABSENT. Supplying both is already a compile error —
          # `telemetry::sender`'s const block refuses it, because the environment a build reports
          # is derived from which pair it was given and two pairs have no answer — so this is the
          # same assertion, made earlier and in words that name the workflow rather than the crate.
          [ -z "$PLX_SENTRY_DSN_DEV$PLX_POSTHOG_KEY_DEV" ] \
            || { echo "::error::development telemetry credentials are present in a release build"; exit 1; }
          grep -q 'tel:' pkg/.build-config \
            || { echo "::error::telemetry endpoints were set but did not reach the build"; exit 1; }
          # And that the binary carries the PRODUCTION endpoint specifically, rather than merely
          # "some endpoint". `option_env!` yields a `&'static str`, so a configured DSN is in
          # `.rodata` verbatim; finding it there is what proves `telemetry::sender`'s const block
          # took the production branch, and so that `ENVIRONMENT` is `production` and every event
          # from this release lands in the right project. Substring, not whole-line: Rust string
          # literals are not NUL-terminated and adjacent ones merge into one `strings` record.
          strings pkg/plxnative | grep -qF "$PLX_SENTRY_DSN" \
            || { echo "::error::the packaged binary does not carry the production Sentry DSN"; exit 1; }
          strings pkg/plxnative | grep -qF "$PLX_POSTHOG_KEY" \
            || { echo "::error::the packaged binary does not carry the production PostHog key"; exit 1; }
          # Fingerprints, not values. These are publishable, but they are also usable to write junk
          # into the project and burn a free-tier quota, and a workflow log is a far more casually
          # read surface than the audit file — which does record them in full, deliberately, being
          # the document that makes the package reproducible by somebody other than the maintainer.
          echo "telemetry fingerprints (sha256, first 16):"
          printf '  sentry  %s\n' "$(printf %s "$PLX_SENTRY_DSN"  | sha256sum | cut -c1-16)"
          printf '  posthog %s\n' "$(printf %s "$PLX_POSTHOG_KEY" | sha256sum | cut -c1-16)"
          # ...and carry the stamp to the publish job under a NON-HIDDEN name: upload-artifact
          # silently drops dotfiles, so `pkg/.build-config` would never arrive and the audit would
          # lose the row recording which configuration was built.
          cp pkg/.build-config pkg/build-config.txt
          # ...and the same for the flavour, on the artifact's own name. `check-package.py` cannot
          # catch this one: it derives the packaged id from the stage and SKIPs every stable-only
          # assertion when that id is not stable, so a wrong-flavour package exits 0 there.
          ls pkg/com.beb.plxnative_*_arm.ipk >/dev/null 2>&1 \
            || { echo "::error::packaged the wrong flavour — pkg/ holds $(ls pkg/*.ipk 2>&1)"; exit 1; }

      - name: Upload debug files to Sentry
        # **In the same job as the build, deliberately.** `pkg/plxnative.debug` is 75 MB and exists
        # only here; carrying it between jobs as an artifact would cost an upload and a download to
        # move a file whose only consumer is this step. It also keeps the pairing local: the binary
        # and its .debug are asserted to share a build id twenty lines up, and nothing can come
        # between that assertion and this upload.
        #
        # **Fails the release.** A build whose native crash addresses have no matching DIF is not a
        # working crash-reporting build: ingest accepts it silently and the dashboard shows bare
        # addresses. The binary/debug build-id assertion above catches a wrong pair; this step
        # catches a missing token, unusable DIF and failed upload.
        #
        # `--include-sources` bundles every source the DWARF references, so Sentry can show source
        # context around a frame. Checked before enabling it: 1961 files are referenced and NONE of
        # them is gitignored — in particular `src/config.local.h`, which holds a live Plex token, is
        # not referenced at all, and that token appears zero times in both the .debug and the
        # stripped binary. The repository is public and MIT, so the sources are already published.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'gleb-linnik' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'plx-native' }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is not set — refusing to ship unsymbolicatable crash reports."
            exit 1
          fi
          # `debug-files check` first: it is the step that says whether Symbolicator can use this
          # object at all, and its answer (`Arch: arm`, `Usable: yes`) is the one thing no vendor
          # documentation states about armv7.
          npx --yes @sentry/cli@3.7.0 debug-files check pkg/plxnative.debug
          npx --yes @sentry/cli@3.7.0 debug-files upload \
              --include-sources pkg/plxnative.debug pkg/plxnative

      - name: ELF + packaging assertions
        # REQUIRE_PACKAGE: this step runs AFTER `make ipk`, so "nothing staged" here means the build
        # produced no package and must fail. The pre-build callers (`prepare`, `guard`) deliberately
        # do not set it — they exist to grade the version files before anything is built.
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}
          REQUIRE_PACKAGE: "1"
        run: |
          ./ci/check-elf.sh
          python3 ci/check-package.py
          # A gate row is appended only AFTER the gate passed — `run:` is `bash -e`, so a failure
          # never reaches these lines. The audit therefore lists gates that really ran, which is
          # the fact v0.2.1 could not produce: it was hand-published and every gate was skipped.
          { echo "| \`ci/check-elf.sh\` — ELF identity, CP15 barriers, DT_NEEDED | pass |"
            echo "| \`ci/check-package.py\` — versions, ar layout, descriptors, payload, notes | pass |"
          } >> pkg/gates.md

      - name: webosbrew tooling
        run: |
          set -euo pipefail
          TAG=v20260731-e1bb0c0
          declare -A SHA256=(
            [fw-symbols]=639721a0c2248b13e5984930b53729cc201f022725954086aca35e2ccae515b5
            [ipk-verify]=2868b4b2efc097939ab11117c9266d796f0326ee48c90f80070766814fb174d9
            [gen-manifest]=46a023cdec6f5aa07316ef4a0548c30897b349c4843596c41c70a23f8d2792e9
          )
          for p in fw-symbols ipk-verify gen-manifest; do
            file="webosbrew-toolbox-${p}_0.4.0-1_arm64.deb"
            curl -fsSLo "$file" "https://github.com/webosbrew/dev-toolbox-cli/releases/download/${TAG}/$file"
            echo "${SHA256[$p]}  $file" | sha256sum -c -
          done
          sudo apt-get install -y ./webosbrew-toolbox-*.deb

      - name: Compatibility check (gating)
        # Captured to a FILE as well as to the summary, because `ci/gen-release-audit.py` embeds
        # this verbatim in the audit's static-compatibility section. The release note carries one
        # line summarising it; the matrix is fourteen rows and belongs in the audit, derived from
        # the tool rather than retyped — `docs/release-notes/README.md` bans retyping it and this
        # is what makes that possible.
        run: |
          webosbrew-ipk-verify --details --format markdown \
            --fw-releases '>=4.0' pkg/*.ipk | tee pkg/ipk-verify.md | tee -a "$GITHUB_STEP_SUMMARY"

      - id: name
        run: echo "ipk=$(ls pkg/*.ipk)" >> "$GITHUB_OUTPUT"

      - name: Generate the Homebrew Channel manifest
        # -r false: the app needs no root. Device-proven — it runs jailed as uid 6910 under LG's
        # stock jail_native_devmode profile. See docs/distribution.md §3.5.
        run: |
          # icon160.png, NOT largeIcon.png: 130x130 is LG's launcher size, while the channel
          # listing wants 160 (and 320 for the detail icon) — `tools/mkicons.py` cuts all four from
          # one master for exactly this reason. The URL must return 200 or webosbrew's own
          # `repogen.lintpkg` rejects the submission, which means the REPO MUST BE PUBLIC and the
          # icon must be committed on the default branch before the first release.
          webosbrew-gen-manifest \
            -p "${{ steps.name.outputs.ipk }}" \
            -i "https://raw.githubusercontent.com/${{ github.repository }}/main/pkg/icon160.png" \
            -l "https://github.com/${{ github.repository }}" \
            -r false \
            -o pkg/com.beb.plxnative.manifest.json
          cat pkg/com.beb.plxnative.manifest.json

      - name: The manifest hash must match the artifact
        # The sha256 is enforced ON THE DEVICE at install time and by nothing in CI, so a mismatch
        # here is invisible until it breaks every user's install. Assert it while we still can.
        run: |
          set -euo pipefail
          want=$(python3 -c "import json;print(json.load(open('pkg/com.beb.plxnative.manifest.json'))['ipkHash']['sha256'])")
          have=$(sha256sum "${{ steps.name.outputs.ipk }}" | cut -d' ' -f1)
          [ "$want" = "$have" ] || { echo "::error::manifest sha256 $want != artifact $have"; exit 1; }
          echo "ipk sha256 $have" >> "$GITHUB_STEP_SUMMARY"
          echo "| the Homebrew Channel manifest's sha256 matches the artifact | pass |" >> pkg/gates.md

      - name: LGPL corresponding source for the bundled FFmpeg
        # NOT optional and not paperwork. The package ships four FFmpeg shared libraries, so
        # LGPL-2.1's source obligation is OURS rather than the television's, and
        # THIRD-PARTY-NOTICES.md §1.1 states in writing that the exact tarball and the complete
        # configure invocation accompany every release. A release without these contradicts the
        # notice that ships inside it.
        #
        # The tarball is the pristine upstream one build-ffmpeg.sh already downloaded and verified
        # against a pinned sha256 — no patches are applied, so this IS the corresponding source.
        run: |
          set -euo pipefail
          tarball=$(ls vendor/ffmpeg-build/ffmpeg-*.tar.xz)
          cp "$tarball" pkg/
          cp ci/build-ffmpeg.sh pkg/
          echo "LGPL source: $(basename "$tarball") + build-ffmpeg.sh" >> "$GITHUB_STEP_SUMMARY"
          echo "| LGPL corresponding source attached ($(basename "$tarball") + build-ffmpeg.sh) | pass |" >> pkg/gates.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            pkg/*.ipk
            pkg/*.manifest.json
            pkg/ipk.sha256
            pkg/ffmpeg-*.tar.xz
            pkg/build-ffmpeg.sh
            pkg/ipk-verify.md
            pkg/gates.md
            pkg/build-config.txt

  publish:
    name: publish release
    runs-on: ubuntu-latest
    # `legal-gate` is listed purely so its verdict can be READ into the release audit's gate table
    # — `needs` exposes only DIRECT dependencies, and `build` already refuses to run without it.
    needs: [build, guard, legal-gate]
    # See legal-gate: explicit, or the tag-push path skips this silently.
    if: always() && needs.guard.result == 'success' && needs.build.result == 'success' 
    permissions:
      contents: write
    steps:
      # Checkout BEFORE download-artifact, not after: `actions/checkout` cleans the workspace by
      # default and would delete `dist/`. This job had no checkout at all until now, which made its
      # last step — `ci/verify-published.sh` — a file that does not exist; it has never run, because
      # v0.2.1 was hand-published and nothing has been published through this job since.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.guard.outputs.tag }}
          # A shallow clone cannot push, and this job now pushes: the completed release audit goes
          # to `main` in its last step. Same reason `prepare` fetches everything.
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      # The BODY is the committed note, not GitHub's auto-generated PR list. `check-package.py`
      # already refuses to build without `docs/release-notes/vX.Y.Z.md`, and its comment has said
      # "CI publishes the release body from this file" since it was written — this is the step that
      # makes that true. Until now the prose was pasted onto an already-published release by hand,
      # which meant `releases/latest` briefly carried a one-line body and a `rebuild_tag:` re-publish
      # silently dropped the note entirely.
      #
      # ONE value in it cannot exist in the committed file — the artifact's sha256 — so the note
      # carries a sentinel and it is filled HERE, from the artifact itself. That is the point: a
      # hash nobody types cannot be the wrong hash, which is the class of defect the release-note
      # standard exists to end. Everything else in the body is the reviewed text, byte for byte.
      #
      # The other four sentinels (`__COMMIT__`, `__RUN_URL__`, `__IPK_SIZE__`, `__INSTALLED_SIZE__`)
      # are still substituted for a note that uses them, so every published note stays reproducible
      # from its committed file. New notes should not need them: provenance and sizes are the
      # release AUDIT's job now, generated from the artifact rather than pasted through a sentinel.
      - name: Render the release body from the committed note
        run: |
          set -euo pipefail
          tag='${{ needs.guard.outputs.tag }}'
          note="docs/release-notes/$tag.md"
          [ -f "$note" ] || { echo "::error::$note is missing — the release would publish with no notes"; exit 1; }
          ipk=$(ls dist/*.ipk)
          sha=$(sha256sum "$ipk" | cut -d' ' -f1)
          commit=$(git rev-parse HEAD)
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # The two SIZES are sentinels for the same reason the hash is: they are measurable by the
          # reader, they move with every build (the bundled FFmpeg's size depends on the build), and
          # the standard's §1.9 defect was exactly a size somebody typed. Read from the manifest,
          # which is the artifact the note tells the reader they came from.
          size=$(python3 -c "import json;print(json.load(open('dist/com.beb.plxnative.manifest.json'))['ipkSize'])")
          inst=$(python3 -c "import json;print(json.load(open('dist/com.beb.plxnative.manifest.json'))['installedSize'])")
          # ONE sentinel is mandatory: the artifact's sha256, which is the only tamper check a
          # user of an unsigned binary has. A note that lost it would publish a body with no hash
          # at all, and `verify-published.sh` would only catch that once the release was public.
          # The other four are substituted when a note uses them and are not required — since
          # 2026-08-29 the sizes, the commit and the run URL live in the release AUDIT, which is
          # generated from the artifact rather than written with sentinels.
          grep -q __IPK_SHA256__ "$note" \
            || { echo "::error::$note does not carry the __IPK_SHA256__ sentinel"; exit 1; }
          sed -e "s|__IPK_SHA256__|$sha|g" -e "s|__COMMIT__|$commit|g" -e "s|__RUN_URL__|$run|g" \
              -e "s|__IPK_SIZE__|$size|g" -e "s|__INSTALLED_SIZE__|$inst|g" \
              "$note" > dist/body.md
          echo "body: $(wc -l < dist/body.md) lines, sha $sha" >> "$GITHUB_STEP_SUMMARY"
      # THE AUDIT'S EVIDENCE HALF, derived from the artifact that is about to be published.
      #
      # `docs/release-audits/vX.Y.Z.md` is committed with its AUTHORED half — device-test evidence,
      # third-party reports, what this release deliberately did not do — which no command can
      # produce. Everything measurable is read out of the .ipk here: hashes and their agreement,
      # the ar layout, the payload inventory with per-file hashes, DT_NEEDED, the dev-trigger
      # witnesses, FFmpeg's recorded configure invocation, the build-machine-path scan.
      #
      # It runs BEFORE the release is created, and a failure here stops the publish: an audit that
      # cannot be produced from the artifact means something about the artifact is not what the
      # release is about to claim.
      - name: Generate the release audit from the built artifact
        run: |
          set -euo pipefail
          tag='${{ needs.guard.outputs.tag }}'
          # Job-level verdicts first, then the in-build gate rows the build job appended as each
          # gate passed. `bash -e` means a failed gate never reached its own row.
          {
            echo "| gate | verdict |"
            echo "|---|---|"
            echo "| \`tag / version agreement\` | ${{ needs.guard.result }} |"
            echo "| \`redistributable assets\` (LICENSE, notices, font family) | ${{ needs['legal-gate'].result }} |"
            echo "| \`build + verify\` | ${{ needs.build.result }} |"
            cat dist/gates.md 2>/dev/null || true
          } > dist/all-gates.md
          python3 ci/gen-release-audit.py \
            --tag "$tag" --dist dist \
            --commit "$(git rev-parse HEAD)" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --uploader 'github-actions[bot]' \
            --build-config "$(cat dist/build-config.txt 2>/dev/null || echo unknown)" \
            --gates dist/all-gates.md \
            --fwcompat dist/ipk-verify.md \
            --out dist/audit-generated.md
          echo "audit evidence: $(wc -l < dist/audit-generated.md) lines" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release
        id: publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          # the committed note, with GitHub's compare-link tail appended after it
          body_path: dist/body.md
          append_body: true
          # NEITHER of these may become true: both exclude the release from `releases/latest`,
          # which is the URL the webosbrew package YAML resolves the manifest through.
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.ipk
            dist/*.manifest.json
            dist/ipk.sha256
            dist/ffmpeg-*.tar.xz
            dist/build-ffmpeg.sh
      # Re-derive every published claim FROM the published artifacts. Everything assertable
      # before publishing is in ci/check-package.py; this is the half that needs a live release —
      # the hash agreeing in four places, `shasum -c` working where a user actually stands, the
      # uploader being CI rather than a person, and no payload file carrying a build machine's
      # directory layout. All four of v0.2.1's defects are in scope here; two of them are only
      # visible once the assets exist.
      - name: Verify what the public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # Captured as well as printed: this verdict is the audit's last section, and it is the
          # one thing in the file that needs a LIVE release to establish. The colour codes go —
          # they are for a terminal, not for a markdown code block.
          ci/verify-published.sh "${{ needs.guard.outputs.tag || github.ref_name }}" 2>&1 \
            | tee /tmp/published.txt
          sed -i 's/\x1b\[[0-9;]*m//g' /tmp/published.txt

      # The completed audit goes to `main`, not to the tag: it describes an artifact that did not
      # exist when the tag was written, and the last section describes a release that did not exist
      # ten seconds ago. `[skip ci]` because this is a documentation commit and ci.yml runs a full
      # cross-build on every push to main.
      - name: Commit the completed audit to main
        if: always() && steps.publish.conclusion == 'success'
        run: |
          set -euo pipefail
          tag='${{ needs.guard.outputs.tag }}'
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          if [ ! -f "docs/release-audits/$tag.md" ]; then
            echo "::notice::no docs/release-audits/$tag.md on main — pre-standard release, nothing to complete"
            exit 0
          fi
          python3 ci/gen-release-audit.py \
            --tag "$tag" --dist dist \
            --commit "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --uploader 'github-actions[bot]' \
            --build-config "$(cat dist/build-config.txt 2>/dev/null || echo unknown)" \
            --gates dist/all-gates.md \
            --fwcompat dist/ipk-verify.md \
            --published /tmp/published.txt \
            --write
          python3 ci/check-package.py --lint-audit "docs/release-audits/$tag.md"
          git add "docs/release-audits/$tag.md"
          if git diff --cached --quiet; then
            echo "audit already complete and unchanged"
          else
            git commit -m "release: audit for $tag [skip ci]"
            git push origin main
          fi

      - name: Propagation note
        run: |
          {
            echo "### Published"
            echo "webosbrew's registry has no webhook — it rebuilds on a \`cron: 41 */3 * * *\`"
            echo "schedule and re-fetches every manifest, so expect **~1.5-3 h** before the"
            echo "Homebrew Channel offers this update, plus a ~10 min CDN TTL."
            echo ""
            echo "The Channel compares versions by plain **string equality**, not semver — any"
            echo "change to the version string reads as an update."
          } >> "$GITHUB_STEP_SUMMARY"
