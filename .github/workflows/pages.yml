# This repo's Pages source is "GitHub Actions" (switched from the legacy
# "Deploy from a branch" Jekyll build that used to serve docs/). Verify with:
#   gh api repos/<owner>/<repo>/pages --jq .build_type
# It should read "workflow"; "legacy" would mean the source reverted.
name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "docs/install-and-verify.md"
      - "docs/troubleshooting.md"
      - "docs/nightly-builds.md"
      - "ci/nightly.py"
      - "tools/render-doc-page.py"
      - "tools/requirements-docs.txt"
      - "pkg/appfont.ttf"
      - "pkg/appfont-bold.ttf"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # nightly.yml calls this after every published nightly, so the site's "latest nightly" pointer
  # (staged below, `_site/nightly/latest.json`) moves the same day a nightly does rather than
  # waiting for the next unrelated site/docs push. The caller grants pages: write, id-token: write
  # and contents: read on the calling job; this workflow's own top-level `permissions:` still
  # governs the push/workflow_dispatch triggers above.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Measured max 0.5 min over the last 40 successful runs; limit ~2x, rounded up to 5 (unset = 360).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Install doc-render dependencies
        run: python3 -m pip install --quiet -r tools/requirements-docs.txt

      - name: Stage _site
        run: |
          set -euo pipefail

          mkdir -p _site/media
          mkdir -p _site/icons
          mkdir -p _site/docs/screenshots
          mkdir -p _site/fonts
          mkdir -p _site/nightly
          mkdir -p _site/install
          mkdir -p _site/troubleshooting

          cp site/index.html _site/index.html
          cp site/credits.html _site/credits.html
          cp site/styles.css _site/styles.css
          cp site/site.js _site/site.js
          cp site/CNAME _site/CNAME
          cp site/robots.txt _site/robots.txt
          cp site/sitemap.xml _site/sitemap.xml
          cp site/404.html _site/404.html

          cp site/media/feel-1080p60.av1.mp4 _site/media/feel-1080p60.av1.mp4
          cp site/media/feel-1080p60.h264.mp4 _site/media/feel-1080p60.h264.mp4
          cp site/media/feel-720p60.av1.mp4 _site/media/feel-720p60.av1.mp4
          cp site/media/feel-720p60.h264.mp4 _site/media/feel-720p60.h264.mp4
          cp site/media/feel-poster.jpg _site/media/feel-poster.jpg
          cp site/media/feel-poster-narrow.jpg _site/media/feel-poster-narrow.jpg
          cp site/media/feel-glow.png _site/media/feel-glow.png
          cp site/media/feel-glow-narrow.png _site/media/feel-glow-narrow.png
          cp site/media/closeup-glass.jpg _site/media/closeup-glass.jpg
          cp site/media/closeup-glass.webp _site/media/closeup-glass.webp
          cp site/media/closeup-glass-narrow.jpg _site/media/closeup-glass-narrow.jpg
          cp site/media/closeup-glass-narrow.webp _site/media/closeup-glass-narrow.webp
          cp site/media/closeup-tiles.jpg _site/media/closeup-tiles.jpg
          cp site/media/closeup-tiles.webp _site/media/closeup-tiles.webp
          cp site/media/closeup-tiles-narrow.jpg _site/media/closeup-tiles-narrow.jpg
          cp site/media/closeup-tiles-narrow.webp _site/media/closeup-tiles-narrow.webp
          cp site/media/closeup-player.jpg _site/media/closeup-player.jpg
          cp site/media/closeup-player.webp _site/media/closeup-player.webp
          cp site/media/closeup-player-narrow.jpg _site/media/closeup-player-narrow.jpg
          cp site/media/closeup-player-narrow.webp _site/media/closeup-player-narrow.webp
          cp site/media/closeup-glass-glow.png _site/media/closeup-glass-glow.png
          cp site/media/closeup-glass-narrow-glow.png _site/media/closeup-glass-narrow-glow.png
          cp site/media/closeup-tiles-glow.png _site/media/closeup-tiles-glow.png
          cp site/media/closeup-player-glow.png _site/media/closeup-player-glow.png
          cp site/media/og-card.jpg _site/media/og-card.jpg

          cp site/icons/favicon-32.png _site/icons/favicon-32.png
          cp site/icons/favicon-48.png _site/icons/favicon-48.png
          cp site/icons/apple-touch-icon.png _site/icons/apple-touch-icon.png
          cp site/icons/brand-mark.png _site/icons/brand-mark.png
          cp site/icons/support_me_on_kofi_dark.png _site/icons/support_me_on_kofi_dark.png

          cp docs/screenshots/home.jpg _site/docs/screenshots/home.jpg

          # Subsets pkg/appfont.ttf / pkg/appfont-bold.ttf (the APP's fonts, untouched) down to
          # the characters the site actually renders and writes WOFF2 into _site/fonts/ — see
          # tools/subset-site-fonts.py for the character set and why. Two ~400 KB TTFs become two
          # ~20 KB WOFF2s.
          python3 tools/subset-site-fonts.py subset --out-dir _site/fonts

          python3 tools/render-doc-page.py docs/install-and-verify.md > _site/install/index.html
          python3 tools/render-doc-page.py docs/troubleshooting.md > _site/troubleshooting/index.html
          # The nightly guide lives at /nightly/ beside the files the Homebrew Channel repository
          # serves from the same directory (staged below).
          python3 tools/render-doc-page.py docs/nightly-builds.md > _site/nightly/index.html

          # Pages serves everything with a 10-minute browser cache, so a visitor right after a
          # deploy could get the new HTML with the old stylesheet/script, or the other way round.
          # Stamping the references with the commit makes each page fetch its own matching
          # styles.css and site.js. (The asset check below ignores the query string.)
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(styles\.css|site\.js)\"#\1?v=${v}\"#g" \
            _site/index.html _site/credits.html _site/install/index.html _site/troubleshooting/index.html _site/nightly/index.html _site/404.html
          grep -c "?v=${v}" _site/index.html _site/credits.html _site/install/index.html _site/troubleshooting/index.html _site/nightly/index.html _site/404.html

      - name: Stage nightly/latest.json
        # `{"available": false}` when no nightly has ever published — the site has to build before
        # the first nightly exists, so a `gh api` miss here must not fail the whole Pages build.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ci/nightly.py latest-json --repo "${{ github.repository }}" > _site/nightly/latest.json
          cat _site/nightly/latest.json

      - name: Stage the nightly Homebrew Channel repository
        # `repo.json`, the newest nightly's manifest and its description page — what a user's
        # Homebrew Channel fetches after adding `https://plxnative.com/nightly/repo.json`. An empty
        # index when there is no nightly with a manifest yet, so the site still builds. A manifest
        # that disagrees with its own release (id, hash, dated version) FAILS this step on purpose:
        # serving it would break installs on televisions, where the hash is checked and nothing
        # else is.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ci/nightly.py repo-json --repo "${{ github.repository }}" --out-dir _site/nightly
          python3 -c "import json;json.load(open('_site/nightly/repo.json'))"

      - name: Check PlxAppFont subset covers the staged site
        # _site/nightly/latest.json is JSON data, not rendered text (site.js pulls only ASCII
        # version/date fields from it today), so it is deliberately outside this check's scan.
        run: python3 tools/subset-site-fonts.py check --site-dir _site

      - name: Check for missing assets
        run: |
          python3 - <<'PYEOF'
          import re
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit

          site = Path("_site")

          def local_refs(text):
              refs = set()
              for m in re.finditer(r'''(?:src|srcset|href|poster|data-img)\s*=\s*["']([^"']+)["']''', text):
                  refs.add(m.group(1))
              for m in re.finditer(r'''url\(\s*["']?([^"')]+)["']?\s*\)''', text):
                  refs.add(m.group(1))
              return refs

          def is_local(ref):
              ref = ref.strip()
              if not ref:
                  return False
              if ref.startswith("#"):
                  return False
              if ref.startswith("mailto:") or ref.startswith("tel:") or ref.startswith("data:"):
                  return False
              scheme = urlsplit(ref).scheme
              if scheme in ("http", "https"):
                  return False
              return True

          sources = [
              site / "index.html",
              site / "credits.html",
              site / "install" / "index.html",
              site / "troubleshooting" / "index.html",
              site / "nightly" / "index.html",
              site / "404.html",
              site / "ci" / "index.html",
              site / "styles.css",
              site / "site.js",
          ]
          all_refs = set()
          for src in sources:
              if src.exists():
                  all_refs |= local_refs(src.read_text(encoding="utf-8"))

          local_ref_count = 0
          missing = []
          escaped = []
          for ref in sorted(all_refs):
              if not is_local(ref):
                  continue
              clean = ref.split("#", 1)[0].split("?", 1)[0]
              if not clean:
                  continue
              local_ref_count += 1
              # The doc pages (install/, troubleshooting/) are one path segment deep, so
              # tools/render-doc-page.py emits root-absolute refs ("/styles.css", "/install/")
              # rather than "../styles.css". Path.__truediv__ treats an absolute right-hand
              # side as a full replacement, not a join, so strip the leading "/" first —
              # these are root-of-site paths, not filesystem-absolute ones.
              resolved = (site / clean.lstrip("/")).resolve()
              try:
                  resolved.relative_to(site.resolve())
              except ValueError:
                  # Reference escapes _site entirely: always a failure.
                  escaped.append((ref, str(resolved)))
                  continue
              if not resolved.exists():
                  missing.append((ref, str(resolved)))

          if escaped:
              print("Local assets referenced outside the staged site:")
              for ref, resolved in escaped:
                  print(f"  {ref} -> {resolved}")

          if missing:
              print("Missing local assets referenced from the staged site:")
              for ref, resolved in missing:
                  print(f"  {ref} -> {resolved}")

          if missing or escaped:
              sys.exit(1)

          print(f"All {local_ref_count} local references resolved under _site/.")
          PYEOF

      - name: Add .nojekyll
        run: touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          # This action's tar step excludes dotfiles unless told otherwise;
          # without this, the .nojekyll file above never reaches the deploy.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Measured max 0.8 min over the last 40 successful runs; limit ~2x, rounded up to 5 (unset = 360).
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
