# The DAILY build-time measurement behind the live page https://plxnative.com/ci/.
#
# Once a day this builds the tip of main on a GitHub-hosted macOS runner with the repository's own
# benchmark (`make build-bench`, tools/build-bench.py) and appends one record to build-history.json
# on the orphan `ci-metrics` branch (tools/build-history.py), next to ci-history.json, which
# ci-metrics.yml keeps. The page reads both, so "what do I wait for on my machine, and is it getting
# slower" is a chart that updates itself, not a number somebody pasted into a pull request.
#
# WHAT IS MEASURED (every row a median of 3 runs, with min and max, in seconds):
#   noop      host test build with nothing changed (reports whether the app crate recompiled);
#   leaf, ui, screens, app
#             the same build after appending a comment to a leaf file of plx_base / plx_ui /
#             plx_screens / the app crate: the worst, a middle and the two top layers' edit-rebuild;
#   tests     the default-feature unit suite on a warm tree (tools/cargo-test-parallel.py);
#   check     `make check`'s whole host gate, ONE run, and its cargo and python branches. It is the
#             slowest row and the one most likely to need something a runner lacks, so it runs in its
#             own job, on its own runner, beside the rest: it cannot lengthen the day's wall time or
#             load the machine the other rows are timed on, and a red or unrunnable gate costs only
#             its own rows (the record lists it in `failed`).
# The scenarios of the first job are named in DEFAULT_ONLY below; `workflow_dispatch` takes another
# list (and then skips the gate job).
#
# RUNNER TIME, an ESTIMATE until the first run (a workflow file can only be dispatched or
# scheduled from the default branch, so this could not be run before it merges): the repository's own
# CI history gives the yardsticks, medians of recent runs on the same runner families: the macOS
# simulator job (a debug build of the whole workspace, FFmpeg cached) 8.5 min; the host unit job on
# a 4-core Linux runner 4.3 min, the hostsim one 3.5, lint 2.7, the python gates 2.9. From those:
#   measure   setup 3 + untimed warm-up 4 + 3 rounds of six rows at about 4 min a round = ~19 min
#             (up to ~27 on a day the dependency cache misses);
#   gate      setup 3 + the gate's cargo half (lint, unit suites, hostsim ~11 min serial) = ~15 min
#             (up to ~25 on a cache miss), in parallel with `measure`.
# So a day takes ~19 minutes of wall time and ~34 minutes of macOS runner time.
#
# WHAT IS CACHED, so what "cold" means in the numbers: Swatinem/rust-cache restores the dependency
# artifacts of rust-modules/target (and drops the workspace's own crates from it when it saves), so
# the workspace crates the host test build names compile from scratch once per run, in the benchmark's UNTIMED warm-up
# build; every timed row is a rebuild on that warm tree, which is the same thing a developer's
# `make test-fast` rebuilds, whatever the cache held. The `check` row is one run whose cargo half
# starts from the cached dependencies and a tree the benchmark already built. Nothing downloads
# during a timed row. A runner image or toolchain update shows up as a step in the series: the
# record carries the image name and the rustc version for exactly that reason.
#
# WHAT THE NUMBERS ARE FOR: the TREND of one fixed runner type (a few cores, shared with other
# tenants), not the absolute time on a developer's Mac, which is several times faster. A noisy day
# (the benchmark printed a load or swap warning) is recorded with `noisy: true` and drawn marked,
# not dropped; the min-max band says how far to trust a point.
#
# COST: a public repository's runner minutes are free; the job is bounded by timeout-minutes below
# and by a step limit on the `check` run. It runs for the default branch of THIS repository only
# (a fork's copy, or a dispatch from another branch, skips).
#
# Trigger a measurement by hand (a same-day run REPLACES that day's record):
#   gh workflow run build-bench.yml
#   gh workflow run build-bench.yml -f only=noop,leaf          # a cheaper, narrower run
name: Build bench

on:
  schedule:
    # 04:17 UTC: off the top of the hour, when scheduled workflows queue the longest, and after the
    # day's merges from both sides of the Atlantic have settled.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated build-bench scenario ids to time (default: the daily set)"
        type: string
        default: ""

# The workflow-level grant is empty; each job asks for what it needs.
permissions: {}

# One measurement at a time. A second one would only add load to the first one's numbers.
concurrency:
  group: build-bench
  cancel-in-progress: false

env:
  # The daily set. `check` is not here: it has its own step.
  DEFAULT_ONLY: noop,leaf,ui,screens,app,tests

jobs:
  measure:
    name: Time the build on a macOS runner
    if: github.repository == 'GLinnik21/plx-native' && github.ref_name == github.event.repository.default_branch
    runs-on: macos-latest
    permissions:
      contents: read
    # Setup ~3 min, the untimed warm-up build 4-12 min depending on the dependency cache, the timed
    # rows ~12 min. 35 bounds a hung step (unset = 360).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install what the host build links
        # Same packages as the macOS simulator job; bounded because macOS runners have no timeout(1).
        timeout-minutes: 15
        run: brew install sdl2_ttf cmake pkg-config

      - id: toolchain
        name: Install the nightly toolchain the Makefile names
        run: |
          set -euo pipefail
          nightly="$(make -s print-bench-config | sed -n 's/^RUST_NIGHTLY=//p')"
          test -n "$nightly"
          rustup toolchain install "$nightly" --profile minimal --component clippy --component rust-src
          rustup run "$nightly" rustc --version
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: rust-modules
          key: build-bench

      - name: make build-bench (median of 3 runs)
        env:
          ONLY: ${{ inputs.only || env.DEFAULT_ONLY }}
        run: |
          set -euo pipefail
          # The ids go into a make variable: only names, never anything a shell could read as more.
          [[ "$ONLY" =~ ^[a-z,-]+$ ]]
          make build-bench ARGS="--runs 3 --only $ONLY --json $RUNNER_TEMP/bench.json"

      - name: Keep the documents for the publish job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-bench-rows
          path: ${{ runner.temp }}/bench.json
          if-no-files-found: error
          retention-days: 3

  gate:
    name: Time the whole host gate on a macOS runner
    # Not for a narrowed manual run (`only`), which asked for something else.
    if: github.repository == 'GLinnik21/plx-native' && github.ref_name == github.event.repository.default_branch && !inputs.only
    runs-on: macos-latest
    permissions:
      contents: read
    # Setup ~3 min, then the gate once: ~11 min of cargo on a warm dependency cache, ~20 on a cold one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install what the host build links
        timeout-minutes: 15
        run: brew install sdl2_ttf cmake pkg-config

      - name: Install the nightly toolchain the Makefile names
        run: |
          set -euo pipefail
          nightly="$(make -s print-bench-config | sed -n 's/^RUST_NIGHTLY=//p')"
          test -n "$nightly"
          rustup toolchain install "$nightly" --profile minimal --component clippy --component rust-src
          rustup run "$nightly" rustc --version

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: rust-modules
          key: build-bench-gate

      - name: make build-bench, the whole gate once
        # May fail (a tool the gate shells out to that a runner lacks) without costing the rest of
        # the day: the document it still writes then lists `check` as failed. Bounded on its own.
        continue-on-error: true
        timeout-minutes: 25
        run: make build-bench ARGS="--runs 1 --only check --json $RUNNER_TEMP/check.json"

      - name: Keep the document for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-bench-gate
          path: ${{ runner.temp }}/check.json
          if-no-files-found: ignore
          retention-days: 3

  publish:
    name: Record the day on the ci-metrics branch
    # The gate job is waited for but not required: it may be skipped (a narrowed manual run) or
    # fail; the rows job is the one a record cannot do without.
    needs: [measure, gate]
    # A failed measurement writes nothing.
    if: always() && needs.measure.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write    # the push to the ci-metrics branch, and nothing else
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          # The recorder and the summary it feeds, with whatever they import: the tools directory.
          sparse-checkout: tools
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: build-bench-*
          merge-multiple: true
          path: ${{ runner.temp }}/bench

      - name: Check out the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q data
          git -C data remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # ci-metrics.yml's rule: only "no such branch" (exit 2) may start a new history; a network
          # error must not silently restart it.
          rc=0
          git -C data -c "http.https://github.com/.extraheader=${auth}" ls-remote --exit-code --heads origin ci-metrics >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git -C data -c "http.https://github.com/.extraheader=${auth}" fetch --depth=1 origin ci-metrics
            git -C data checkout -q -B ci-metrics FETCH_HEAD
          elif [ "$rc" = 2 ]; then
            echo "no ci-metrics branch yet: starting an orphan one"
            git -C data checkout -q --orphan ci-metrics
          else
            echo "could not list the ci-metrics branch (exit $rc)" >&2
            exit "$rc"
          fi

      - name: Add today's record, summarise, and push
        working-directory: data
        env:
          GH_TOKEN: ${{ github.token }}
          BENCH_DIR: ${{ runner.temp }}/bench
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # Both files are derived from what is on the branch NOW, so a lost race redoes this step
            # from the new tip instead of rebasing a stale summary over it.
            args=(--bench "$BENCH_DIR/bench.json")
            if [ -f "$BENCH_DIR/check.json" ]; then args+=(--bench "$BENCH_DIR/check.json"); fi
            python3 ../tools/build-history.py "${args[@]}" --in build-history.json --out build-history.json --run-id "$GITHUB_RUN_ID"
            python3 ../tools/ci-summary.py --history ci-history.json --bench build-history.json --out ci-summary.json
            git add build-history.json ci-summary.json
            if git diff --cached --quiet; then
              echo "nothing changed; nothing to commit"
              exit 0
            fi
            git commit -q -m "build-history: record from run ${GITHUB_RUN_ID}"
            if git -c "http.https://github.com/.extraheader=${auth}" push origin HEAD:refs/heads/ci-metrics; then
              exit 0
            fi
            echo "push lost a race (attempt $attempt); starting again from the new tip"
            git -c "http.https://github.com/.extraheader=${auth}" fetch --depth=1 origin ci-metrics
            git reset -q --hard FETCH_HEAD
          done
          echo "could not push after 3 attempts" >&2
          exit 1
