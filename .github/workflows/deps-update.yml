name: Dependency updates

# Dependabot reads package manifests, not ci/dependencies.json (the FFmpeg, Sentry Native, libass
# font stack, NDK, nanosvg, jsmpeg and toolbox pins), so this workflow does the same job for it.
#
#   propose  weekly and on demand: `ci/deps-update.py --list-outdated` names every entry whose
#            upstream (its `update` object in the manifest) has a newer release and is not held.
#            For each, ONE pull request on `deps/<name>-<version>` carries the bump
#            (`--bump`: new asset downloaded, sha256 recomputed, version and URLs rewritten, patches
#            never touched). A patch that no longer applies makes the bump exit 3: the manifest is
#            still committed and the PR is opened as a DRAFT whose body quotes patch's output, so
#            the failure is visible in the PR and not only in a red scheduled run. An open PR for an
#            older version of the same dependency is closed in favour of the new one; an existing
#            branch is updated, not duplicated.
#   graph    on every push to main that changes the manifest, and weekly: submits the manifest to the
#            dependency graph (GitHub's dependency submission API) so the pins show up in Insights >
#            Dependency graph and in Dependabot alerts for the github purls.
#
# TOKEN AND CI. Both jobs use the workflow's GITHUB_TOKEN with the permissions each declares (the
# default is none). A push or a pull request made with GITHUB_TOKEN does not start `pull_request` or
# `push` workflows (docs: "Triggering a workflow from a workflow"), except `workflow_dispatch`. So,
# exactly like dependabot-notices.yml, each branch is pushed and then `gh workflow run ci.yml --ref
# <branch>` dispatches ci.yml (hence `actions: write`); its checks attach to the branch head and show
# in the PR. That run tests the branch head, not the merge with main. `contents: write` is needed to
# push the branch, `pull-requests: write` to open and close PRs. Repository setting required:
# Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
#
# NOTHING UNTRUSTED IS EXECUTED OR INTERPOLATED. The checkout is this repository's own default
# branch; upstream-controlled strings (a release's tag) are validated by the script (letters,
# digits, `.`, `_`, `-`) before they become a branch name and reach the shell only through `env:`
# or a file. Downloaded archives are hashed and, for the patch check, unpacked in a temp directory
# and read by `patch --dry-run`; nothing from them runs.
#
# Tested by ci/test_deps_update.py (WorkflowShape).

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ci/dependencies.json

permissions: {}

concurrency:
  group: deps-update-${{ github.event_name == 'push' && 'graph' || 'propose' }}
  cancel-in-progress: false

jobs:
  propose:
    name: open dependency bump pull requests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Open or update one pull request per outdated dependency
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          python3 -I ci/deps-update.py --report || true
          python3 -I ci/deps-update.py --list-outdated > outdated.tsv || echo "::warning::some upstream lookups failed (see the report above)"
          failed=0
          while IFS=$'\t' read -r name version; do
            [ -n "$name" ] || continue
            branch="deps/${name}-${version}"
            git checkout -q -f -B "$branch" "origin/${DEFAULT_BRANCH}"
            status=0
            python3 -I ci/deps-update.py --bump "$name" --body-file "$RUNNER_TEMP/body.md" || status=$?
            if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
              echo "::error title=Bump of ${name} failed::ci/deps-update.py --bump ${name} exited ${status}"
              failed=1
              continue
            fi
            draft=()
            if [ "$status" -eq 3 ]; then
              echo "::error title=Patch no longer applies::${name} ${version}: a pinned patch does not apply; opening a draft PR that says so"
              draft=(--draft)
              failed=1
            fi
            git add ci/dependencies.json
            git commit -q -m "Dependencies: ${name} -> ${version}"
            # A branch someone else has pushed to (a person rebasing a patch on it) is never overwritten.
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git fetch -q origin "$branch"
              author=$(git log -1 --format=%an FETCH_HEAD)
              if [ "$author" != "github-actions[bot]" ]; then
                echo "::warning title=Branch left alone::${branch} has commits by ${author}; not overwriting it"
                continue
              fi
            fi
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
              push --force origin "HEAD:refs/heads/${branch}"
            title="Dependencies: ${name} -> ${version}"
            if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
              gh pr edit "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
              if [ "$status" -eq 3 ]; then gh pr ready "$branch" --undo || true; fi
            else
              gh pr create --head "$branch" --base "$DEFAULT_BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md" "${draft[@]}"
            fi
            # A GITHUB_TOKEN push starts no pull_request run; workflow_dispatch is the exception (see the header).
            gh workflow run ci.yml --ref "$branch"
            # An open PR for an older version of this dependency is superseded.
            for old in $(gh pr list --state open --limit 100 --json number,headRefName \
                --jq ".[] | select(.headRefName | startswith(\"deps/${name}-\")) | select(.headRefName != \"${branch}\") | .number"); do
              gh pr close "$old" --delete-branch --comment "Superseded by ${branch}."
            done
          done < outdated.tsv
          exit "$failed"

  graph:
    name: submit the manifest to the dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Submit ci/dependencies.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # The snapshot belongs to the default branch's head, whatever started this run.
          sha=$(git rev-parse HEAD)
          GITHUB_RUN_ID="$RUN_ID" python3 -I ci/deps-update.py --snapshot --sha "$sha" --ref "$DEFAULT_REF" > snapshot.json
          gh api --method POST "repos/${GH_REPO}/dependency-graph/snapshots" --input snapshot.json
