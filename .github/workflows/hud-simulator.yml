name: HUD authoring simulator

on:
  pull_request:
    paths:
      - '.github/workflows/hud-simulator.yml'
      - 'tools/hud_*.py'
      - 'tools/screenshots.py'
      - 'rust-modules/src/hud_*.rs'
      - 'rust-modules/src/dev/framedump.rs'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing app release tag to attach to; empty builds a private Actions artifact'
        type: string
        default: ''
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR artifacts identify the tested head, not a temporary GitHub merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/apt-install
        with:
          packages: libsdl2-dev libsdl2-ttf-dev libgl1-mesa-dev libgl1-mesa-dri libcurl4-openssl-dev xvfb xauth cmake pkg-config nasm ffmpeg python3-pil patchelf
          recommends: 'true'
      - name: Cache pinned source downloads
        uses: ./.github/actions/deps-cache
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust-modules -> target-sim-video
          key: hud-authoring-linux
      - name: Build the actual player simulator and bundled FFmpeg
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          HOST=1 ./ci/build-ffmpeg.sh
          if [ -n "$RELEASE_TAG" ]; then
            make FLAVOR=stable RELEASE=1 site-video-sim SITE_VIDEO_TDIR=rust-modules/target-sim-video
          else
            make site-video-sim SITE_VIDEO_TDIR=rust-modules/target-sim-video
          fi
      - name: Check capture and bundle tools
        run: python3 -m unittest discover -s tests -p 'test_hud_*.py' -v
      - name: Assemble the relocatable, source-bound artifact
        run: |
          python3 tools/hud_bundle.py --bin rust-modules/target-sim-video/release/plxnative-sim --out out/plxnative-hud-simulator-linux-x86_64.tar.gz
          mkdir -p "$RUNNER_TEMP/relocated simulator"
          tar -xzf out/plxnative-hud-simulator-linux-x86_64.tar.gz -C "$RUNNER_TEMP/relocated simulator"
          "$RUNNER_TEMP/relocated simulator/bin/plxnative-sim" --hud-info
          "$RUNNER_TEMP/relocated simulator/bin/plxnative-sim" --hud-lint "$RUNNER_TEMP/relocated simulator/corpus/reference.plxhud.json" --lang all --format json > out/reference-lint.json
      - name: Save simulator and measurement evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hud-simulator-linux
          path: out/
          if-no-files-found: error
          retention-days: 30
  attach:
    needs: build
    if: github.event_name != 'pull_request' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hud-simulator-linux
          path: out
      - name: Attach once to the matching immutable app release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          pin = json.loads(Path('out/plxnative-hud-simulator-linux-x86_64.tar.pin.json').read_text())
          tag = os.environ['RELEASE_TAG']
          if tag != 'v' + pin['app_version'] or pin['development'] or pin['source_sha'] != os.environ['SOURCE_SHA']:
              raise SystemExit('release tag, source and simulator version must agree')
          subprocess.run(['gh','release','view',tag],check=True)
          # No --clobber: an app release's simulator pin must never be silently replaced.
          subprocess.run(['gh','release','upload',tag,*map(str,sorted(Path('out').glob('plxnative-*')))],check=True)
          PY
      - name: Ask the registry to re-lint with the published simulator
        env:
          GH_TOKEN: ${{ secrets.HUD_REGISTRY_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::HUD_REGISTRY_DISPATCH_TOKEN is required for the registry release check"; exit 1; }
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          pin = json.loads(Path('out/plxnative-hud-simulator-linux-x86_64.tar.pin.json').read_text())
          pin['url'] = 'https://github.com/GLinnik21/plx-native/releases/download/' + os.environ['RELEASE_TAG'] + '/plxnative-hud-simulator-linux-x86_64.tar.gz'
          body = json.dumps({'event_type':'app-release','client_payload':{'simulator':pin}})
          subprocess.run(['gh','api','repos/GLinnik21/plxnative-huds/dispatches','--input','-'],input=body,text=True,check=True)
          PY
