# Feeds the live build-time page at https://plxnative.com/ci/ (site/ci/index.html).
#
# After a CI / Simulator CI run on main finishes this appends the new push runs, with their
# per-job seconds, conclusion and attempt, to ci-history.json on the orphan `ci-metrics` branch
# (tools/ci-history.py). The page reads that file from raw.githubusercontent.com, so a finished
# run shows up without a Pages deploy. Nothing on `main` changes.
#
# WHAT IT COSTS (#487 retired an earlier copy of this over that question): one ubuntu job of about
# 20 s (median 21.5 s, p90 27 s over the 122 runs of the first copy; the very first, backfilling one 59 s),
# which checks out two files, clones the 150 KB data branch at depth 1 and makes a handful of API
# calls. Nothing runs for a pull request, a fork or a cancelled run, a burst of runs collapses
# into at most one running and one waiting job (the group below), and the token holds
# `actions: read` and `contents: write` and nothing else.
#
# Backfill or repair (the first run on a missing branch backfills on its own; --full also closes a
# gap the incremental stop-at-first-known-page rule cannot see, records the verdict and attempt of
# rows written before they were recorded, and finds failures older than the newest stored run):
#   gh workflow run ci-metrics.yml -f full=true
name: CI metrics

on:
  workflow_run:
    workflows: ["CI", "Simulator CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Page through every run instead of stopping at the first page already stored"
        type: boolean
        default: false

# The workflow-level grant is empty; the one job asks for what it needs.
permissions: {}

# One writer at a time; a queued run is not cancelled mid-push (each run is incremental, so a
# superseded queued one loses nothing).
concurrency:
  group: ci-metrics
  cancel-in-progress: false

jobs:
  record:
    name: Record run timings
    # A finished push run of this repository on main, green or red; not a cancelled or skipped one
    # (a newer push superseding it), and not a pull request's run that merely has a branch named main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       contains(fromJSON('["success","failure","timed_out"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    permissions:
      actions: read      # the runs and jobs listings
      contents: write    # the push to the ci-metrics branch, and nothing else
    # One listing pass plus 8 parallel job fetches: about a minute for the whole history, seconds
    # incrementally. 10 bounds a hung API call (unset = 360).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          # Only the collector and the reader it imports, not the tree.
          sparse-checkout: |
            tools/ci-history.py
            tools/ci-durations.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the data branch (or start an orphan one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q data
          git -C data remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # ls-remote --exit-code returns 2 for "no such branch" and something else for a real
          # failure, so a network error cannot silently restart the history as a new orphan.
          rc=0
          git -C data -c "http.https://github.com/.extraheader=${auth}" ls-remote --exit-code --heads origin ci-metrics >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git -C data -c "http.https://github.com/.extraheader=${auth}" fetch --depth=1 origin ci-metrics
            git -C data checkout -q -B ci-metrics FETCH_HEAD
          elif [ "$rc" = 2 ]; then
            echo "no ci-metrics branch yet: starting an orphan one (this run backfills all history)"
            git -C data checkout -q --orphan ci-metrics
          else
            echo "could not list the ci-metrics branch (exit $rc)" >&2
            exit "$rc"
          fi

      - name: Update ci-history.json
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flags=(--max-pages 30)
          if [ "${FULL:-false}" = "true" ]; then flags+=(--full); fi
          python3 tools/ci-history.py --in data/ci-history.json --out data/ci-history.json \
            --repo "$REPO" "${flags[@]}"

      - name: Commit and push to ci-metrics
        working-directory: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add ci-history.json
          if git diff --cached --quiet; then
            echo "ci-history.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "ci-history: update from run ${GITHUB_RUN_ID}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=${auth}" push origin HEAD:refs/heads/ci-metrics
