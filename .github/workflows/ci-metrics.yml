# Feeds the live build-time page at https://plxnative.com/ci/ (site/ci/index.html).
#
# After a CI / Simulator CI / Nightly run finishes this appends the new runs, with their per-job
# seconds, conclusion and attempt, to ci-history.json on the orphan `ci-metrics` branch
# (tools/ci-history.py), and derives ci-summary.json from it and from build-history.json
# (tools/ci-summary.py: the page's "now" block, the slowest list and the regressions). The page reads
# those files from raw.githubusercontent.com, so a finished run shows up without a Pages deploy.
# Nothing on `main` changes.
#
# WHICH RUNS. A developer waits on pull-request runs as much as on a merge, so the runs recorded are
#   * pushes to main of CI and Simulator CI (head_branch main), and
#   * pull_request runs of CI, Simulator CI and the Nightly's dry run, from ANY head branch.
# The earlier `branches: [main]` filter of the workflow_run trigger matched the run's HEAD branch, which
# for a pull request is the PR's own branch, so it would have dropped every one of them; the filter is
# the `if` below now. A cancelled run (a newer push superseding it) triggers this too: it gets no row
# but is counted per day (the collector lists it).
#
# FORK PULL REQUESTS. `workflow_run` fires for a run of a fork's pull request as well (its
# `repository` is this one, its `head_repository` the fork). That is safe here and so they are
# recorded: this workflow runs from main's copy of the file with a token that holds `actions: read` and
# `contents: write`, checks out ONLY three tool files from main (the collector, the summary and the reader the collector imports) (never the pull request's code, never
# `workflow_run.head_sha`), and reads public run and job timings through the API. The rows of a fork's
# run carry `pr: null` (the API gives such a run no `pull_requests` list); everything else is the same.
#
# WHAT IT COSTS (#487 retired an earlier copy of this over that question): one ubuntu job of about
# 20 s (median 21.5 s, p90 27 s over the 122 runs of the first copy; the very first, backfilling one
# 59 s), which checks out three files, clones the small data branch at depth 1 and makes a handful of
# API calls. Nothing runs for a fork's push, a burst of runs collapses into at most one running and
# one waiting job (the group below), and the token holds `actions: read` and `contents: write` and
# nothing else. The first pass after this started recording pull requests backfills up to 90 days of
# them (one jobs call per run, 8 at a time: a few minutes), which is why the limit below is 20, not 10.
#
# THE BRANCH HAS A SECOND WRITER: build-bench.yml files build-history.json on the same branch once a
# day. The files differ, so the only conflict is a lost push race; the publish step below fetches
# the branch tip, starts again from it and retries (3 attempts), and ci-summary.json always reads
# whatever build-history.json the tip holds.
#
# Backfill or repair (the first run on a missing branch backfills on its own; --full also closes a
# gap the incremental stop-at-first-known-page rule cannot see, records the verdict and attempt of
# rows written before they were recorded, finds failures older than the newest stored run and
# fills the per-day counts of cancelled runs for the days an incremental pass does not read):
#   gh workflow run ci-metrics.yml -f full=true
name: CI metrics

on:
  workflow_run:
    workflows: ["CI", "Simulator CI", "Nightly"]
    types: [completed]
  workflow_dispatch:
    inputs:
      full:
        description: "Page through every run instead of stopping at the first page already stored"
        type: boolean
        default: false

# The workflow-level grant is empty; the one job asks for what it needs.
permissions: {}

# One writer at a time; a queued run is not cancelled mid-push (each run is incremental, so a
# superseded queued one loses nothing).
concurrency:
  group: ci-metrics
  cancel-in-progress: false

jobs:
  record:
    name: Record run timings
    # A finished run of this repository: a push to main, or a pull request from any branch or fork.
    # Green, red or cancelled (a cancelled one is only counted); nothing else, and not a run of
    # another event (a schedule, a dispatch, a release).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.repository.full_name == github.repository &&
       contains(fromJSON('["success","failure","timed_out","cancelled"]'), github.event.workflow_run.conclusion) &&
       (github.event.workflow_run.event == 'pull_request' ||
        (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')))
    runs-on: ubuntu-latest
    permissions:
      actions: read      # the runs and jobs listings
      contents: write    # the push to the ci-metrics branch, and nothing else
    # One listing pass per workflow and event plus 8 parallel job fetches: seconds incrementally, a few
    # minutes for the first pull-request backfill. 20 bounds a hung API call (unset = 360).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          # Only the collector, the summary and the reader the collector imports, not the tree.
          sparse-checkout: |
            tools/ci-history.py
            tools/ci-summary.py
            tools/ci-durations.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the data branch (or start an orphan one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q data
          git -C data remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # ls-remote --exit-code returns 2 for "no such branch" and something else for a real
          # failure, so a network error cannot silently restart the history as a new orphan.
          rc=0
          git -C data -c "http.https://github.com/.extraheader=${auth}" ls-remote --exit-code --heads origin ci-metrics >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git -C data -c "http.https://github.com/.extraheader=${auth}" fetch --depth=1 origin ci-metrics
            git -C data checkout -q -B ci-metrics FETCH_HEAD
          elif [ "$rc" = 2 ]; then
            echo "no ci-metrics branch yet: starting an orphan one (this run backfills all history)"
            git -C data checkout -q --orphan ci-metrics
          else
            echo "could not list the ci-metrics branch (exit $rc)" >&2
            exit "$rc"
          fi

      - name: Update ci-history.json and ci-summary.json, and push them
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flags=(--max-pages 30)
          if [ "${FULL:-false}" = "true" ]; then flags+=(--full); fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C data config user.name "github-actions[bot]"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              # Another writer pushed first: start over from the branch tip, with its files in the tree.
              git -C data -c "http.https://github.com/.extraheader=${auth}" fetch --depth=1 origin ci-metrics
              git -C data reset -q --hard FETCH_HEAD
            fi
            python3 tools/ci-history.py --in data/ci-history.json --out data/ci-history.json \
              --repo "$REPO" "${flags[@]}"
            python3 tools/ci-summary.py --history data/ci-history.json --bench data/build-history.json \
              --out data/ci-summary.json
            git -C data add ci-history.json ci-summary.json
            if git -C data diff --cached --quiet; then
              echo "ci-history.json and ci-summary.json unchanged; nothing to commit"
              exit 0
            fi
            git -C data commit -q -m "ci-history: update from run ${GITHUB_RUN_ID}"
            if git -C data -c "http.https://github.com/.extraheader=${auth}" push origin HEAD:refs/heads/ci-metrics; then
              exit 0
            fi
            echo "the push lost a race (attempt ${attempt} of 3); starting again from the branch tip" >&2
          done
          echo "could not push to ci-metrics after 3 attempts" >&2
          exit 1
