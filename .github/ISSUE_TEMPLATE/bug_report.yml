name: Bug report
description: Something in PlxNative does not work, for example playback fails, the app closes or sign-in breaks.
labels: ["bug", "user-report"]
body:
  - type: input
    id: tv-model
    attributes:
      label: TV model
      description: From the sticker on the back, or Settings > About This TV. For example `43LM6300PVB`.
    validations:
      required: true
  - type: input
    id: webos-version
    attributes:
      label: webOS version
      description: For example `webOS 4.10.2`.
    validations:
      required: true
  - type: input
    id: plxnative-version
    attributes:
      label: PlxNative version
      description: For example `0.7.0`, or the nightly's version.
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How you installed PlxNative
      options:
        - Dev Manager (Developer Mode)
        - Homebrew Channel
        - Nightly build
        - Other or not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. For a playback failure, paste the bottom line of the failure screen (it starts with `PlxNative`) or attach a photo.
    validations:
      required: true
  - type: dropdown
    id: playback-mode
    attributes:
      label: Playback details (only if this is about playback)
      description: Was the item playing with Direct Play, or at a quality you chose?
      options:
        - Not about playback
        - Direct Play
        - A quality I chose
        - Automatic quality
        - Not sure
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        How to get them: https://plxnative.com/troubleshooting/#collecting-logs
        Fetch before you reopen the app: the event log is emptied on every launch.
        Logs contain ratingKeys (item numbers on your server), so think before posting publicly.
      placeholder: Attach the log files here.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I have not pasted a Plex token or a passphrase into this issue.
          required: true
