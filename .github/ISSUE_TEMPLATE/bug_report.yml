name: Bug report
description: Something in FinNative does not work, for example playback fails, the app closes or sign-in breaks.
labels: ["bug", "user-report"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for something that is **broken**. If FinNative works on your TV, please [tell us in Discussions](https://github.com/tiper/fin-native/discussions/new?category=compatibility) instead; those reports tell other owners which sets it runs on.
  - type: input
    id: tv-model
    attributes:
      label: TV model
      description: From the sticker on the back, or Settings > About This TV. For example `43LM6300PVB`.
    validations:
      required: true
  - type: input
    id: jellyfin-version
    attributes:
      label: Jellyfin server version
      description: Dashboard > General shows it. For example `10.10.7`.
    validations:
      required: true
  - type: input
    id: webos-version
    attributes:
      label: webOS version
      description: For example `webOS 4.10.2`.
    validations:
      required: true
  - type: input
    id: finnative-version
    attributes:
      label: FinNative version
      description: Settings > About shows it, with the build. For example `0.8.0`.
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How you installed FinNative
      options:
        - Dev Manager (Developer Mode)
        - Homebrew Channel
        - Debug build
        - Other or not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. For a playback failure, paste the bottom line of the failure screen or attach a photo of it.
    validations:
      required: true
  - type: dropdown
    id: playback-mode
    attributes:
      label: Playback details (only if this is about playback)
      description: Was the item playing with Direct Play, or at a quality you chose?
      options:
        - Not about playback
        - Direct Play
        - A quality I chose
        - Automatic quality
        - Not sure
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Fetch them with webOS Dev Manager (Files view): `plxnative-events.log`, `plxnative-crash.log` and `plxnative-stderr.log`,
        in `/tmp/io.github.tiper.finnative/` for the release, or in `/tmp/io.github.tiper.finnative.debug/` for the debug build.
        Fetch before you reopen the app: the event log is emptied on every launch.
        Logs contain item ids from your server, so think before posting publicly.
      placeholder: Attach the log files here.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I have not pasted a Jellyfin access token, API key or password into this issue.
          required: true
